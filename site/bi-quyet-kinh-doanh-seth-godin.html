giao dịch với người có thể từ chối bạn. Tôi từng hướng dẫn hàng ngàn em nhỏ Hướng đạo sinh nữ (Girl Scouts) cách bán bánh quy. Các em dựng quầy trước một siêu thị ở nơi tôi ở lại vài tuần. Khi mọi người bước vào siêu thị, mấy cô bé 9 tuổi cứ hét lên: Cô chú mua bánh quy Hướng đạo sinh không ạ? Mà ai cũng đang vội vào siêu thị nên họ cứ thế đi thẳng. Tôi nói chuyện với người phụ trách nhóm và cô ấy đồng ý cho tôi nói chuyện với các em. Tôi bảo: Này các em, hãy hỏi một câu khác đi. Khi mọi người đi ngang qua, hãy hỏi: Loại bánh quy Hướng đạo sinh yêu thích của cô chú là vị nào ạ? Hóa ra ai cũng có câu trả lời cho câu hỏi đó. Và ngay khi ai đó trả lời, họ đã bắt đầu tương tác với bạn. Vậy là các em vượt qua được rào cản lớn nhất - vì trước đó các em chỉ chờ nhận câu trả lời không, người ta bước qua vì ngại giao tiếp. Nhưng giờ người đó đang nhìn thẳng vào mặt một cô bé 9 tuổi, tất nhiên họ sẽ mua một hộp bánh quy. Doanh số của các em tăng vọt vì đã vượt qua phần khó nhất của cuộc giao tiếp. Vậy nên chúng ta có nỗi sợ. Ta nên gọi tên nỗi sợ đó. Ta không thể làm nó biến mất, nhưng ta có thể khiêu vũ cùng nó. Thử đoán xem? Giao dịch với người lạ chắc chắn sẽ kích hoạt nỗi sợ. Chúng là hình với bóng, hai mặt của một đồng xu. Đừng chối bỏ nó, đừng giả vờ nó sẽ tự biến mất, nó có thật đấy. Và mánh khóe trốn tránh mà mọi người hay dùng là: À, biết rồi, mình chỉ cần đăng thật nhiều ảnh lên Instagram thôi. Vì việc đó bạn đâu có sợ, nên bạn cứ làm suốt, và nó chẳng mang lại kết quả gì cả.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chủ đề tiếp theo tôi muốn đề cập là câu hỏi này: làm sao phân biệt được đâu là sở thích (hobby) và đâu là kinh doanh (business)?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Có hai phần. Thứ nhất: đừng để việc kinh doanh phá hỏng sở thích của bạn. Điều này cực kỳ quan trọng. Đừng để kinh doanh phá hỏng sở thích. Nếu sở thích mang lại niềm vui cho bạn và bạn đủ khả năng chi trả cho nó, hãy cứ giữ nó là sở thích. Nhưng ngay khi bạn biến nó thành công việc kinh doanh, nó không còn là của bạn nữa. Nó là của khách hàng. Khách hàng không mua nến của bạn chỉ vì bạn muốn họ mua. Họ không mua granola của bạn chỉ vì bạn muốn thế. Họ mua vì trong hoàn cảnh đó, sản phẩm của bạn là lựa chọn tốt nhất cho họ. Ai cũng luôn chọn phương án tốt nhất cho mình. Đây là lý do việc bán hàng cho bạn bè thường là thảm họa: bạn đang ngầm bảo rằng nếu cậu là bạn tôi, cậu phải mua thứ không thực sự phù hợp với cậu. Đừng làm thế. Bạn nên xuất hiện và nói: Tôi làm mái chèo thuyền độc mộc. Tôi không làm nhiều đâu. Nếu chiếc mái chèo này đáng giá hơn nhiều so với giá tôi bán, xin mời mua. Nhưng nếu với bạn nó không đáng giá đến thế, đừng mua, vì đây là sở thích của tôi, và tôi hiểu bạn muốn thứ khác với thứ tôi muốn. Thế nên ta lại quay về với tinh thần phụng sự. Người khác không muốn thứ bạn muốn, không thấy thứ bạn thấy, không tin thứ bạn tin. Điều đó hoàn toàn ổn, vì bạn không thể phục vụ họ nếu không thừa nhận sự khác biệt đó là bình thường. Nói vậy chứ vẫn có cơ hội khổng lồ cho những người biết mang đam mê và kỹ năng vào một thứ mà đa số không làm được. Nếu sở thích giúp bạn làm điều đó thì tuyệt. Nhưng đừng biến nó thành một doanh nghiệp phục vụ tất cả mọi người, vì làm thế bạn sẽ tự tay phá hủy nó.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi rất thích sự phân biệt đó. Điều khiến tôi bừng tỉnh nhất là khi ông nói: ngay giây phút nó trở thành kinh doanh, nó không còn là của bạn nữa, nó là của khách hàng. Quá thấm thía. Đó là lý do bán bất động sản không phải là một sở thích.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nó là kinh doanh, vì người ta chỉ làm việc với bạn nếu bạn là lựa chọn tốt nhất giúp họ tìm được ngôi nhà họ cần.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cách đây vài năm có một bức thư gửi tòa soạn tờ Times kể thế này: Bạn thân của chúng tôi bán nhà nhưng nhất quyết không chịu ký gửi qua vợ tôi, giờ tôi không muốn nói chuyện với họ nữa. Chà, nếu bạn kiếm khách bằng cách đó, bạn không hề đang phụng sự. Bạn đang nói: Tôi sẽ tận dụng tình bạn để lấy hợp đồng. Dân chuyên nghiệp không làm việc kiểu đó. Bạn phải là lựa chọn hiển nhiên tốt nhất, nếu không người ta sẽ không chọn bạn.<\/p>"}, {"t": "Vùng trũng (The Dip), Quy tắc 3 bản kế hoạch &amp; Đập tan chủ nghĩa hoàn hảo", "k": "Chương 7", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi nghĩ có rất nhiều người đang nỗ lực hết mình để tìm ra con đường riêng hoặc vấn đề cần giải quyết, và có câu nói nổi tiếng của Jay-Z: Điều thiên tài nhất mà chúng tôi đã làm là không bỏ cuộc. Nhìn lại bản thân mình suốt 16 năm qua, bao nhiêu sự bền bỉ gian khổ và những việc thầm lặng làm trong bóng tối chẳng ai thấy - chẳng hề dễ dàng chút nào. Vậy làm sao để biết khi nào nên bỏ cuộc và khi nào nên kiên trì bám trụ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi là người viết cuốn sách đầu tiên bàn về việc bỏ cuộc. Cuốn đó tên là The Dip (Vùng trũng), và tôi rất ngạc nhiên khi thấy nhiều người đồng cảm với nó đến vậy. Bạn đâu còn mặc váy múa ba-lê đi làm nữa dù hồi sáu tuổi từng học múa ba-lê.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng vậy.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Thế nên ai trong chúng ta cũng từ bỏ nhiều thứ khi lớn lên.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nhưng dần dà, việc bỏ cuộc lại bị coi là hành động đáng xấu hổ - kiểu Tôi là kẻ thất bại, tôi bỏ cuộc. Đó là một sai lầm, bởi phần thưởng cho việc trở thành người giỏi nhất thế giới trong lĩnh vực của bạn là vô cùng lớn. Đúng không? Bạn là người giỏi nhất thế giới trong việc làm chính Mel Robbins. Bạn đứng đầu hạng mục với The Mel Robbins Podcast. Nhưng bạn sẽ không thể làm được điều đó nếu hồi trước bạn không từ bỏ nghề luật sư.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Vì vậy, điều chúng ta cần xác định là: thứ mình đang kiên trì theo đuổi này có tồn tại một vùng trũng - giai đoạn khó khăn trước khi mọi thứ trở nên dễ dàng hơn - hay không? Giống như chuyện ở phòng gym vào tháng Hai. Đa số mọi người đăng ký tập vào tháng Một rồi bỏ vào tháng Hai vì đó là lúc bắt đầu thấy khó. Nếu bạn vượt qua được vùng trũng đó, rõ ràng đến tháng Sáu bạn sẽ có cơ bụng sáu múi.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Vậy nếu bạn nhìn thấy có người đi trước từng vượt qua được vùng trũng này - ví dụ trong ngành bất động sản chẳng hạn, có những nhà môi giới sống rất khỏe mà không cần cày cuốc đến phát điên. Nhưng không ai trong số họ mới vào nghề được 1 năm cả. Họ đều đã vượt qua giai đoạn khó khăn ban đầu. Ngược lại, có những việc ta đâm đầu vào mà chẳng ai từng vượt qua nổi, hoặc thực chất chẳng có vùng trũng nào cả - nó chỉ là một con dốc đi xuống. Bạn không thể hút thuốc lá xuyên qua bệnh khí phế thũng được; nó chỉ ngày càng tệ hơn, tệ hơn và tệ hơn nữa thôi. Vì vậy, ta cần trung thực và tự nhủ: Những chi phí tôi đã bỏ vào công việc này - mồ hôi, nước mắt, xương máu, thời gian, tiền bạc - tất cả đều đã mất rồi. Dù thế nào chúng cũng đã đi qua. Vậy ngày mai, tôi muốn đón nhận những gì công sức đó đã mua lại được như một món quà từ bản thân mình trong quá khứ, hay tôi muốn nói: Không, cảm ơn. Tôi sẽ đi xây dựng một thứ mới mẻ, thứ thực sự chạm được đến những người cần nó? Và nếu bạn hỏi những người từng đưa ra quyết định sáng suốt là dứt bỏ chi phí chìm, hầu hết họ đều nói họ rất mừng vì đã làm vậy.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nếu ai đó đang ấp ủ một ý tưởng kinh doanh - dù là nghề tay trái, một sản phẩm mới, hay thậm chí đang đứng trước một quyết định khó khăn ở nơi làm việc - đâu là một bước nhỏ họ có thể làm ngay hôm nay để tiến về phía trước?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Một người bạn đã dạy tôi mẹo cực kỳ đơn giản mà hay này: hãy viết ra ba bản kế hoạch kinh doanh hoàn toàn khác nhau. Không cần mỗi bản dài ba trang đâu. Chỉ cần rõ: Dành cho ai? Để làm gì? Tôi đang phục vụ ai? Làm sao biết nó có hiệu quả? Ba bản hoàn toàn khác nhau. Với tâm thế là sau đó bạn sẽ xoay vòng quay ngẫu nhiên, mũi tên chỉ vào bản nào thì bạn buộc phải làm đúng bản đó. Lúc này, thay vì say đắm một ý tưởng duy nhất rồi tìm mọi cách bảo vệ nó, bạn có phương án A, B và C. Cách duy nhất để bạn hết si mê phương án A là làm cho phương án B thậm chí còn hay hơn nữa. Và rồi phương án C hoàn toàn khác biệt. Bởi khi buộc phải viết ba kế hoạch khác hẳn nhau, bạn sẽ tư duy bằng toàn bộ não bộ của mình, chứ không chỉ dùng phần não chuyên đi bao biện. Và nếu bạn còn không có thời gian để viết nổi ba bản kế hoạch kinh doanh khác nhau, tôi không nghĩ bạn có đủ thời gian để khởi nghiệp đâu.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi thích ý tưởng đó lắm. Vì ông nói đúng: nếu chỉ có một viễn cảnh duy nhất về cách mọi thứ diễn ra, bạn rất dễ trở nên cứng nhắc.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Hoặc thậm chí đi xa hơn nữa: ba thứ kiểu như Tôi là kiến trúc sư chuyên đắp người tuyết, Tôi sẽ mở công ty xúc tuyết ở Buffalo, New York, hoặc Tôi sẽ nhập khẩu xẻng xúc tuyết. Cả ba đều liên quan đến tuyết, nhưng quy mô hoàn toàn khác nhau, loại hình đầu tư hoàn toàn khác nhau, mọi thứ khác hẳn nhau. Bạn thậm chí có thể áp dụng cách này khi mở tổ chức phi lợi nhuận: tôi muốn mở tổ chức giúp các bà mẹ đơn thân, hay tôi muốn mở tổ chức giúp đối tượng khác - và xem mình sẽ tìm nhà tài trợ cho hướng này so với hướng kia như thế nào.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nhưng khi bước ra với tư cách một người chuyên nghiệp, ta đang nói với mọi người rằng: Tôi muốn bạn trao đổi tiền bạc để lấy thứ tôi sắp làm cho bạn. Đó là điều dân chuyên nghiệp làm. Chúng ta vẫn xuất hiện ngay cả khi không có hứng. Chúng ta xuất hiện đều đặn. Nhưng nếu bạn định làm việc chuyên nghiệp, nó nên hài hòa với cách bạn muốn sống một ngày của mình, nhưng tâm điểm không phải là bạn. Tâm điểm là khách hàng, và tạo được lực hút với khách hàng mới là tất cả.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nhưng khi bước ra với tư cách một người chuyên nghiệp, ta đang nói với mọi người rằng: \"Tôi muốn bạn trao đổi tiền bạc để lấy thứ tôi sắp làm cho bạn.\" Đó là điều dân chuyên nghiệp làm. Chúng ta vẫn xuất hiện ngay cả khi không có hứng. Chúng ta xuất hiện đều đặn. Nhưng nếu bạn định làm việc chuyên nghiệp, nó nên hài hòa với cách bạn muốn sống một ngày của mình, nhưng tâm điểm không phải là bạn. Tâm điểm là khách hàng, và tạo được lực hút với khách hàng mới là tất cả.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chủ nghĩa hoàn hảo (perfectionism) có mặt ở khắp nơi. Ta thấy rõ nó trong đời sống cá nhân, nhưng tôi nghĩ nó còn len lỏi rất tinh vi trong kinh doanh — dù bạn là chủ nhà hàng cứ mãi chỉnh sửa thực đơn cho thật hoàn mỹ, hay là nghệ sĩ với hàng đống tác phẩm dang dở, hay người viết lách cứ mãi sửa câu chữ quảng cáo vì thấy \"chưa đủ sẵn sàng gửi khách\", hay người thợ làm bánh cứ loay hoay chỉnh mãi cái tờ rơi mà chẳng bao giờ phát đi. Làm sao để nhận diện nó và vượt qua nó?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chủ nghĩa hoàn hảo (perfectionism) có mặt ở khắp nơi. Ta thấy rõ nó trong đời sống cá nhân, nhưng tôi nghĩ nó còn len lỏi rất tinh vi trong kinh doanh - dù bạn là chủ nhà hàng cứ mãi chỉnh sửa thực đơn cho thật hoàn mỹ, hay là nghệ sĩ với hàng đống tác phẩm dang dở, hay người viết lách cứ mãi sửa câu chữ quảng cáo vì thấy chưa đủ sẵn sàng gửi khách, hay người thợ làm bánh cứ loay hoay chỉnh mãi cái tờ rơi mà chẳng bao giờ phát đi. Làm sao để nhận diện nó và vượt qua nó?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Dành cho ai và để làm gì? Nếu thứ bạn đang có sẽ giúp cuộc sống của ai đó tốt đẹp hơn, sao bạn dám giữ rịt nó lại?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Sao bạn dám giữ lại một thứ tuy chưa hoàn hảo nhưng đã đạt chuẩn, đã đủ tốt rồi - sao bạn dám giữ nó lại và mặc kệ người kia tiếp tục loay hoay? Thay vào đó, bạn có thể bước ra - không phải cho cả thế giới, chỉ cho một vài người thôi - và nói: Đây, tôi vừa làm cái này, rồi xem chuyện gì xảy ra. Nếu nó không hiệu quả, vài người phát hiện ra nó chưa ổn. Bạn đâu có đang phẫu thuật tim đâu mà sợ, không sao cả. Quay lại sửa cho tốt hơn. Còn nếu nó hiệu quả, hãy tiến lên làm điều mới. Nhưng cái ý nghĩ rằng ta cứ phải làm cho một thứ vốn đã rất tốt trở nên tốt hơn nữa - để làm gì? Dành cho ai? Để làm gì? Nếu nó đang làm đúng nhiệm vụ của mình rồi thì sao? Ví dụ bạn cứ bận rộn chỉnh đi chỉnh lại thực đơn, trong khi khách hàng là đám thanh thiếu niên ăn pizza ở vùng ngoại ô - để làm gì? Bạn chẳng làm được gì để giải quyết vấn đề của chúng cả. Đáng lẽ bạn nên dành toàn bộ thời gian đó để lắp một cái máy hát tự động kiểu mới, tổ chức các chuyến xe buýt cộng đồng, làm những việc thực sự giúp ích cho những người bạn đang phục vụ.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Seth Godin, lời nhắn nhủ cuối cùng của ông là gì?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Việc này rất khó nếu làm một mình. Và nó thực sự rất quan trọng. Nên câu trả lời khá đơn giản: hãy tìm một ai đó và làm cùng họ. Hãy nói về nó. Hãy gọi tên nó thành lời và nói sự thật với chính mình. Hãy chắc chắn rằng bạn đang đo lường đúng thứ cần đo và phớt lờ mọi thứ còn lại, rồi tạo ra sự khác biệt. Hãy làm công việc khiến bạn tự hào, dành cho những người thực sự quan tâm.<\/p>"}, {"t": "Phần kết", "k": "Phần kết", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chà, Seth Godin, tôi vô cùng tự hào về những công việc ông đang làm. Và như ông thấy đấy, tôi thực sự rất trân trọng. Cảm ơn ông vì đã thách thức chúng tôi nâng cao tiêu chuẩn của bản thân, làm những công việc có ý nghĩa và tạo ra sự khác biệt. Tôi đồng ý với ông: ngày thì dài thật đấy, nhưng thời gian trôi nhanh quá, và ông luôn truyền cảm hứng để tôi làm tốt hơn, nghĩ lớn hơn và trung thực tuyệt đối với chính mình. Xin cảm ơn, cảm ơn, cảm ơn ông rất nhiều.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi cũng xin gửi lại lời cảm ơn đến bạn, Mel. Cảm ơn vì đã tạo ra sự khác biệt cho hàng triệu con người. Tuyệt vời lắm.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Và cảm ơn các bạn. Cảm ơn vì đã tìm thời gian và dành thời gian lắng nghe những điều sẽ giúp bạn nâng cao tiêu chuẩn, đưa ra quyết định sáng suốt hơn, và như Seth vẫn thích nói: tạo nên một làn sóng khuấy động (make a ruckus). Và phòng khi chưa có ai nói với bạn điều này, với tư cách là một người bạn, tôi muốn nói rằng tôi yêu quý bạn và tin tưởng ở bạn. Tôi tin vào khả năng tạo dựng một cuộc sống tốt đẹp hơn của bạn, và tất cả những gì Seth chia sẻ hôm nay, những điều ông ấy tha thiết mong bạn cân nhắc, tôi biết chắc chúng sẽ dẫn bạn đến một cuộc sống tốt đẹp hơn. Được rồi. Hẹn gặp lại bạn trong tập tiếp theo nhé. Tôi sẽ chào đón bạn ngay khoảnh khắc bạn bấm nút phát. Cảm ơn bạn đã xem đến tận giây phút cuối cùng. Cảm ơn vì đã chia sẻ tập này với những người bạn quan tâm. Cảm ơn vì đã đăng lên trang LinkedIn của bạn, bởi khi bạn chia sẻ một điều đã tạo ra khác biệt cho mình, chính bạn cũng đang tạo ra khác biệt cho một ai đó khác. Và khi làm điều tốt, cảm giác thật tuyệt vời. Cảm ơn bạn vì điều đó. Và tôi biết bạn đang nghĩ: Hay quá Mel ơi, tập tiếp theo nên xem gì đây? Ồ, bạn sẽ thích tập này lắm đấy. Tập này cực kỳ hay, và tôi sẽ ở đó chào đón bạn ngay khi bạn bấm nút phát.<\/p><p>-----<\/p>"}];

ứng nhắc khi lập kế hoạch?", "o": ["Viết một bản kế hoạch dài 30 trang thật chi tiết trước khi làm.", "Hỏi ý kiến ít nhất 50 người thân và bạn bè.", "Viết ra 3 bản kế hoạch kinh doanh hoàn toàn khác nhau với tâm thế sẵn sàng quay vòng ngẫu nhiên để chọn một bản thực thi.", "Chạy quảng cáo thử nghiệm trên mạng xã hội trước khi lên kế hoạch."], "a": 2, "why": "Viết 3 phương án khác biệt buộc bạn phải tư duy bằng toàn bộ não bộ thay vì chỉ tìm cách bảo vệ phương án đầu tiên."}, {"q": "Theo Seth Godin, bản chất thực sự của <strong>Marketing<\/strong> là gì?", "o": ["Xuất hiện liên tục trên TikTok, Instagram để mọi người quen mặt và mua hàng.", "Kể một câu chuyện tạo ra sự căng thẳng tích cực (tension) — như nỗi lo tụt hậu hay mong muốn đổi thay — và giúp khách hàng giải tỏa sự căng thẳng đó bằng sản phẩm/dịch vụ của bạn.", "Thuê người nổi tiếng quảng bá để đạt hàng triệu lượt xem.", "Giảm giá sâu hơn đối thủ để thu hút tối đa số lượng người mua."], "a": 1, "why": "Lượt xem hay sự quen mặt không tự động chuyển thành doanh số nếu câu chuyện không chạm đúng vấn đề và tạo ra sự chuyển hóa cho khách hàng."}];

var SVG_OK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

var RUN={};

/* ---------- QUIZ TƯƠNG TÁC ---------- */
RUN.quiz=function(){
  var box=$("quiz"),idx=0,score=0,res=[],locked=false,cur=null;
  var best=ld(K_QUIZ,{}).best;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function dots(){return QUIZ.map(function(_,i){var c=i<res.length?(res[i].ok?"ok":"no"):(i===idx?"on":"");return '<span class="'+c+'"></span>'}).join("")}
  function start(){idx=0;score=0;res=[];show()}
  function show(){
    var q=QUIZ[idx];locked=false;
    cur={q:q,o:shuffle(q.o.map(function(t,i){return{t:t,i:i}}))};
    box.innerHTML='<div class="qz qz-card"><div class="qz-top"><span>Câu '+(idx+1)+' / '+QUIZ.length+'</span><div class="qz-dots" aria-hidden="true">'+dots()+'</div></div>'+
      '<p class="qz-q" id="qzq">'+q.q+'</p>'+
      '<div class="qz-opts" role="group" aria-labelledby="qzq">'+cur.o.map(function(o,n){return '<button type="button" class="qz-o" data-n="'+n+'"><span class="l">'+"ABCD".charAt(n)+'</span><span>'+o.t+'</span></button>'}).join("")+'</div>'+
      '<div id="qzfb" aria-live="polite"></div></div>';
    window.__qzKey=function(e){
      if(locked){if(e.key==="Enter"&&document.activeElement.id!=="qzNext"&&$("qzNext")){$("qzNext").click();return true}return false}
      var n=parseInt(e.key,10)-1;if(n<0||n>3||isNaN(n)){n="abcd".indexOf(e.key.toLowerCase());if(n<0)return false}
      pick(n);return true};
  }
  function pick(n){
    if(locked||!cur||!cur.o[n])return;locked=true;
    var q=cur.q,okI=-1;cur.o.forEach(function(o,i){if(o.i===q.a)okI=i});
    var good=cur.o[n].i===q.a;if(good)score++;
    res.push({ok:good,pick:cur.o[n].t,right:q.o[q.a]});
    [].forEach.call(box.querySelectorAll(".qz-o"),function(b,i){
      b.disabled=true;
      if(i===okI){b.classList.add("ok");b.querySelector(".l").innerHTML=SVG_OK}
      else if(i===n){b.classList.add("no");b.querySelector(".l").innerHTML=SVG_NO}
      else b.classList.add("dim");
    });
    box.querySelector(".qz-dots").innerHTML=dots();
    var last=idx===QUIZ.length-1;
    $("qzfb").innerHTML='<div class="qz-fb'+(good?"":" no")+'"><b>'+(good?"Chính xác":"Chưa đúng")+'</b>'+esc(q.why)+'</div>'+
      '<div class="acts"><button class="btn" type="button" id="qzNext">'+(last?"Xem kết quả":"Câu tiếp theo")+'</button></div>';
    $("qzNext").focus({preventScroll:true});
    $("qzNext").onclick=function(){if(last)finish();else{idx++;show();box.scrollIntoView({block:"nearest"})}};
  }
  function finish(){
    window.__qzKey=null;
    var prev=ld(K_QUIZ,{}).best;var isBest=prev==null||score>prev;
    if(isBest)sv2(K_QUIZ,{best:score});
    var msg=score===QUIZ.length?"Trọn điểm. Bạn nắm khá chắc cuộc trò chuyện này.":
            score===QUIZ.length-1?"Rất tốt. Lệch đúng một câu, xem phần giải thích bên dưới là xong.":
            score>=3?"Khá ổn. Vài ý còn lẫn, đọc lại chương liên quan rồi làm lại thử.":
            "Chưa sao cả. Đọc lại các chương rồi thử lần nữa, lần hai thường khá hơn nhiều.";
    var shown=Math.max(prev==null?0:prev,score);
    box.innerHTML='<div class="qz qz-card"><div class="qz-score"><div class="n">'+score+'<small> / '+QUIZ.length+'</small></div><p>'+msg+'</p>'+
      '<span class="qz-best">'+(isBest&&prev!=null&&score>prev?"Điểm cao nhất mới của bạn.":"Điểm cao nhất của bạn: "+shown+" / "+QUIZ.length)+'</span></div>'+
      '<ul class="qz-rv">'+QUIZ.map(function(q,i){var r=res[i];
        return '<li class="'+(r.ok?"ok":"no")+'"><b><span class="mk">'+(r.ok?SVG_OK:SVG_NO)+'</span><span>'+q.q+'</span></b>'+
          (r.ok?'<span class="ans">Bạn chọn đúng: </span>'+r.right:'<span class="your">Bạn chọn: </span>'+r.pick+'<br><span class="ans">Đáp án đúng: </span>'+q.o[q.a])+
          '<br>'+esc(q.why)+'</li>'}).join("")+'</ul>'+
      '<div class="acts"><button class="btn" type="button" id="qzAgain">Làm lại</button><a class="btn sec" href="#ch'+(CH.length)+'" data-go="'+(CH.length-1)+'">Sang checklist hành động</a></div></div>';
    $("qzAgain").onclick=function(){start();box.scrollIntoView({block:"start"})};
  }
  box.addEventListener("click",function(e){var b=e.target.closest(".qz-o");if(b)pick(+b.getAttribute("data-n"))});
  start();
};

/* ---------- CÂU HỎI SUY NGẪM ---------- */
RUN.refl=function(){
  var notes=ld(K_NOTE,{});
  function card(prefix,list,label){return list.map(function(r,i){var id=prefix+i;
    return '<div class="rf"><div class="n">'+label+' '+(i+1)+'</div><h3>'+esc(r.t)+'</h3><p>'+esc(r.q)+'</p>'+
      '<textarea id="t_'+id+'" data-id="'+id+'" rows="4" aria-label="Câu trả lời của bạn cho: '+esc(r.t)+'" placeholder="Viết suy nghĩ của bạn ở đây...">'+esc(notes[id]||"")+'</textarea><div class="st" id="s_'+id+'"></div></div>'}).join("")}
  $("reflA").innerHTML=card("a",REF_A,"Suy ngẫm");
  $("reflB").innerHTML=card("b",REF_B,"Phản biện");
  var ids=[];REF_A.forEach(function(_,i){ids.push("a"+i)});REF_B.forEach(function(_,i){ids.push("b"+i)});
  function count(){var n=0;ids.forEach(function(i){if((notes[i]||"").trim())n++});prog($("reflProg"),n,ids.length,"Đã trả lời {n} / {t} câu")}
  count();
  var timers={};
  function grow(t){t.style.height="auto";t.style.height=Math.max(104,t.scrollHeight+2)+"px"}
  [].forEach.call(document.querySelectorAll(".rf textarea"),function(t){grow(t);
    t.addEventListener("input",function(){var id=t.getAttribute("data-id");grow(t);notes[id]=t.value;$("s_"+id).textContent="Đang lưu...";
      clearTimeout(timers[id]);timers[id]=setTimeout(function(){sv2(K_NOTE,notes);$("s_"+id).textContent="Đã lưu";count()},400)})});
  $("reflCopy").onclick=function(){
    var out=[];function add(p,list){list.forEach(function(r,i){var a=(notes[p+i]||"").trim();if(a)out.push(r.t+"\n"+r.q+"\n→ "+a)})}
    add("a",REF_A);add("b",REF_B);
    var b=$("reflCopy"),txt=out.length?out.join("\n\n"):"";
    if(!txt){b.textContent="Bạn chưa viết câu trả lời nào";setTimeout(function(){b.textContent="Sao chép câu trả lời của mình"},1800);return}
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){b.textContent="Đã sao chép"},function(){b.textContent="Không sao chép được, hãy bôi đen và copy tay"});
    setTimeout(function(){b.textContent="Sao chép câu trả lời của mình"},2200)};
};

/* ---------- CHECKLIST ---------- */
RUN.check=function(){
  var st=ld(K_CK,{});
  $("ck").innerHTML=CHECK.map(function(c,i){return '<button type="button" class="ck" role="checkbox" aria-checked="'+(!!st[i])+'" data-i="'+i+'"><span class="bx">'+SVG_OK+'</span><span class="ct"><b>'+esc(c.t)+'</b><span>'+esc(c.d)+'</span></span></button>'}).join("");
  function upd(){var n=0;CHECK.forEach(function(_,i){if(st[i])n++});prog($("ckProg"),n,CHECK.length,"Đã làm {n} / {t} việc");
    $("ckDone").innerHTML=n===CHECK.length?'<div class="ck-done">Xong cả '+CHECK.length+' việc rồi. Một tuần nữa quay lại đây, nhìn xem việc nào thực sự đổi được điều gì cho bạn.</div>':""}
  upd();
  $("ck").addEventListener("click",function(e){var b=e.target.closest(".ck");if(!b)return;var i=b.getAttribute("data-i");st[i]=!st[i];b.setAttribute("aria-checked",!!st[i]);sv2(K_CK,st);upd()});
};

function render(y){
  var c=CH[S.ch];window.__qzKey=null;
  $("page").innerHTML='<p class="kicker">'+(c.k?c.k+' · ':'')+(S.ch+1)+' / '+CH.length+'</p><h1>'+c.t+'</h1>'+c.body;
  $("barTitle").textContent=BOOK.title;
  document.title=c.t+" · "+BOOK.title;
  $("pager").innerHTML=
    (S.ch>0?'<a class="prev" href="#ch'+S.ch+'" data-go="'+(S.ch-1)+'"><small>← Chương trước</small><strong>'+CH[S.ch-1].t+'</strong></a>':'')+
    (S.ch<CH.length-1?'<a class="next" href="#ch'+(S.ch+2)+'" data-go="'+(S.ch+1)+'"><small>Chương sau →</small><strong>'+CH[S.ch+1].t+'</strong></a>':'');
  $("end").textContent=S.ch===CH.length-1?"Hết sách. Cảm ơn bạn đã đọc.":"";
  [].forEach.call($("tocList").querySelectorAll("a"),function(a,i){if(i===S.ch)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current")});
  if(c.run&&RUN[c.run])RUN[c.run]();
  window.scrollTo(0,y||0);progress();
}
function go(i){if(i<0||i>=CH.length)return;S.ch=i;history.replaceState(null,"","#ch"+(i+1));render(0);closeAll();$("page").focus({preventScroll:true})}

function progress(){
  var h=document.documentElement.scrollHeight-innerHeight;
  var p=h>0?Math.min(100,Math.max(0,scrollY/h*100)):100;
  var total=(S.ch+p/100)/CH.length*100;
  $("prog").style.width=p+"%";$("prog").setAttribute("aria-valuenow",Math.round(p));
  $("pct").textContent=Math.round(total)+"%";
}
var lastY=0,tick;
addEventListener("scroll",function(){
  progress();
  clearTimeout(tick);tick=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify({ch:S.ch,y:Math.round(scrollY)}))}catch(e){}},300);
},{passive:true});

/* mục lục */
$("tocList").innerHTML=CH.map(function(c,i){return (c.grp?'<li class="grp">'+c.grp+'</li>':'')+'<li><a href="#ch'+(i+1)+'" data-go="'+i+'"><span>'+(i+1)+'</span>'+c.t+'</a></li>'}).join("");
document.addEventListener("click",function(e){var a=e.target.closest("[data-go]");if(a){e.preventDefault();go(+a.getAttribute("data-go"))}});

function closeAll(){["toc","set"].forEach(function(i){$(i).classList.remove("on");$(i).setAttribute("aria-hidden","true")});$("scrim").classList.remove("on");$("openToc").setAttribute("aria-expanded","false");$("openSet").setAttribute("aria-expanded","false")}
function open(id,btn,scrim){var on=$(id).classList.contains("on");closeAll();if(!on){$(id).classList.add("on");$(id).setAttribute("aria-hidden","false");$(btn).setAttribute("aria-expanded","true");if(scrim)$("scrim").classList.add("on")}}
$("openToc").onclick=function(){open("toc","openToc",true)};
$("openSet").onclick=function(){open("set","openSet",false)};
$("scrim").onclick=closeAll;

/* tùy chỉnh */
$("fsUp").onclick=function(){S.fs=Math.min(36,S.fs+2);S.fsSet=true;save();applyPrefs()};
$("fsDown").onclick=function(){S.fs=Math.max(15,S.fs-2);S.fsSet=true;save();applyPrefs()};
function seg(id,key,num){$(id).addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var v=b.getAttribute("data-v");S[key]=num?parseFloat(v):v;save();applyPrefs()})}
seg("wSeg","w",true);seg("lhSeg","lh",true);seg("thSeg","theme");
var ICON_MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',ICON_SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function isDarkNow(){return (S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark"}
function syncQuick(){var b=$("themeQuick");if(!b)return;var dk=isDarkNow();b.setAttribute("aria-label",dk?"Chuyển sang nền sáng":"Chuyển sang nền tối");b.innerHTML=dk?ICON_SUN:ICON_MOON}
$("themeQuick").onclick=function(){S.theme=isDarkNow()?"light":"dark";try{localStorage.setItem("theme",S.theme)}catch(e){}save();applyPrefs()};
syncQuick();

/* phím tắt: ←/→ chương, T mục lục, Esc đóng; trong quiz: 1-4 hoặc A-D chọn đáp án */
addEventListener("keydown",function(e){
  if(e.target.closest("input,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(window.__qzKey&&e.key!=="Escape"&&window.__qzKey(e)){e.preventDefault();return}
  if(e.key==="Escape")closeAll();
  else if(e.key==="ArrowRight"&&S.ch<CH.length-1)go(S.ch+1);
  else if(e.key==="ArrowLeft"&&S.ch>0)go(S.ch-1);
  else if(e.key==="t"||e.key==="T")$("openToc").click();
});

applyPrefs();render(savedY);
</script>
</body>
</html>
