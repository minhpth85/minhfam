<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bí quyết kinh doanh và Marketing của Seth Godin · Đọc sách · Minh Fam</title>
<meta name="description" content="Trang đọc ebook: bản dịch cuộc trò chuyện Mel Robbins và Seth Godin về kinh doanh và marketing, kèm quiz tương tác, câu hỏi suy ngẫm và checklist hành động.">
<link rel="icon" type="image/png" href="anh/logo.png">
<link rel="apple-touch-icon" href="anh/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try{var s=JSON.parse(localStorage.getItem('reader')||'{}');var d=document.documentElement;
var t=localStorage.getItem('theme');if(s.theme!=='sepia'&&(t==='dark'||t==='light'))s.theme=t;if(s.theme)d.setAttribute('data-theme',s.theme);window.__theme0=s.theme||null;}catch(e){}
</script>
<style>
:root{
  /* Minh Fam design system (xem site/minhfam.css). Tên biến rút gọn cho trang đọc. */
  --bg:#fbfaf5; --panel:#ffffff; --text:#1f2a22; --strong:#171c18; --muted:#505e4f;
  --line:#e1eae5; --brand:#32854d; --brand-strong:#317345; --on-brand:#ffffff; --chip:#ebf6ee; --note:#ebf6ee; --note-fg:#317345;
  --rule:#4a9b60; --hl:#f6e3a4; --bar:rgba(251,250,245,.92); --bad:#c2412f;
  --fh:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --fb:"Spectral",Georgia,"Times New Roman",serif;
  --fs:21px; --lh:1.63; --measure:680px; --ff:var(--fb);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --bg:#0f1a12; --panel:#18291c; --text:#cbd5cc; --strong:#eef3ee; --muted:#9aa89b;
  --line:#2a3d2e; --brand:#4fb06c; --brand-strong:#6cc487; --on-brand:#0f1a12; --chip:#1f3a26; --note:#1f3a26; --note-fg:#6cc487; --rule:#6cc487; --hl:#5b4a1a; --bar:rgba(15,26,18,.92); --bad:#f07a68; color-scheme:dark}}
:root[data-theme="sepia"]{
  --bg:#f4ecd8; --on-brand:#fbf5e4; --rule:#7a5c2e;  --panel:#fbf5e4; --text:#3b3226; --strong:#2a2218; --muted:#6b5d49;
  --line:#e0d4b8; --brand:#7a5c2e; --brand-strong:#6a4e24; --chip:#ece0c2; --note:#efe2bf; --note-fg:#7a5c2e; --hl:#e8d08a; --bar:rgba(244,236,216,.92); --bad:#b23a29}
:root[data-theme="dark"]{
  --bg:#0f1a12; --panel:#18291c; --text:#cbd5cc; --strong:#eef3ee; --muted:#9aa89b;
  --line:#2a3d2e; --brand:#4fb06c; --brand-strong:#6cc487; --on-brand:#0f1a12; --chip:#1f3a26; --note:#1f3a26; --note-fg:#6cc487; --rule:#6cc487; --hl:#5b4a1a; --bar:rgba(15,26,18,.92); --bad:#f07a68; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

/* thanh tiến độ */
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--brand);z-index:50}

/* thanh công cụ: cố định ở trên cùng khi cuộn */
.bar{position:fixed;top:0;left:0;right:0;z-index:40;height:56px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;transition:transform .25s}
.bar.hide{transform:translateY(-100%)}
.bar .l,.bar .r{display:flex;align-items:center;gap:6px}
.bar .t{font:600 14px/20px var(--fh);color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--fh);color:var(--muted);text-decoration:none}
.ib:hover{border-color:var(--line);color:var(--strong)}

/* bài đọc */
main{padding:96px 20px 40px}
article{max-width:var(--measure);margin:0 auto;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);hyphens:manual}
.kicker{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong);margin:0 0 14px}
article h1{font:600 clamp(30px,5.6vw,42px)/1.14 var(--fb);letter-spacing:-.015em;color:var(--strong);margin:0 0 28px}
article h2{font:600 1.35em/1.25 var(--fb);letter-spacing:-.01em;color:var(--strong);margin:2.2em 0 .6em}
article p{margin:0 0 1.2em}
article p.first::first-letter{font:600 3.4em/.9 var(--fb);float:left;margin:.08em .12em 0 0;color:var(--brand-strong)}
article blockquote{margin:1.8em 0;padding:0 0 0 24px;border-left:3px solid var(--rule);font:italic 400 1.3em/1.4 var(--fb);color:var(--strong)}
article .note{margin:0 0 1.8em;padding:1.1em 1.3em;background:var(--note);border-radius:20px;font-size:.88em;line-height:1.6}
article .note b{display:block;font:600 .78em/1 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--note-fg);margin-bottom:.5em}
article ul{padding-left:1.2em;margin:0 0 1.2em}
article li{margin-bottom:.5em}
article hr{border:0;text-align:center;margin:2.2em 0;color:var(--muted)}
article hr::before{content:"· · ·";letter-spacing:.6em}

/* lời thoại */
article .dl{margin:0 0 1.1em}
article .sp{font-weight:600}
article .sp.s{color:var(--brand-strong)}
article .sp.m{color:var(--strong)}

/* khối tự học: dùng chung */
.tl-lead{margin:0 0 1.4em}
.tl-prog{display:flex;align-items:center;gap:12px;margin:0 0 1.2em;font:600 13px/18px var(--fh);color:var(--muted)}
.tl-prog .tb{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tl-prog .tb i{display:block;height:100%;width:0;background:var(--brand);border-radius:3px;transition:width .35s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid transparent;background:var(--brand);color:var(--on-brand);font:600 14px/20px var(--fh);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brand-strong)}
.btn.sec{background:transparent;color:var(--strong);border-color:var(--line)}
.btn.sec:hover{border-color:var(--brand);background:transparent}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* quiz */
.qz{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px 26px 26px;font-size:1rem;line-height:1.5;box-shadow:0 1px 2px rgba(23,48,29,.05)}
.qz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qz-dots{display:flex;gap:6px;flex:1;max-width:200px}
.qz-dots span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.qz-dots .on{background:var(--rule);opacity:.55}
.qz-dots .ok{background:var(--brand)}
.qz-dots .no{background:var(--bad)}
.qz-q{font:600 1.18em/1.4 var(--fb);color:var(--strong);margin:0 0 1em;letter-spacing:-.005em}
.qz-opts{display:grid;gap:10px}
.qz-o{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);cursor:pointer;font:400 .92em/1.5 var(--fb);color:var(--text);transition:border-color .15s,background .15s,transform .15s}
.qz-o:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.qz-o .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px/1 var(--fh);color:var(--muted);transition:background .15s,border-color .15s,color .15s}
.qz-o:disabled{cursor:default}
.qz-o.dim{opacity:.55}
.qz-o.ok{border-color:var(--brand);background:var(--chip);opacity:1}
.qz-o.ok .l{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.qz-o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel));opacity:1}
.qz-o.no .l{background:var(--bad);border-color:var(--bad);color:var(--on-brand)}
.qz-fb{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--note);font-size:.92em;line-height:1.6;animation:rise .3s ease both}
.qz-fb b{display:block;font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--note-fg)}
.qz-fb.no b{color:var(--bad)}
.qz-card{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qz-score{text-align:center;padding:8px 0 4px}
.qz-score .n{font:600 clamp(56px,14vw,84px)/1 var(--fb);color:var(--brand-strong);letter-spacing:-.02em}
.qz-score .n small{font-size:.4em;color:var(--muted);font-weight:500}
.qz-score p{margin:10px auto 0;max-width:30em;font-size:1em;line-height:1.55}
.qz-best{display:block;margin-top:8px;font:500 13px/18px var(--fh);color:var(--muted)}
.qz-rv{margin:24px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.qz-rv li{padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--bg);font-size:.88em;line-height:1.55}
.qz-rv li b{display:flex;gap:10px;align-items:flex-start;font:600 1em/1.45 var(--fb);color:var(--strong);margin-bottom:6px}
.qz-rv .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);margin-top:1px}
.qz-rv .no .mk{background:var(--bad)}
.qz-rv .ans{color:var(--brand-strong);font-weight:500}
.qz-rv .your{color:var(--bad);font-weight:500}

/* câu hỏi suy ngẫm */
.rf{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:20px 20px 16px;margin-bottom:14px;font-size:1rem;line-height:1.55}
.rf .n{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong);margin-bottom:6px}
.rf h3{font:600 1.08em/1.35 var(--fb);color:var(--strong);margin:0 0 .35em}
.rf p{margin:0 0 .9em;font-size:.94em}
.rf textarea{display:block;width:100%;min-height:104px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:400 .94em/1.6 var(--fb)}
.rf textarea:focus{outline:0;border-color:var(--brand)}
.rf .st{min-height:18px;margin-top:6px;font:500 12px/18px var(--fh);color:var(--muted)}
.priv{font:500 13px/20px var(--fh);color:var(--muted);margin:0 0 1.2em}

/* checklist */
.ck{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px;margin:0 0 10px;border:1.5px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer;font-size:1rem;line-height:1.5;transition:border-color .15s,background .15s}
.ck:hover{border-color:var(--brand)}
.ck .bx{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--muted);display:grid;place-items:center;color:transparent;margin-top:1px;transition:background .15s,border-color .15s,color .15s}
.ck .ct b{display:block;font:600 1em/1.4 var(--fb);color:var(--strong);margin-bottom:3px}
.ck .ct span{display:block;font-size:.9em;line-height:1.55;color:var(--text)}
.ck[aria-checked="true"]{background:var(--chip);border-color:var(--brand)}
.ck[aria-checked="true"] .bx{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.ck[aria-checked="true"] .ct b{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.ck-done{margin:14px 0 0;padding:16px 18px;border-radius:16px;background:var(--note);font-size:.92em;line-height:1.6;animation:rise .3s ease both}

/* cuối chương */
.pager{max-width:var(--measure);margin:56px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-decoration:none;color:var(--text);font-family:var(--fh)}
.pager a:hover{border-color:var(--brand)}
.pager small{display:block;font:600 11px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager strong{display:block;font:600 17px/24px var(--fb);color:var(--strong)}
.pager .next{text-align:right;grid-column:2}
.pager .prev{grid-column:1}
.end{max-width:var(--measure);margin:24px auto 0;text-align:center;font:500 14px/20px var(--fh);color:var(--muted)}

/* ngăn mục lục / cài đặt */
.scrim{position:fixed;inset:0;background:rgba(15,26,18,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px rgba(23,48,29,.18);transition:transform .25s;font-family:var(--fh)}
#toc{top:0;bottom:0;left:0;width:min(380px,90vw);transform:translateX(-102%);overflow:auto;padding:20px;border-radius:0 20px 20px 0}
#toc.on{transform:none}
#set{top:64px;right:12px;width:min(340px,calc(100vw - 24px));padding:20px;border-radius:20px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#set.on{transform:none;opacity:1;pointer-events:auto}
.sheet h3{margin:0 0 14px;font:600 23px/30px var(--fb);color:var(--strong)}
.toc-book{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#toc ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
#toc a{display:flex;gap:12px;align-items:baseline;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--text);font:500 15px/22px var(--fh)}
#toc a span{flex:none;width:22px;color:var(--muted);font-weight:600}
#toc a:hover{background:var(--chip)}
#toc a[aria-current="true"]{background:var(--chip);color:var(--brand-strong);font-weight:600}
#toc li.grp{margin:12px 12px 2px;font:600 11px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.row>label,.row>span{font:600 13px/18px var(--fh);color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font:600 13px var(--fh);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--brand-strong)}
.seg .fsval{display:grid;place-items:center;min-width:44px;padding:0 8px;border-left:1px solid var(--line);border-right:1px solid var(--line);font:600 13px var(--fh);color:var(--strong)}
.themes{display:flex;gap:8px}
.themes button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.themes button[aria-pressed="true"]{border-color:var(--brand)}

@media (max-width:640px){
  :root{--fs:20px}
  main{padding:88px 18px 32px}
  .pager{grid-template-columns:1fr}.pager .next,.pager .prev{grid-column:1}.pager .next{text-align:left}
  .bar .t{display:none}
  .qz{padding:22px 18px 20px;border-radius:20px}
  .qz-o{padding:12px 13px;gap:12px}
}
@media print{.bar,#prog,.pager,.scrim,.sheet,.acts{display:none}main{padding:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="prog" role="progressbar" aria-label="Tiến độ đọc" aria-valuemin="0" aria-valuemax="100"></div>

<div class="bar" id="bar">
  <div class="l">
    <a class="ib" href="thu-vien.html" aria-label="Về Thư viện">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <button class="ib" id="openToc" type="button" aria-label="Mở mục lục" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Mục lục</span>
    </button>
  </div>
  <div class="t" id="barTitle"></div>
  <div class="r">
    <span class="ib" id="pct" style="cursor:default;border-color:transparent">0%</span>
    <button class="ib" id="themeQuick" type="button" aria-label="Chuyển nền sáng/tối"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ib" id="openSet" type="button" aria-label="Tùy chỉnh chữ và nền" aria-expanded="false">
      <span style="font-family:var(--fb);font-weight:600;font-size:17px">Aa</span>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<nav class="sheet" id="toc" aria-label="Mục lục" aria-hidden="true">
  <div class="toc-book">Bí quyết kinh doanh và Marketing của Seth Godin</div>
  <h3>Mục lục</h3>
  <ol id="tocList"></ol>
</nav>

<div class="sheet" id="set" role="dialog" aria-label="Tùy chỉnh đọc" aria-hidden="true">
  <h3>Tùy chỉnh đọc</h3>
  <div class="row"><span>Cỡ chữ</span>
    <div class="seg"><button type="button" id="fsDown" aria-label="Giảm cỡ chữ">A−</button><span class="fsval" id="fsVal" aria-live="polite"></span><button type="button" id="fsUp" aria-label="Tăng cỡ chữ">A+</button></div></div>
  <div class="row"><span>Độ rộng dòng</span>
    <div class="seg" id="wSeg"><button type="button" data-v="600">Hẹp</button><button type="button" data-v="680">Vừa</button><button type="button" data-v="760">Rộng</button></div></div>
  <div class="row"><span>Giãn dòng</span>
    <div class="seg" id="lhSeg"><button type="button" data-v="1.5">Chặt</button><button type="button" data-v="1.63">Vừa</button><button type="button" data-v="1.85">Thoáng</button></div></div>
  <div class="row" style="margin-bottom:0"><span>Nền</span>
    <div class="themes" id="thSeg">
      <button type="button" data-v="light" aria-label="Nền sáng" style="background:#fbfaf5"></button>
      <button type="button" data-v="sepia" aria-label="Nền giấy ngả vàng" style="background:#f4ecd8"></button>
      <button type="button" data-v="dark" aria-label="Nền tối" style="background:#0f1a12"></button>
    </div></div>
</div>

<main>
  <article id="page" tabindex="-1"></article>
  <div class="pager" id="pager"></div>
  <p class="end" id="end"></p>
</main>

<script>
/* ===== NỘI DUNG SÁCH =====
   CH: các chương của bản dịch (sinh từ Google Docs). Quiz, câu hỏi suy ngẫm và checklist ở các mảng bên dưới;
   ba chương cuối (tự học) được ghép từ các mảng đó. */
var BOOK={title:"Bí quyết kinh doanh và Marketing của Seth Godin",author:"Bản dịch podcast Mel Robbins × Seth Godin"};
var CH=[{"t": "Phần mở đầu", "k": "Mở đầu", "body": "<div class=\"note\"><b>Về bản đọc này<\/b>Đây là bản dịch tiếng Việt cuộc trò chuyện giữa Mel Robbins và Seth Godin trên The Mel Robbins Podcast, được chia thành chương để dễ đọc. Nội dung gốc thuộc về những người thực hiện chương trình. Cuối sách có quiz, câu hỏi suy ngẫm và checklist để bạn làm ngay.<\/div><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Hôm nay, bạn và tôi sẽ cùng trò chuyện về một chủ đề mà tôi nhận được vô số câu hỏi. Dù bạn đang làm công ăn lương và muốn kiếm thêm thu nhập, được thăng chức và tiến xa hơn, hay đang ấp ủ ước mơ tự kinh doanh riêng, thì đây chính là tập podcast mà bạn đang tìm kiếm. Khách mời hôm nay là nhân vật có một không hai: Seth Godin. Seth được mệnh danh là cha đẻ của ngành marketing hiện đại và là tác giả sách bán chạy với hơn 20 đầu sách. Ông cũng là người mà suốt 15 năm qua tôi luôn coi như người thầy dẫn dắt từ xa, và hôm nay ông sẽ chia sẻ những bí quyết kinh doanh giúp bạn thực sự bứt phá.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tại sao chúng ta không làm những công việc xứng đáng để làm? Tại sao chúng ta không hít một hơi thật sâu và tự nhủ: Cuộc đời này ngắn lắm. Tại sao phải lãng phí một phút, một ngày hay một năm chỉ để làm công việc cho xong chuyện nếu bạn còn có lựa chọn khác? Tôi từng khởi nghiệp nhiều lần, và hầu hết trong số đó chẳng kiếm được nhiều tiền. Không sao cả. Cũng giống như Picasso vẽ rất nhiều tranh, nhưng chỉ một vài bức trở nên nổi tiếng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ôi, tôi thích câu đó quá. Làm sao để biết khi nào nên dừng lại?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Bạn đâu còn mặc váy múa ba-lê đi làm nữa, dù hồi sáu tuổi bạn từng đi học múa ba-lê.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng vậy.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Và thế là ai trong chúng ta cũng đều từ bỏ những thứ nào đó khi trưởng thành. Điều chúng ta cần xác định là: liệu có một vùng trũng (a dip) hay không - tức là giai đoạn khó khăn trước khi mọi thứ trở nên dễ dàng hơn. Giống như chuyện xảy ra ở phòng tập gym vào tháng Hai vậy. Hầu hết mọi người bỏ tập vào tháng Hai vì đó là lúc bắt đầu thấy oải. Nếu bạn vượt qua được vùng trũng đó, rõ ràng là đến tháng Sáu bạn sẽ có cơ bụng sáu múi. Tôi hiểu mà. Tôi từng đến những nơi mà người ta phải làm việc hôm nay để có cái ăn cho ngày mai. Nhưng nếu bạn không thuộc hoàn cảnh đó, thì liệu chúng ta đang viện cớ đổ lỗi cho hệ thống, hay đang làm cho hệ thống trở nên tốt đẹp hơn?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chào các bạn, mình là Mel và mình vô cùng hào hứng khi được học hỏi và truyền cảm hứng từ Seth Godin. Bạn chắc chắn sẽ không còn là con người cũ sau khi xem tập này hôm nay. Nhưng có một chuyện thế này. Đội ngũ của mình vừa báo rằng 57% số người xem podcast The Mel Robbins trên YouTube vẫn chưa bấm đăng ký kênh (Subscribe). Làm sao để biết bạn chưa đăng ký? Nút đăng ký đang sáng lên ngay lúc này đấy. Bấm đăng ký hoàn toàn miễn phí. Mình biết bạn là người luôn thích ủng hộ những người đang hỗ trợ bạn. Vì vậy, mình xin cảm ơn bạn trước. Cảm ơn bạn đã bấm đăng ký. Đó là cách tuyệt vời nhất để cho đội ngũ của mình thấy bạn yêu thích những gì tụi mình đang làm. Điều đó cũng giúp tụi mình tiếp tục mời được những chuyên gia đẳng cấp thế giới như Seth Godin - tác giả của 20 cuốn sách bán chạy liên tiếp. Ông ấy sắp chia sẻ với bạn những giá trị sâu sắc chưa từng có. Mình không muốn bạn bỏ lỡ bất kỳ điều gì. Đó là lý do nút đăng ký rất quan trọng. Cảm ơn bạn đã làm điều đó. Nào, hãy cùng bắt đầu chương trình. Seth Godin, chào mừng ông đến với The Mel Robbins Podcast.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cảm ơn Mel.<\/p>"}, {"t": "Làm công việc xứng đáng &amp; Hai câu hỏi cốt lõi (Dành cho ai? &amp; Để làm gì?)", "k": "Chương 1", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi thực sự rất phấn khích khi ông có mặt ở đây, bởi ông đã có sức ảnh hưởng vô cùng lớn đối với tôi - từ cách tôi tư duy về marketing, tạo ra tác động, điều hành doanh nghiệp, cho đến giá trị bản thân và sự tự tin. Tôi rất háo hức vì tôi hình dung được điều sắp diễn ra: cuộc trò chuyện này sẽ là một nguồn tài nguyên miễn phí dành cho bất kỳ ai đang có một ý tưởng, một doanh nghiệp nhỏ, một công việc tay trái, hoặc đơn giản là muốn thành công hơn - để nhận được sự cố vấn và lời khuyên từ người mà tôi cho là giỏi nhất thế giới trong lĩnh vực này.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cảm ơn Mel, bạn thật tử tế. Lý do để làm công việc này là để mọi người mang lại những điều tốt đẹp cho thế giới. Vậy nên tôi sẽ ghi nhận buổi trò chuyện hôm nay là một điều tốt đẹp. Cảm ơn bạn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Không có gì, và cảm ơn ông. Điều gì có thể thay đổi nếu bạn thực sự ghi tâm tất cả những gì ông ấy sắp chia sẻ về kinh doanh, marketing, thành công, sự tự tin, việc tạo ra tác động và áp dụng chúng vào cuộc sống của mình?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Hy vọng của tôi là những câu chuyện và ý tưởng chúng ta bàn hôm nay sẽ giúp bạn tìm thấy sự thấu cảm để xuất hiện vì mọi người, giúp họ đi đến nơi họ muốn đến. Bởi vì một khi bạn làm được điều đó, bầu trời chính là giới hạn. Nếu bạn giải quyết được vấn đề cho mọi người, họ sẽ quay lại và nhờ bạn làm điều đó thêm nữa.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Seth này, trước khi chúng ta đi sâu vào tất cả những điều ông sắp hướng dẫn về việc khởi nghiệp, vận hành doanh nghiệp và thành công trong kinh doanh, thì tất cả những nguyên tắc này cũng áp dụng cho sự thành công trong sự nghiệp cá nhân. Làm thế nào để kiếm nhiều tiền hơn, được thăng chức - mọi thứ đều sẽ hiệu quả với bạn. Bởi sự thật là không phải ai cũng muốn khởi nghiệp, không phải ai cũng nên khởi nghiệp, và rất nhiều người muốn khởi nghiệp hiện vẫn đang làm công việc toàn thời gian mà họ vẫn muốn gặt hái thành công ở đó. Nếu chỉ có một lời khuyên duy nhất về thế giới kinh doanh và marketing để thành công và viên mãn hơn trong năm nay, ông sẽ nói gì?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tại sao chúng ta không làm những công việc xứng đáng để làm? Tại sao chúng ta không hít một hơi thật sâu và tự nhủ: Cuộc đời này ngắn lắm. Tôi sẽ không bao giờ nói câu tôi chỉ đang làm cho xong việc nữa. Tại sao phải lãng phí một phút, một ngày hay một năm chỉ để làm công việc cho xong chuyện nếu bạn còn có lựa chọn khác?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi nghĩ chúng ta cần tự hào về công việc của mình. Tôi hiểu chứ. Tôi từng đến những nơi mà người ta phải làm việc hôm nay để có cái ăn cho ngày mai. Nhưng nếu bạn không thuộc hoàn cảnh đó, tôi nghĩ bạn cần nâng tiêu chuẩn của mình lên. Và bạn cần tự hỏi: Chúng ta có tự hào về điều này không? Nếu mẹ tôi đang nhìn, tôi có muốn bà thấy những gì chúng ta đang làm không? Chúng ta đang viện cớ đổ lỗi cho hệ thống, hay đang làm cho hệ thống trở nên tốt đẹp hơn?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Một trong những câu nói tôi thích nhất là: Bạn không bị kẹt trong dòng xe cộ, chính bạn là dòng xe cộ. Và bạn nên suy ngẫm xem câu đó có nghĩa là gì.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nó có nghĩa là gì ạ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chà, phàn nàn về chuyện kẹt xe thì dễ lắm. Nhưng nếu bạn không lái xe ra con đường đó, có lẽ hôm nay đã không kẹt xe.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Thế nhưng tất cả chúng ta đều hăm hở bước vào một hệ thống nào đó chỉ vì nghĩ mình không có lựa chọn. Nhưng thực tế là bạn đã không ngồi chờ đài Dateline hay 60 Minutes gọi điện bảo: Chúng tôi sẽ đưa chương trình của bạn lên sóng truyền hình quốc gia. Bạn đã tự mình bắt đầu một chương trình. Có những người nói: Tôi không đồng tình với guồng máy đại học công nghiệp, nên tôi sẽ tạo ra thứ gì đó mở lối đi cho sinh viên nghỉ một năm (gap year). Có những người nói: Tôi không thích cách các tổ chức phi lợi nhuận giải quyết nạn đói, nên tôi sẽ xây dựng một cách hoàn toàn khác để kết nối thông tin. Họ không muốn chỉ là dòng xe kẹt. Họ muốn hành động.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi nghĩ điểm khởi đầu của tôi mỗi lần đều là: Công việc tôi đang làm này - nó dành cho ai, và nó dùng để làm gì?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nếu bạn không thể trả lời hai câu hỏi đó một cách thật cụ thể, hãy quay lại, tua ngược 30 giây và bắt đầu lại. Chính xác thì việc này dành cho ai? Nhóm khán giả khả thi nhỏ nhất (smallest viable audience) là ai? Bao nhiêu người là đủ? Và sự thay đổi mà tôi muốn tạo ra là gì? Khi nhìn vào một cuốn sách của bạn chẳng hạn - nó thành công vang dội không phải vì bán được 40 triệu bản, mà vì đúng người đã mua nó vì đúng lý do và nó tạo ra một sự thay đổi thực sự. Vậy nên hãy làm thật rõ: nó dành cho ai và để làm gì? Và phần thứ hai là phát triển sự thấu cảm để nhận ra rằng người khác không muốn thứ bạn muốn. Họ không nhìn thấy thứ bạn thấy. Họ không cần thứ bạn cần, và điều đó hoàn toàn ổn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nghe cứ như hai thông điệp hơi trái ngược nhau ấy nhỉ? Dành cho ai và để làm gì. Ví dụ tôi là một thợ làm tóc, nhiếp ảnh gia hay môi giới bất động sản và tôi tự hỏi Dành cho ai và để làm gì?, rồi tôi kiểu: À, thì dành cho người cần cắt tóc. Để làm gì? Để họ thấy vui vẻ hơn?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> ...thì cứ làm nghề cắt tóc bình thường đi.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Được rồi.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Bởi vì nếu phương châm của bạn là bạn có thể chọn bất kỳ ai và tôi chính là bất kỳ ai đó, thì bạn tiêu rồi.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> À.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng không? Đó từng là sức hút của Google ngày xưa. Nếu bạn thắng được từ khóa tìm kiếm khách sạn hay tiệm làm tóc, kiểu bạn đang tìm ai đó, còn tôi là ai đó đây. Cách đó không giúp được bạn đâu. Gần nhà tôi có một tiệm làm tóc chỉ phục vụ phụ nữ tóc xoăn. Cô ấy chỉ làm đúng việc đó. Tuyệt vời. Nếu bạn bị hói, đừng đến. Nếu bạn là đàn ông, đừng đến. Nếu bạn không có tóc xoăn, đừng đến. Nếu bạn tóc xoăn nhưng muốn cắt tóc giá rẻ, cũng đừng đến. Một ngày tôi chỉ cắt được cho 10 người. Thế là đủ. Dành cho ai? Dành cho những người muốn có diện mạo theo cách tôi muốn giúp họ đạt được. Để làm gì? Để mang lại cho họ một trải nghiệm khiến họ thấy số tiền bỏ ra hoàn toàn xứng đáng. Thế thôi. Dành cho ai? Để làm gì? Và giờ, nếu có ai đó đến bảo: Tôi có thể quảng bá cho cô ở chỗ này, làm thế này thế kia, bạn có thể nói: Không, cảm ơn. Tôi biết rõ đối tượng của mình là ai. Tôi biết mục đích của mình là gì. Đây sẽ là một công việc tuyệt vời.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Điều thiên tài ở hai câu hỏi đó trong ví dụ ông vừa nêu - dành cho ai, để làm gì - là nó buộc bạn phải cực kỳ trung thực với bản thân về việc mình đang làm và lý do mình làm điều đó.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng vậy. Điều này dẫn đến hai hệ quả rất thú vị. Thứ nhất, bạn cần có khả năng thường xuyên nói: Xin lỗi, cái này không dành cho bạn. Không cần áy náy. Mấy món bánh này đắt quá. Xin lỗi, chúng không dành cho bạn. Và thứ hai là bạn có thường xuyên giới thiệu khách sang cho người mà người ta có thể coi là đối thủ của bạn không? Nếu bạn chưa bao giờ làm điều đó, nghĩa là bạn vẫn đang mắc kẹt trong tâm thế tôi phục vụ bất kỳ ai. Nhưng cô thợ làm tóc xoăn kia thì sao?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vâng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nếu bạn bước vào với mái tóc thẳng và cắt mái ngang, cô ấy sẽ bảo: Ồ, qua chỗ David ở cuối phố đi. Nếu bạn là đại lý Ferrari và có người đến bảo: Tôi cần xe chở bảy đứa trẻ đi học, họ sẽ không cố thuyết phục bạn mua một chiếc Enzo. Họ sẽ nói: Anh rể tôi có đại lý Volvo đấy, để tôi gọi trước cho bạn. Sự hào phóng khi xác định rõ phân khúc sẽ mang lại những lợi ích khổng lồ. Nếu bạn lúc nào cũng cố gom tất cả mọi thứ, bạn sẽ kiệt sức.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi muốn đi qua thêm vài ví dụ nữa vì phần nền tảng này thực sự...<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Mọi người hay bỏ qua phần này lắm.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Bạn bỏ qua và tôi biết tại sao bạn bỏ qua. Bạn bỏ qua vì khi mới bắt đầu, bạn nghĩ chẳng có ai tìm đến mình cả. Và khi mới bắt đầu, bạn sợ chết khiếp rằng nếu mình tạo ra sự khác biệt quá rõ, mình sẽ mất khách, và tôi hiểu điều đó. Kiểu như bạn còn phải trả hóa đơn, bạn có những mục tiêu, nên bạn nghĩ: À, nếu mình tự giới hạn bản thân, mình đang tự giới hạn cơ hội của mình.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nhưng tôi đoán là nếu bạn tiếp thị cho tất cả mọi người, thì chẳng khác nào bạn không tiếp thị cho ai cả.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chính xác.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Và nếu bạn sẵn sàng nhận làm mọi thứ, thì thực chất bạn chẳng đại diện cho điều gì cả.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng vậy. Hai công việc phổ biến nhất ở Mỹ là môi giới bất động sản và tài xế xe tải.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vâng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cả hai nghề này đều mắc đúng căn bệnh đó.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vậy ông sẽ áp dụng điều này cho tài xế xe tải như thế nào? Dành cho ai? Để làm gì?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nếu một tài xế xe tải nói: Tôi lái xe tải, bạn cần tôi chở đi đâu?, thì bạn chỉ là một mặt hàng phổ thông. Công ty vận tải sẽ thuê người rẻ nhất có thể. Nhưng nếu bạn là tài xế xe tải có kỹ năng chuyên biệt để vận chuyển những chiếc xe hơi sưu tầm siêu đắt tiền...<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> ...thì lúc này bạn có thể trở thành người giỏi nhất thế giới trong việc đó.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Bạn là duy nhất, đúng không? Gọi cho tôi anh Terry. Terry biết cách làm việc này. Ban đầu sẽ khó hơn vì bạn buộc phải làm cực kỳ tốt, không thể chỉ làm ở mức trung bình.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nhưng sau đó thì tuyệt vời hơn nhiều. Còn với môi giới bất động sản: Ồ, tôi có danh thiếp in ảnh nhỏ xíu của mình giống hệt mọi người. Tôi bắt đầu gọi nhóm mình là một team vì ai cũng làm thế, chúng tôi ký với công ty nhượng quyền lớn nhất vì ai cũng làm thế, và tôi tham gia hệ thống niêm yết chung để có thể bán hay mua bất kỳ căn nhà nào. Chà, nếu bạn biến mất, tôi cũng chẳng sao, tôi tìm người khác làm cùng. Bạn không phải là người duy nhất. Nhưng hãy xem hai ví dụ này. Có một nhà môi giới ở Thành phố New York, theo tôi biết, chỉ mua và bán căn hộ trong đúng một tòa nhà hạng sang. Thế là đủ. Nếu bạn bán những căn hộ 8 triệu đô, bạn không cần bán quá nhiều căn. Và nếu bạn sống trong tòa nhà đó, chắc chắn bạn biết anh ta. Có khi chính anh ta đã bán căn hộ cho bạn. Bằng cách tập trung tuyệt đối vào tòa nhà nơi mình sống, anh ta trở thành người duy nhất. Thế là đủ, thậm chí là quá đủ. Hoặc tôi nhớ đến một nhà môi giới ở thị trấn của tôi. Bố anh ta từng làm môi giới trước đó. Khi chúng tôi đi xem nhà ở thị trấn, anh ta cho bạn lên xe và chở đi dạo một vòng qua tất cả 2.000 ngôi nhà, đặc biệt là những ngôi nhà không hề rao bán. Anh ta kể cho bạn nghe ai sống ở đâu, tại sao họ sống ở đó, và tuyệt nhiên không cố bán nhà cho bạn. Anh ta quen tất cả các giáo viên. Đội Hướng đạo sinh nhí có thể họp ngay trong văn phòng của anh ta. Anh ta giống như thị trưởng dù không phải thị trưởng. Bạn muốn mua nhà cách đó hai thị trấn ư? Đừng gọi anh ta. Phí công lắm. Đúng không? Một nơi thôi, anh ta đại diện cho một giá trị rõ ràng. Một người môi giới khác tôi biết đã xây dựng được tệp khách hàng riêng mà không hề vi phạm pháp luật nào, trong đó phần lớn khách hàng của cô là phụ nữ đồng tính nữ. Họ thấy thoải mái với cô, cô thấy thoải mái với họ, và cô là lựa chọn duy nhất. Bạn không cần phải cố trở thành thứ gì đó cho tất cả những người khác.<\/p>"}, {"t": "Sự thật về vận hành kinh doanh &amp; Dũng khí bắt đầu từ hạt mầm ý tưởng", "k": "Chương 2", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Để tôi đưa cho ông một mô hình kinh doanh mà thực tế tôi có ba người bạn đang thử nghiệm. Đó là kinh doanh ngũ cốc granola.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi có một công thức làm granola mà tôi rất mê. Bạn bè khen ngon tuyệt. Tôi thích làm, đóng gói lại rồi đem tặng. Mọi người đều thích. Vài năm nay tôi cứ nghĩ hay là mình mang ra chợ nông sản bán thử xem sao. Nghe ông nói nãy giờ, tôi tự hỏi: được rồi, dành cho ai, để làm gì, làm sao áp dụng những nguyên tắc nền tảng này cho một người chuẩn bị mang hàng ra bán vào thứ Bảy tuần này?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi muốn trả lời một câu hỏi khác trước, rồi mình sẽ quay lại câu này.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tuyệt vời.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Kinh doanh hầu như không bao giờ là về thứ bạn trực tiếp làm ra ngay lúc này.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi biết vài đứa trẻ lớn lên muốn làm nhạc sĩ, rồi cuối cùng đi làm trong ngành công nghiệp âm nhạc. Vậy chúng dành cả ngày để làm gì? Ngồi họp và làm việc với tủ hồ sơ. Đáng lẽ chúng nên đi làm ở công ty luật còn hơn, vì công việc chẳng dính dáng gì đến âm nhạc ngoài việc có tên Elvis Presley in trên một món đồ chúng làm ra. Tương tự, bước vào ngành kinh doanh granola gần như chắc chắn có nghĩa là bạn sẽ không tự tay làm granola nữa. Kinh doanh granola không phải là đứng làm granola. Kinh doanh granola là tạo ra một câu chuyện và một sản phẩm mà mọi người vui vẻ trả giá cao hơn chi phí sản xuất để mua và kể cho bạn bè họ nghe. Đó là bài toán về hậu cần (logistics), marketing, bao bì, dịch vụ khách hàng, tài chính, chuỗi cung ứng và quản lý con người. Số lần bạn đứng trong bếp sáng tạo ra một loại granola mới gần như bằng không. Vì thế, chúng ta nên hít một hơi thật sâu trước khi bước vào và tự hỏi: bạn muốn dành một ngày của mình như thế nào? Bạn sẽ không dành cả ngày để nướng granola đâu. Vợ tôi điều hành một trong những tiệm bánh không chứa gluten (gluten-free) lớn nhất nước Mỹ.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Thật sao ạ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Thật đấy.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Hình như tôi chưa biết chuyện này.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Ừ, bánh của cô ấy có mặt ở 700 cửa hàng trên toàn quốc.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ông đùa à? Tiệm bánh tên gì vậy?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> By the Way.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nhân tiện (By the way), tôi thật sự không biết chuyện này đấy, Seth.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> ...có bán ở Whole Foods và cô ấy có bốn cửa hàng bán lẻ ở New York.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chúc mừng nhé.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chà, tôi sẽ chuyển lời lại cho vợ. Tất cả là của cô ấy. Thỉnh thoảng tôi chỉ đi giao bánh trong trường hợp khẩn cấp thôi. Nên nếu bạn đặt bánh thiết kế riêng mà thấy tôi xuất hiện giao hàng thì đúng là thật đấy.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ôi, tôi thích chi tiết đó quá.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cô ấy không dành thời gian để làm bánh brownie. Đó không phải việc của cô ấy. Có hơn 80 người làm việc ở đó mà. Dĩ nhiên cô ấy không tự nướng bánh. Đó không phải việc bạn làm. Bạn là trường hợp ngoại lệ đấy, Mel Robbins, vì bạn làm podcast. Nếu bạn cử người khác vào nói thay, khán giả sẽ nhận ra ngay.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng vậy.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Trời ơi, tôi cũng mong là vậy.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nhưng mọi công việc kinh doanh khác thì không như thế. Việc của bạn là tạo ra hệ thống và điều kiện để doanh nghiệp phát triển. Và bạn sẽ thuê người làm granola. Bạn có thể duyệt chất lượng granola. Nhưng bạn biết đấy, Martha Stewart đâu có ngồi đó tự làm granola. Vì vậy, điều tôi khuyên mọi người là: đừng chọn một ngành kinh doanh hào nhoáng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đừng chọn ngành nào mà ai ai cũng đang xôn xao bàn tán, vì nơi đó sẽ chật kín những người làm kiểu tài tử, làm cho vui. Thay vào đó, hãy chọn một mô hình kinh doanh giải quyết vấn đề cho những người có dư dả tiền bạc để chi trả cho việc giải quyết vấn đề đó. Nhờ vậy, bạn có được vùng an toàn để sống cuộc đời mình mong muốn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Seth, tôi hoàn toàn hiểu điều ông đang nói. Tôi chỉ muốn nhấn mạnh thêm tầm quan trọng sâu sắc, có thể thay đổi cuộc đời của việc bạn tự cho phép mình dấn thân vào thứ mình luôn muốn làm - ngay cả khi nó không giúp bạn trả hóa đơn, ngay cả khi nó không thành công rực rỡ. Bởi nếu nhìn vào những câu hỏi đó: nó dành cho ai? Nó để làm gì? Nó phục vụ ai? Điều gì xảy ra khi bạn bắt tay vào làm? Bạn muốn biết bạn làm nó cho ai không? Bạn làm cho chính mình. Bạn muốn biết bạn làm để làm gì không? Để bạn có thể tự hào về bản thân. Để bạn gặp gỡ thêm nhiều người. Để bạn có trải nghiệm tự mình chứng kiến bản thân vượt qua sự trì hoãn và nỗi sợ. Điều đó có giá trị, và tôi muốn bạn làm điều đó. Tôi muốn bạn mở gian hàng Etsy. Tôi muốn bạn làm kênh YouTube. Tôi muốn bạn thử bán granola. Nhưng điều ông đang nói đến, Seth, là một câu chuyện khác. Ông đang nói đến chuyện gì sẽ xảy ra nếu nó thành công vang dội, và đột nhiên những lý do ban đầu khiến bạn làm việc đó - làm cho chính mình - giờ lại thay đổi vì bạn đã bước vào ngành vận chuyển, ngành quản lý nhân sự. Chúng ta sẽ nói về chuyện đó ngay sau đây. Nhưng tôi nghĩ việc nói về hạt mầm của một ý tưởng, cho phép bản thân và tìm kiếm dũng khí để dấn thân vào nó là vô cùng quan trọng. Tôi nhớ hồi học cấp ba, mẹ tôi và cô bạn thân nhất của bà, cô Susie, quyết định mở một cửa hàng đồ bếp cao cấp nhỏ ở Muskegon, Michigan. Hãy hình dung giống như Williams Sonoma vào đầu những năm 80, khi chưa ai làm mô hình đó cả. Bà từng đi hội chợ quà tặng ở Chicago và đi du lịch đâu đó cùng bố tôi, rồi phát hiện ra cà phê có hương vị (flavored coffee).<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng rồi.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ý tôi là hồi đó chẳng ai uống cà phê vị hạt phỉ hay caramel cả, và bà có một tầm nhìn lớn, kiểu: Mình sẽ làm cái này. Mình sẽ mở cửa hàng này. Bà không biết liệu có ai khác ở thị trấn thích cà phê hương vị không. Bà chỉ cảm thấy đó là điều mình muốn làm, có thể sẽ hiệu quả, thế là bà và cô Susie bắt tay làm, và nó thành công thật. Nó không trở thành một chuỗi nhượng quyền khổng lồ, nhưng nó trở thành một phần thân thuộc của cộng đồng. Nó mang lại cho bà rất nhiều niềm vui. Tôi rất muốn ông chia sẻ về phép màu sâu sắc mà người ta cảm nhận được khi nhận ra hạt mầm ý tưởng đó, dù chẳng biết liệu có ai mua nến của mình không. Ông có thể nói về tinh thần đó ở một con người và lý do tại sao nó lại quan trọng đến vậy không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Vậy tại sao tôi lại phải bận tâm làm công việc này? Tôi bắt đầu kinh doanh lần đầu năm 14 tuổi. Và tôi đã trải qua hàng loạt công việc kinh doanh, hầu hết chẳng kiếm được nhiều tiền. Không sao cả. Cũng giống như Picasso vẽ rất nhiều tranh, nhưng chỉ một vài bức trở nên nổi tiếng. Hành động bước ra làm cho mọi thứ tốt đẹp hơn vì người khác - dù bạn là y tá tình nguyện ở viện dưỡng lão hay đang xây dựng một công ty - trong nền văn hóa chúng ta đang sống, điều đó thật sự phấn khích. Nó vô giá. Chúng ta có được phẩm giá. Chúng ta có được uy tín. Và chúng ta xây dựng được cộng đồng. Đó là điều khiến tôi say mê: hướng dẫn mọi người cách đi từ hiện tại đến cảm giác đó. Và tôi thấy rõ tất cả những cách chúng ta tự mắc kẹt khi tự thuyết phục mình bỏ cuộc. Công việc kinh doanh của mẹ bạn hoàn toàn không phải về cà phê. Nó là về việc phục vụ một người mà bà thấu cảm - một người hơi giống bà ở một thị trấn giống thị trấn của bà. Để có thể nhìn thẳng vào mắt người đó, làm họ hài lòng, mang đến cho họ một trải nghiệm đầy hoài niệm mà họ sẽ nhớ mãi, và bạn cũng nhớ mãi nhiều thập kỷ sau. Vì thế, khi quay về với nguyên lý gốc - dành cho ai và để làm gì - chúng ta được sống lại một lần nữa và nói: Bạn biết không? Ở thị trấn nhỏ tại Michigan này, có 500 người cứ vài tuần lại mua một cân cà phê. Thế là đủ cho hiện tại rồi. Và tôi đang đưa ra một lời hứa. Nếu cà phê không ngon hoặc trải nghiệm không tốt, họ sẽ không quay lại. Lời hứa rất rõ ràng. Đó là điều tôi luôn thúc đẩy mọi người làm: hãy bắt đầu, lắng nghe, học hỏi, tiến hóa, đôi khi là dừng lại, và những lúc khác là làm nhiều hơn nữa. Nhưng hãy cực kỳ rõ ràng về điều bạn đang theo đuổi và bạn đang làm nó vì ai.<\/p>"}, {"t": "Freelancer hay Doanh nhân, Nhân tố cốt lõi &amp; Người sếp trong tâm trí", "k": "Chương 3", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tuyệt vời quá. Giờ tôi muốn chuyển hướng một chút, Seth. Hãy nói về những gì thực sự xảy ra sau đó. Điều gì xảy ra khi bạn mở dịch vụ chụp ảnh cưới và rồi nó chiếm trọn mọi ngày cuối tuần trong đời bạn, đến mức bạn chẳng bao giờ gặp được gia đình mình? Điều gì xảy ra khi bạn mở dịch vụ huấn luyện viên cá nhân và bạn bận rộn huấn luyện người khác đến mức không có thời gian tự tập cho bản thân? Điều gì xảy ra khi bạn làm môi giới bất động sản và giờ bạn bận tối mắt tối mũi chạy hết nhà mẫu này đến nhà mẫu khác, in áp phích, sửa website, làm mạng xã hội, trao đổi qua lại với luật sư, lo thủ tục chốt giao dịch và bày trí nhà cửa, đến mức bạn làm việc 100 tiếng một tuần và gần như không thể thở nổi? Hãy nói về chuyện xảy ra khi chính công việc kinh doanh bạn đang điều hành lại quay sang đè bẹp bạn.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi muốn lùi lại một bước và nói về huyền thoại của việc làm doanh nhân (entrepreneur). Rất nhiều người tự gọi mình là doanh nhân. Tôi từng là doanh nhân. Giờ tôi không còn là doanh nhân nữa. Tôi là một người làm nghề tự do (freelancer). Làm freelancer là một cách tuyệt vời để kiếm sống. Nhưng freelancer và doanh nhân là hai khái niệm khác nhau. Một doanh nhân sử dụng các nguồn lực - thường là tiền của người khác - để xây dựng thứ gì đó lớn hơn bản thân họ. Doanh nhân kiếm tiền ngay cả khi đang ngủ. Còn nếu bạn là người trực tiếp làm mọi việc, có lẽ bạn là một freelancer.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nếu là doanh nhân, bạn đang xây dựng một tổ chức. Đúng không? Thế nhưng điều thường xảy ra là những freelancer tài năng bắt đầu mơ ước xây dựng thứ gì đó lớn hơn mình. Họ mệt mỏi rồi, họ muốn có quy mô lớn hơn, nhưng cứ mỗi lần gặp khó khăn, họ lại thuê người rẻ nhất và sẵn sàng nhất. Bạn biết đó là ai không? Là chính bản thân họ. Vì họ làm việc miễn phí cho chính mình. Và thế là bạn tự thuê mình làm hết mọi việc, chẳng lạ gì khi bạn kiệt sức, bởi bạn không làm công việc thực sự của mình - đó là xây dựng thứ gì đó lớn hơn bản thân. Bạn cứ mãi tự thuê mình làm công việc tay chân. Freelancer là gì? Freelancer là người được trả tiền khi họ làm việc. Chỉ có họ và một mình họ làm việc đó. Bạn có thể có trợ lý hay gì đó, nhưng một freelancer không thể mở rộng quy mô, vì bản chất của họ là freelancer - bán sức lao động, góc nhìn và kỹ năng của chính mình.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ông biết đấy, không phải ai cũng sinh ra để làm freelancer hay doanh nhân. Hầu hết mọi người sẽ có một cuộc sống rất thành công, hạnh phúc và lành mạnh khi làm việc cho người khác.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chuẩn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vậy những nguyên tắc này áp dụng thế nào cho một người muốn thăng tiến và thành công hơn trong sự nghiệp làm công ăn lương trong năm nay?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi rất thích câu hỏi này. Thực tế là thế này: dù bạn có đang nhận lương cố định hay không, bạn vẫn đang làm marketing. Bạn vẫn đang kể một câu chuyện với đồng nghiệp, với sếp của mình. Mỗi lần bạn bước vào phòng họp và mở lời, mọi người đều có một kỳ vọng về những gì họ sắp nghe từ bạn. Bạn có thương hiệu cá nhân, ngay cả khi bạn không chạy chiến dịch quảng cáo cá nhân nào. Và thương hiệu đó chính là lời hứa mà chúng ta đưa ra. Đó là điều người khác kỳ vọng ở ta. Ví dụ, Nike có một thương hiệu. Nếu họ ra mắt một chuỗi khách sạn, tất cả chúng ta đều hình dung được nó sẽ như thế nào. Hyatt thì không có thương hiệu mạnh theo kiểu đó, chỉ có một cái logo. Nếu họ ra mắt một dòng giày thể thao, ta chẳng có chút ý niệm nào về việc nó sẽ ra sao. Vậy mọi người kỳ vọng điều gì ở bạn? Khi bạn nói Tôi sẽ nhận dự án này, điều đó có ý nghĩa gì? Làm thế nào để bạn được nhìn nhận bằng cách sống đúng với câu chuyện của một nhân tố cốt lõi (linchpin) - người mà thiếu đi sẽ rất khó xoay xở?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi rất thích câu hỏi này. Thực tế là thế này: dù bạn có đang nhận lương cố định hay không, bạn vẫn đang làm marketing. Bạn vẫn đang kể một câu chuyện với đồng nghiệp, với sếp của mình. Mỗi lần bạn bước vào phòng họp và mở lời, mọi người đều có một kỳ vọng về những gì họ sắp nghe từ bạn. Bạn me thương hiệu cá nhân, ngay cả khi bạn không chạy chiến dịch quảng cáo cá nhân nào. Và thương hiệu đó chính là lời hứa mà chúng ta đưa ra. Đó là điều người khác kỳ vọng ở ta. Ví dụ, Nike có một thương hiệu. Nếu họ ra mắt một chuỗi khách sạn, tất cả chúng ta đều hình dung được nó sẽ như thế nào. Hyatt thì không có thương hiệu mạnh theo kiểu đó, chỉ có một cái logo. Nếu họ ra mắt một dòng giày thể thao, ta chẳng có chút ý niệm nào về việc nó sẽ ra sao. Vậy mọi người kỳ vọng điều gì ở bạn? Khi bạn nói Tôi sẽ nhận dự án này, điều đó có ý nghĩa gì? Làm thế nào để bạn được nhìn nhận bằng cách sống đúng với câu chuyện của một nhân tố cốt lõi (linchpin) - người mà thiếu đi sẽ rất khó xoay xở?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Dù bạn là nhân viên phục vụ ở quán cà phê hay đang kiếm sáu chữ số ở Phố Wall, mọi thứ luôn giống nhau. Luôn có sự thiếu hụt những người biết giữ lời hứa. Luôn có sự thiếu hụt những người làm bừng sáng căn phòng mỗi khi họ bước vào. Có thể hiện tại bạn chưa khéo léo bằng người khác, có thể bạn không có nhiều đặc quyền bằng họ, nhưng điều chúng ta có thể làm là tiếp thị câu chuyện đó, sống trọn trong vai trò đó và trở thành người đóng góp mà chính ta tự hào. Và nếu bạn đang làm một công việc mà sếp của bạn không xứng đáng nhận được điều đó từ bạn, bạn nên đi tìm công việc khác. Mục tiêu là ở một nơi mà mọi người sẽ thấy nhớ và hụt hẫng nếu bạn vắng mặt.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ôi, tôi thích câu đó quá. Mục tiêu là trở thành người mà người khác sẽ thấy thiếu vắng nếu bạn rời đi. Tôi cũng nghĩ đây là một điều rất đáng để tự soi chiếu: liệu mình có thực sự là người mà công ty sẽ thấy nhớ nếu mình nghỉ không? Bởi nếu bạn đang làm việc qua loa cho có lệ, hoặc bạn thấy chán nản, và bạn nhận ra có những mảng mình không dồn năng lượng, không làm hết sức mình, thì tôi thấy những câu hỏi đó cực kỳ hữu ích ngay cả khi đặt mình vào vị trí nhân viên: việc này dành cho ai?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Việc này dành cho ai? Và để làm gì? Bài thuyết trình mình đang làm này dành cho ai? Để làm gì? Và mình có thể làm nó tốt hơn không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ông muốn nhắn nhủ điều gì với những người đang làm công việc ban ngày nhưng lại tự làm freelancer cho những giấc mơ của mình - tự hỏi nó dành cho ai, để làm gì, phục vụ ai?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi lo rằng có thể bạn đang có một người sếp tệ nhất thế giới. Người này không trân trọng bạn, suốt ngày soi mói từng việc bạn làm. Đôi khi họ gọi cho bạn ở nhà lúc nửa đêm chỉ để khiến bạn lo lắng về chuyện gì đó. Họ không cho bạn được đào tạo bài bản và luôn đầy rẫy những lời nói tiêu cực. Chắc bạn cũng đoán ra rồi: người đó chính là bạn. Sớm muộn gì chúng ta cũng làm việc cho chính mình, dù với tư cách freelancer hay người đang xây dựng sự nghiệp. Và người sếp đó - kẻ luôn hạ thấp ta, phá hoại ta, ép ta phải hòa tan vào đám đông, bảo rằng ta sẽ chẳng làm nên trò trống gì, khuếch đại nỗi sợ và đẩy ta vào chỗ trốn tránh. Khi có một người sếp tệ nhất thế giới như thế, chẳng có gì ngạc nhiên nếu công việc không mang lại cho ta chút hứng khởi nào. Bởi những lời độc thoại trong đầu, câu chuyện ta tự kể với chính mình, đã phá hủy tất cả. Và chúng ta có thể đi tìm một người bạn, một nhóm người, lập nên một vòng kết nối để thay đổi cách người sếp trong đầu nói chuyện với mình. Bởi vì ngoài đời thực, nếu có một ông sếp như vậy, bạn sẽ không bao giờ làm việc cho họ. Và bạn cũng không nên tự làm việc cho bản thân theo cách tự vùi dập mình như thế.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Làm thế nào để tìm được vòng kết nối đó ạ? Tôi thấy rất nhiều người gửi email tâm sự rằng họ thực sự muốn tìm một nhóm bạn đồng hành giúp mình đạt được mục tiêu. Ông có chiến lược, công cụ hay suy nghĩ nào về việc này không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Theo kinh nghiệm của tôi, con đường trực tiếp nhất là tìm ai đó đang làm bất kỳ công việc gì trên mạng, hoặc chỉ đơn giản là đang chia sẻ những bình luận thú vị trên mạng, và ủng hộ họ. Hãy tìm những người đang mong ước có ai đó giống như bạn xuất hiện vì họ. Bởi nếu bạn làm thế, khả năng cao họ cũng sẽ đáp lại tương tự. Khi ta nói: Tôi ở đây để giúp bạn nhìn rõ hướng đi của mình, và nếu tôi giúp được gì, tôi sẽ rất sẵn lòng, có thể họ cũng sẽ làm điều đó cho ta. Ngay hôm nay, trước khi mặt trời lặn, hãy đi tìm hai hoặc ba người và ủng hộ họ. Mọi thứ bắt đầu từ đó.<\/p>"}, {"t": "Bản chất của Marketing, Chỉ số ảo &amp; Tính dị biệt", "k": "Chương 4", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Giờ hãy đi vào một số chiến thuật cụ thể nhé, vì rất nhiều người đang cố gắng xây dựng doanh nghiệp, cố gắng tiếp thị bản thân — bạn đưa mình ra ngoài kia, bạn phải xuất hiện đều đặn. Điều đó thực chất có nghĩa là gì?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Ôi, một cái bẫy lớn đấy Mel. Một cái bẫy thật sự. Mọi người không bỏ tiền ra mua hàng chỉ vì họ thấy quen mặt bạn. Marketing không phải là việc cố gắng lan tỏa cho nhiều người biết tên. Marketing không phải là cứ xuất hiện trên mạng xã hội hay ở đâu đó cho quen mặt, rồi người ta đành tặc lưỡi mua hàng của bạn. Không phải vậy. Bạn kể một câu chuyện. Câu chuyện đó tạo ra một sự căng thẳng (tension) - nỗi lo bị bỏ lại phía sau, nỗi lo bị tụt hậu, cảm giác biết đâu cách này hợp với mình, cảm giác bạn bè mình ai cũng làm thế. Sự căng thẳng đó có thể lan tỏa vì nó đáng chú ý, đáng để bàn tán, và điều bạn muốn là mọi người giải tỏa sự căng thẳng đó bằng cách mua hàng của bạn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Họ sẽ không thuê bạn làm huấn luyện viên chỉ vì từng thấy bạn trên TikTok. Chuyện đó không xảy ra đâu. Có người kể với tôi anh ta làm một video TikTok đạt 40 triệu lượt xem nhưng chỉ bán được đúng 4 cuốn sách. Chẳng có gì lạ. Vì mua vui và biểu diễn cho mọi người xem trên TikTok hoàn toàn khác với việc giải quyết vấn đề cho họ bằng cách bán một cuốn sách giá 20 đô. Đó là hai giao dịch hoàn toàn khác nhau.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Một trong những điều tôi thấy rất nhiều là mọi người quá tập trung vào kết quả bề nổi. Kiểu như kiếm được bao nhiêu tiền, có bao nhiêu lượt tải, bán được bao nhiêu món, được bao nhiêu lượt thích, bao nhiêu lượt xem. Và ông nói điều đó sẽ hủy hoại doanh nghiệp của bạn.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng, và hủy hoại cả chính bạn nữa. Hãy bắt đầu bằng câu hỏi: So với cái gì? Đúng không? Bạn có chừng này lượt xem - so với cái gì? Tại sao lại đi so sánh số lượt xem của bạn với một người làm lĩnh vực chẳng liên quan, hoặc thậm chí có liên quan? So với cái gì không quan trọng. Quan trọng là: Hôm nay tôi đã giúp được ai? Nếu bạn quyết định mở cửa hàng ở một nơi đầy rẫy những người khác đang cày cuốc vất vả hơn bạn gấp bội, thì đó sẽ là tương lai của bạn: bạn sẽ phải tiếp tục cày cuốc không ngừng. Nhưng đó đâu phải điều bạn mong muốn ngay từ đầu. Bạn bước vào để kết nối. Bạn bước vào để tạo ra sự khác biệt. Vì vậy, đừng để bị phân tâm bởi số lượt xem. Những người bấm thích bạn trên mạng không thực sự thích bạn. Những người kết bạn trên mạng không phải bạn bè bạn. Những người theo dõi bạn trên mạng không phải người hâm mộ bạn. Họ chỉ bấm nút vì thuật toán muốn họ làm thế. Vậy chúng ta đang đo lường điều gì ở đây? Và làm sao để ép bản thân phớt lờ những chỉ số gây xao nhãng đó? Điều đó có nghĩa là nếu một đánh giá 1 sao trên Google có thể phá hỏng cả ngày của bạn và khiến bạn sửa lại một thực đơn vốn đang rất ổn, thì bạn cần tạo ra ranh giới để không bao giờ phải nhìn thấy đánh giá 1 sao đó nữa, vì nó chẳng liên quan đến thành công của thứ bạn đang xây dựng. Hãy bỏ qua cho người đó và bước tiếp. Nếu cần thuê một người chỉ làm đúng nhiệm vụ gửi lời nhắn tử tế cho những người để lại đánh giá 1 sao, cứ làm đi. Nhưng bạn không cần phải nghe về nó. Hãy đo lường những thứ thực sự quan trọng. Hãy tìm hiểu xem: Ồ, khi tôi thay đổi thực đơn thế này, có thêm bao nhiêu người mua nhiều hơn hoặc ít đi. Tôi có thể quan sát hành động của khách hàng. Tôi sẽ không lao vào đôi co với một người chẳng biết cách góp ý mang tính xây dựng - chính họ cũng tự nhận mình không giỏi góp ý - để rồi coi lời họ như chân lý và nhớ từng chữ một. Làm thế chẳng giúp doanh nghiệp của bạn tốt hơn đâu. Bạn đang trốn tránh đấy. Đó là sự kháng cự.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Lời khuyên này từ ông thực sự mang tính bước ngoặt đối với tôi. Và một điều giúp ích cho tôi rất nhiều là suy nghĩ xem: đâu là một việc duy nhất tôi có thể dành thời gian vào mà tạo ra tác động lớn nhất? Đâu là những việc chỉ mình tôi làm được và thực sự thúc đẩy kết quả mà tôi quan tâm - những kết quả xoay quanh việc tạo ra sự khác biệt tích cực? Tôi giải thích điều này vì nó thực sự đã cứu tôi. Mọi người liên tục hỏi tôi: Mel ơi, làm sao chị đối phó với hết thảy những bình luận tiêu cực thế? Tôi kiểu: Bình luận tiêu cực nào? Tôi không sống trong bong bóng ảo tưởng, nhưng tôi hiểu bản thân mình, và những bình luận tiêu cực từ người lạ trên mạng không hề đồng điệu với sứ mệnh của tôi, vậy tại sao tôi phải phí thời gian đọc chúng? Tôi cũng không giữ tài khoản đăng nhập để xem số liệu hậu trường của chương trình này. Bởi nếu tôi bắt đầu...<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> ...ám ảnh về lượt tải xuống, tôi sẽ rời mắt khỏi mục tiêu duy nhất mà mình làm tốt nhất: dành thời gian suy nghĩ xem cuộc trò chuyện hay nhất tiếp theo mình có thể thực hiện là gì. Điều tuyệt vời tiếp theo mình có thể tạo ra để tạo khác biệt cho dù chỉ một người nào đó trên thế giới này là gì. Làm thế nào để đưa Seth vào ánh sáng rực rỡ nhất nhằm tạo ra tác động lớn nhất? Còn nếu trước đó tôi cứ chăm chăm nhìn vào lượt tải...<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> ...thì đột nhiên tâm trí tôi chỉ còn toàn chuyện đó. Thế nên tôi thấy điều này cực kỳ quan trọng. Ai cũng có cái loa phóng thanh trong tay. Ai cũng có thể nói cho bạn biết họ nghĩ gì, nhưng tôi thực sự chỉ tiếp thu lời phê bình từ người thực sự quan tâm, người đang làm điều tương tự, hoặc người mà tôi tôn trọng ý kiến của họ.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chính xác. Và khi ta thêm yếu tố sống thật (authenticity) vào nữa, mọi thứ càng trở nên độc hại hơn...<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ý ông là sao?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chà, tôi và bạn là những trường hợp đặc biệt vì chúng ta cần làm gương mặt đại diện cho thương hiệu của mình.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng không? Nhưng hầu hết mọi người - nếu bạn bán granola hay làm môi giới bất động sản - bạn không cần phải làm gương mặt đại diện cho nó. Tâm điểm phải là khách hàng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vâng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng không? Nhưng hầu hết mọi người - nếu bạn bán granola hay làm môi giới bất động sản - bạn không cần phải làm gương mặt đại diện cho nó. Tâm điểm phải là khách hàng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Logo của Patagonia không nói về những người sáng lập Patagonia. Nó là huy hiệu mà khách hàng tự hào khoác lên mình. Vì thế, nếu bạn xuất hiện và bảo: Đây là con người thật của tôi, xin hãy đấm vào mặt tôi đi, thì những kẻ thích đấm vào mặt người khác sẽ kéo đến ngay. Vậy nên có một lối tắt bạn nên tránh: đừng tự nhủ Mình phải có mặt khắp mọi mạng xã hội, mình là gương mặt đại diện, mình tự tay làm hết granola, và mình đọc từng bình luận đánh giá. Tất nhiên là bạn sẽ kiệt sức rồi, vì bạn đang làm ít nhất năm công việc cùng lúc. Điều thứ hai cần nghĩ tới là tính dị biệt (idiosyncrasy). Khi ai đó bị gọi là dị biệt, người ta thường coi đó là lời chê. Nhưng nó lại là điều trái ngược với tầm thường, bình thường. Vị trí bình thường đã có người chiếm hết rồi. Thương hiệu khoai tây chiên bình thường, tiệm pizza bình thường, hãng granola bình thường - bạn sẽ không bao giờ thắng nổi ở ô bình thường. Vậy điều gì khiến bạn trở nên đặc biệt khác thường đến mức một nhóm nhỏ sẽ thấy nhớ nếu bạn biến mất?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Thay vì làm ra những thứ bình thường cho những người bình thường, bạn hãy tạo ra một thứ thật cụ thể cho những người thực sự muốn đúng thứ đó.<\/p>"}, {"t": "Nghệ thuật ra quyết định, Chọn khách hàng &amp; Thoát bẫy tự thuê chính mình", "k": "Chương 5", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi thích câu đó. Làm thế nào để đưa ra những quyết định đúng đắn ạ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Mel này, cho tôi hỏi bạn một câu.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vâng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Trong 6 tháng qua, bạn có đưa ra quyết định đúng đắn nào không?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Có chứ.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Kết quả của nó có tốt đẹp không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> (Mel đáp: Có ạ.) Đó là điều ai cũng nói. Thực ra chúng hoàn toàn không liên quan đến nhau. Chúng ta cứ bị gắn chặt vào suy nghĩ rằng quyết định đúng sẽ dẫn đến kết quả tốt.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ồ.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chúng không liên quan đâu. Nếu bạn mua một tờ vé số và trúng độc đắc, bạn vừa đưa ra một quyết định tồi. Mua vé số luôn là một ý tưởng tồi. Nhưng bạn gặp may. Chúc mừng nhé, tôi mừng vì bạn may mắn. Nhưng đó không phải vấn đề. Ngược lại, nếu bạn đưa ra một quyết định sáng suốt nhưng kết quả lại tệ hại, đó không phải lỗi của bạn. Lần đó bạn chỉ không gặp may thôi. Và điều Annie Duke - nhà vô địch poker thế giới - đã dạy tôi là bí quyết chiến thắng trên bàn poker cũng giống hệt mọi quyết định khác trong đời, dù bạn là huấn luyện viên bóng bầu dục, nhân viên văn phòng hay bậc làm cha mẹ: hãy ngừng lo lắng về kết quả. Hãy ngừng mặc định rằng kết quả tốt là do quyết định đúng tạo ra. Không phải vậy. Quyết định đúng đơn giản là quyết định dựa trên dữ liệu đang có ngay trước mắt chúng ta. Một người ra quyết định giỏi có chọn giống như mình đã chọn không? Nếu câu trả lời là có, thì bạn đã ra quyết định đúng. Bỗng nhiên ta không còn bị tê liệt vì sợ hãi nữa. Bởi ta tự nhủ: mình không cần phải mê mẩn hay đảm bảo kết quả cuối cùng. Mình chỉ cần biết rằng, dựa trên những gì trước mắt, bất kỳ người sáng suốt nào cũng sẽ chọn như vậy. Hãy ngừng đánh đồng kết quả với quyết định.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ông biết tôi vừa ngộ ra điều gì không? Rất nhiều lần, một quyết định ở thời điểm hiện tại có vẻ như rất tệ, nhưng khi nhìn lại sau 10 năm nữa, bạn mới nhận ra đó thực sự là một quyết định tuyệt vời dựa trên hoàn cảnh lúc đó. Nó là quyết định đúng đắn, chỉ là vào khoảnh khắc phải đưa ra quyết định đúng, ta thường thấy nó sai sai.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Phải. Bạn muốn trở thành con người mà phiên bản tương lai của chính bạn sẽ cảm ơn. Bạn muốn đưa ra những quyết định mà cô Melanie của tám năm sau sẽ thốt lên: Trời ơi, mừng quá vì hồi đó mình đã làm thế.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm. Và cách duy nhất để biết điều đó là bạn phải thực sự thành thật với chính mình. Nhìn vào những dữ kiện bạn có, quay lại những câu hỏi cốt lõi kia: việc này dành cho ai, để làm gì, phục vụ ai trong quyết định này, làm sao biết đây là quyết định tốt, đúng hay sai dựa trên những gì mình đang biết? Và nếu tôi phân tích hết tất cả những điều đó, rồi với thiện chí tốt nhất, đưa ra lựa chọn tốt nhất có thể ngay tại khoảnh khắc ấy, thì đó luôn là một quyết định đúng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chính xác. Chuẩn không cần chỉnh.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng vậy, vì có rất nhiều lúc bạn đưa ra một quyết định rất đúng, nhưng nó lại gây ảnh hưởng đến ai đó, dù ý định của bạn không phải vậy. Nên dù có người thất vọng hay buồn lòng, điều đó không biến quyết định của bạn thành sai lầm, nó chỉ có nghĩa là quyết định đó có tác động tới họ. Bạn có thể xin lỗi vì tác động đó nhưng vẫn biết rõ mình đã đưa ra lựa chọn đúng cho bản thân.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chuẩn xác.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Trời ơi, hay quá. Ông có một câu nói thế này, Seth: Chọn khách hàng của bạn, chọn tương lai của bạn.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Câu đó nghĩa là sao ạ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Được rồi, bạn sẽ dành phần lớn thời gian của mình để làm việc với khách hàng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vâng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Hoặc chạy theo những người chưa phải khách hàng của bạn. Và bạn muốn làm họ hài lòng. Vậy nên nếu khách hàng của bạn là những cô dâu chú rể đang căng thẳng tột độ một tuần trước lễ cưới ở Hamptons, đó chính là những người bạn sẽ tiếp xúc suốt ngày. Đó là kiểu tình huống khẩn cấp bạn sẽ phải xử lý. Nếu khách hàng của bạn là những người keo kiệt, soi từng đồng từng dòng hóa đơn, hãy chuẩn bị tinh thần rằng cả ngày của bạn sẽ trôi qua như thế đấy.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nếu bạn có một chuỗi nhà hàng như McDonald's, McDonald's nhận ra nhóm khách hàng họ phục vụ tốt nhất là những người ngồi trong ô tô và đang vội đi đâu đó. Thế nên tại McDonald's có những thanh tra cầm đồng hồ bấm giờ đến kiểm tra xem mất bao lâu để phục vụ. Chuyện đó không xảy ra tại nhà hàng hiện đại ở Manhattan của Danny Meyer. Chẳng có ai cầm đồng hồ bấm giờ ở đó cả. Khách hàng khác nhau, đầu ra khác nhau. Vì vậy, khi bạn chọn khách hàng - câu chuyện của họ, nỗi sợ của họ, khao khát của họ, ngân sách của họ, động lực của họ - là bạn vừa tuyên bố cách bạn muốn sống những ngày của mình. Đừng để khách hàng quyết định điều này. Bạn là người quyết định. Khi bạn chọn được khách hàng, bạn mới được quyền chọn cuộc sống của mình. Nếu bạn là giáo viên cũng thế thôi. Khi bạn chọn học sinh của mình - nếu bạn dạy một lớp toàn học sinh ngỗ ngược, tăng động vì ăn nhiều đường và chẳng thiết tha chuyện học hành, cả ngày của bạn sẽ trôi qua như thế.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Ngược lại, nếu bạn đến một ngôi trường có tính chọn lọc cao, nơi học viên thực sự khao khát học hỏi như trường Juilliard, bạn chẳng cần phải quát mọi người im lặng và ngồi xuống, vì bạn đang dạy ở Juilliard. Học trò bạn chọn quyết định cách bạn trải qua một ngày. Vậy làm sao để tiến lên nếu bạn là một freelancer? Đơn giản thôi. Hãy tìm những khách hàng tốt hơn. Khách hàng tốt hơn thử thách bạn nhiều hơn, trả tiền cho bạn nhiều hơn, và giới thiệu về bạn nhiều hơn. Bạn không thể nhận thêm quá nhiều khách hàng vì bạn là freelancer. Nhưng bạn có thể có những khách hàng chất lượng hơn. Khách hàng chất lượng là kiểu khách của Chip Kidd, nhà thiết kế bìa sách vĩ đại. Mỗi năm Chip Kidd chỉ thiết kế khoảng 30 bìa sách gì đó. Nếu bạn không hiểu cái gu hài hước của ông ấy, mời đi chỗ khác. Chẳng ai đến gặp Chip và tranh cãi về kiểu chữ với ông ấy cả. Chẳng ai bảo: Hãy làm cuốn sách này trông giống cuốn sách tự xuất bản của mẹ vợ tôi đi. Ông ấy là Chip Kidd đấy, lạy Chúa. Đó là cách bạn nâng tầm bản thân. Hãy trở thành kiểu freelancer mà những khách hàng xịn muốn làm việc cùng. Điều đó không có nghĩa là bạn lấy giá rẻ hơn. Và bạn cũng không đạt được vị thế đó bằng cách làm tốt việc cho những khách hàng tệ. Bạn đạt được nó bằng cách xuất hiện ở nơi những freelancer phục vụ khách hàng xịn thường lui tới, và làm những công việc xứng tầm với họ. Vì thế, nếu bạn là freelancer, hãy giữ gìn thời gian của mình như vàng ngọc, vì bạn sẽ không bao giờ lấy lại được nó đâu. Đừng ảo tưởng rằng bạn có thể thuê 30 phiên bản của chính mình nhưng làm việc với giá rẻ hơn. Không có chuyện đó đâu. Freelancer có thể sống rất tốt vì họ tìm được con đường làm nghề thủ công của mình và được tôn trọng vì điều đó.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vâng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Doanh nhân cũng có thể thành công rực rỡ vì họ nhìn thấy nhu cầu thị trường và phục vụ thị trường, chứ không phải vì cố cày cuốc bằng cách biến sở thích cá nhân cộng với làm việc quá giờ và căng thẳng tột độ thành thứ gì đó tự nhiên phình to lên. Không đâu, ở giữa hai thái cực đó có một vùng chết. Đừng rơi vào vùng đó. Cái vùng mà công ty có 8 người, 18 người hay 30 người, nơi bạn phải làm hết mọi việc, tiền kiếm không đủ, lúc nào cũng bận tối mắt chẳng làm được gì ra hồn, và căng thẳng đến phát điên. Điều đó xảy ra khi bạn rơi vào hố sâu của việc cố dùng sức người cày ải mà không có đòn bẩy.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Có quá nhiều điều sâu sắc trong đoạn ông vừa nói mà tôi muốn mổ xẻ thêm. Khi ông bắt đầu nói rằng người ta thường mắc sai lầm là tự thuê chính mình với mức giá rẻ mạt để làm hết mọi việc - bởi giờ bạn quá bận, chọn nhầm khách hàng, làm việc quá nhiều giờ, và không thực sự hiểu rằng thời gian của mình là thứ quý giá nhất. Ta hay nghe câu nói: Mình bị kẹt trong việc làm thuê cho chính doanh nghiệp của mình, thay vì đứng trên cao để điều hành và phát triển nó.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chính xác.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vậy nếu bạn đang nghe podcast này và thấy mình giống hệt thế - bạn là môi giới nhà đất, bạn có công ty điện lạnh, bạn đang làm việc 90 tiếng mỗi tuần vì bạn phải tự tay làm hết mọi việc, vì lý do nào đó không thể chậm lại để thuê người, hoặc công việc chưa đủ lợi nhuận để bạn chỉ tập trung vào việc cốt lõi và thuê người khác gánh vác phần còn lại. Hãy nói về khoảnh khắc đó.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Ừ, sự thiếu kỷ luật của bạn bắt nguồn từ nỗi sợ hãi. Rất khó để đi mở rộng những nguồn khách hàng mới. Rất khó để gọi điện chào mời những người cần dịch vụ của bạn. Rất khó để bước ra khỏi vùng an toàn và đưa người khác vào làm thay. Và nếu bạn từng quen làm freelancer, lại càng khó hơn khi nhìn một người mới vào làm không giỏi bằng và không nhanh bằng mình. Đúng không? Bạn nhìn họ và nghĩ: Trời ơi, làm gì thế? Tôi làm việc này nhanh hơn và tốt hơn nhiều. Tránh ra để tôi làm. Vậy thì bạn vẫn là freelancer. Cứ làm freelancer đi, không sao cả. Nhưng mỗi lần bạn có ý định tự thuê chính mình làm một việc gì đó, hãy tự hỏi: Mình đang trốn tránh điều gì? Bởi bạn đang né tránh công việc thực sự của mình - đó là xây dựng những tài sản cho phép bạn không phải trực tiếp làm bất kỳ công việc tay chân nào nữa.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Mình đang trốn tránh điều gì? Tôi nghĩ đó là một cái cớ rất lớn mà mọi người hay dùng. Khi bạn khởi nghiệp, rồi nó bắt đầu có chút đà, kiếm được chút tiền, chẳng mấy chốc bạn tăng từ làm vài tiếng mỗi ngày lên làm toàn thời gian, rồi làm việc suốt ngày đêm nhưng chẳng rõ mình đang thực sự tập trung vào cái gì.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Và rồi bạn bắt đầu viện cớ rằng mình bận làm đủ thứ việc không tên nên không có thời gian tiếp thị doanh nghiệp, thế là doanh nghiệp dậm chân tại chỗ. Giờ bạn vừa phải chạy ra tiệm mua giấy in vì máy in vừa hết giấy, vừa ngồi máy tính tự thiết kế tờ rơi quảng cáo ngôi nhà đang bán, rồi lại phải vội vàng chạy qua nhà mẫu để đón khách.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cảm giác đó kích thích lắm chứ. Mel này, tôi từng sáng lập một trong những công ty internet đầu tiên và phát triển nó lên gần 100 nhân sự. 50 người trong số đó báo cáo trực tiếp cho tôi.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> (cười)<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ôi chao.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cảm giác đó phấn khích thật sự. 8 giờ sáng tôi bước vào văn phòng và suốt cả ngày chẳng làm gì khác ngoài tương tác, trả lời câu hỏi, giải quyết sự cố. Và thực ra tôi đang trốn tránh công việc quan trọng nhất: tìm đâu ra đối tác lớn có thể làm thay đổi hoàn toàn tầm vóc của tổ chức này?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Và tôi rất tự hào vì trong 3 tháng trước khi bán công ty, tôi đã xoay xở được để có những mảng vận hành mà tôi không hề chạm tay vào. Đó là cách tôi trưởng thành với tư cách một doanh nhân, bởi ngay khoảnh khắc đó bạn thực sự đang xây dựng một tài sản - thứ lớn hơn bản thân mình. Nó vẫn chạy tốt ngay cả khi không có mặt tôi ở đó, để tôi có thời gian đi làm việc quan trọng khác. Thế nên, nhắc lại lần nữa, chẳng có gì sai với sự phấn khích của một freelancer, và cũng chẳng có gì sai khi làm doanh nhân. Chỉ khi bạn bị nhập nhằng giữa hai vai trò đó, căng thẳng mới ập đến.<\/p>"}, {"t": "Đối mặt với chỉ trích, Nỗi sợ bị từ chối &amp; Ranh giới giữa Sở thích và Kinh doanh", "k": "Chương 6", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nếu bạn đang nghe khách hàng phàn nàn, bị phản đối về giá cả, hoặc đọc đánh giá về sản phẩm vừa ra mắt để tìm góp ý xây dựng nhưng lại thấy kiểu: Trời ơi, ai cũng ghét thứ này. Làm thế nào để xử lý phản hồi mà không chui đầu vào cát trốn tránh? Làm sao để đối mặt với chuyện này?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Khi ai đó chê sản phẩm của bạn, họ không hề chê con người bạn. Họ chỉ đang nói: Dựa trên con người tôi và những gì tôi thấy, tôi không muốn thứ này. Và nếu bạn xù lông lên bảo vệ, nói rằng họ sai rồi, bạn chẳng giúp được ai cả. Việc bạn muốn gì hay thích gì không quan trọng. Quan trọng là những khách hàng bạn đã chọn phục vụ - câu chuyện họ tự kể với bản thân là gì? Bước nhảy vọt của sự thấu cảm là cực kỳ thiết yếu, vì bạn phải chọn những khách hàng có vấn đề mà bạn muốn giải quyết. Và khi đó, họ luôn đúng. Ngay giây phút bạn nói bạn sai rồi, họ không còn là khách hàng của bạn nữa. Trong thế giới số, tôi từng bán những sản phẩm có giá hàng trăm, thậm chí hàng ngàn đô la. Và ngay lần đầu tiên có người nói Tôi không thích nó, tôi sẽ không cố thuyết phục họ rằng họ sai. Tôi sẽ hỏi xem họ có muốn đồng hành tiếp trong hành trình này không; nếu không, tôi cảm ơn họ rất nhiều vì đã nói thật, và hoàn lại toàn bộ tiền. Tôi không bận tâm chuyện họ có lợi dụng mình hay không, vì họ không lợi dụng tôi - họ đã tin tưởng tôi. Giờ tôi tin tưởng họ, và hai bên vui vẻ bước tiếp. Sản phẩm này không dành cho bạn là một câu nói hoàn toàn hợp lý.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi thích điều đó. Nếu bạn sắp tung ra một thứ gì đó đáng sợ - chẳng hạn bắt đầu nghề tay trái, hoặc tìm thấy một sản phẩm bạn cực kỳ yêu thích và muốn mở kinh doanh - ông có lời khuyên nào thật hay về nỗi sợ hãi không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Rất dễ để ta đánh đồng nỗi sợ của mình với danh sách công việc cần làm. Kiểu như: Sản phẩm của mình chưa đủ tốt, mình chưa thể ra mắt được. Ừm, đó không phải thứ bạn thực sự sợ đâu. Đây là một bài tập thực tế bạn nên thử ngoài đời thật: hãy ra bến xe buýt, mang theo một tờ 10 đô la, tiến lại gần ai đó và hỏi: Bạn có muốn đổi cho tôi tờ 5 đô để lấy tờ 10 đô này không? Rõ ràng đó là tờ 10 đô thật, rõ ràng nó đáng giá hơn 5 đô. Nhưng việc này cực kỳ khó làm. Nó rất đáng sợ. Bạn cảm thấy hoàn toàn lúng túng. Dù bạn đang bán thứ rõ ràng có giá trị cao hơn số tiền bạn đòi. Hóa ra cái cảm giác đó chính là lý do bạn sợ hãi. Bạn sợ thực hiện một
