h son lên răng tới chuyện chết ngay lập tức. Đó là lý do tôi thích gọi tên nó ra, vì thấy thật nực cười khi nghĩ vết son trên răng có thể khiến bạn mất mạng. Vậy nên ta phải quyết định: ta đang dùng sự bất an làm nhiên liệu - lúc nào cũng phải mặc đẹp hơn, cao hơn, gầy hơn, ăn nói lưu loát hơn - hay ta chọn tư duy hào phóng rằng: Tôi đã xuất hiện. Tôi đã nói một điều khiến mọi thứ tốt đẹp hơn. Đó chính là tiêu chuẩn. Và nếu bạn làm được điều đó khi đang mặc quần đùi, cứ mặc quần đùi mà làm, vì chiếc quần đùi chẳng liên quan gì đến tiêu chuẩn giá trị cả.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Thú vị ghê, tôi nghĩ ngay tới việc mỗi ngày thức dậy hoặc kết thúc một ngày, ta có thể tự nhủ: Hôm nay mình đã làm tốt hơn hôm qua.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng, chẳng ai nói hôm nay tôi làm hoàn hảo cả vì điều đó không thật, nhưng bạn hoàn toàn có thể làm tốt hơn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vậy hãy nói về tính chân thật (authenticity) một chút nhé? Được không ạ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Được chứ, nói về tính chân thật nào.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Thực ra cái gọi là sống thật trên mạng bây giờ nhiều khi toàn là chuyện nhảm nhí... Ý tôi là, ông có nghĩ tính chân thật nhiều khi là một thứ bị thổi phồng không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nó là một câu chuyện hư cấu đấy. Chẳng ai thực sự muốn bạn lúc nào cũng chân thật trần trụi đâu - có thể trừ người bạn thân nhất của bạn, còn lại thì không.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ơ nhưng với tôi ông là người chân thật nhất tôi từng biết mà, đó là lý do tôi quý ông.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi là người nhất quán (consistent).<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Khoan đã\\! Ông nhất quán. Vậy bí quyết của sự chân thật thực ra là sự nhất quán sao?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Bí quyết để phụng sự người khác là sự nhất quán. Để tôi hỏi bạn một câu nhé, Mel. Trong năm nay có ngày nào bạn cảm thấy cực kỳ tệ, hơi cáu kỉnh, không ở phong độ tốt nhất không?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi gọi ngày đó là thứ Ba hàng tuần\\! (cười)<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Vậy những lúc như thế, khi bạn ngồi trước micro thu âm một tập podcast, bạn có thể hiện sự cáu kỉnh và làm việc dưới sức một cách chân thật không, hay bạn xuất hiện với phiên bản Mel Robbins nhất quán và đầy năng lượng truyền cảm hứng như bạn vẫn làm?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi xuất hiện một cách nhất quán. Tôi lại không làm được thế với gia đình mình lắm, ở nhà tôi hay buông lỏng bản thân hơn. Và Seth biết không, tôi đang cố sửa điều đó, vì tôi thấy thật tệ khi lại trút những phần xấu xí nhất của mình lên những người yêu thương mình nhất.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Vậy nên sự chân thật nguyên bản là dành cho bạn thân, hoặc người nhà - đó là điều họ mong ở bạn. Nhưng tất cả những người khác ngoài kia chỉ mong bạn sống đúng với lời hứa và câu chuyện của mình. Nếu bạn cần phẫu thuật tim, lạy Chúa, bạn đâu muốn bác sĩ phẫu thuật hôm đó làm việc theo kiểu chân thật cảm xúc thất thường của họ; bạn muốn họ làm việc với phong độ xuất sắc nhất quán. Đó là lý do bạn thuê họ. Tôi có thể kể thêm hàng loạt ví dụ. Ý nghĩa của một người chuyên nghiệp là đưa ra lời hứa và giữ lời hứa đó. Lý do tôi mặc chiếc áo khoác kiểu nghệ nhân này mỗi ngày đi làm là vì khi đi dạo cùng chú chó tới văn phòng, tôi chỉ là Seth Godin bình thường. Nhưng khi bước vào chỗ làm và khoác chiếc áo này lên, tôi là người đã viết 10.000 bài blog và 20 cuốn sách bán chạy. Đó là vai diễn tôi đảm nhận, và nhiệm vụ của tôi là diễn vai đó một cách nhất quán. Dĩ nhiên bạn không nên chọn một vai diễn đối nghịch hoàn toàn với con người bạn muốn trở thành - làm vậy sẽ kiệt sức và gục ngã. Đừng làm thế. Nhưng khi bạn tìm được một vai diễn đúng với giá trị của mình và sống nhất quán trong vai đó, bạn sẽ không bao giờ phải lấy tấm thẻ miễn tội rằng tôi chỉ đang sống thật với cảm xúc thôi ra để bao biện cho việc cư xử tệ bạc nữa. Không được phép làm thế. Chúng tôi không dành sự chú ý cho bạn để bạn xả cảm xúc bừa bãi. Chúng tôi dành sự chú ý để đón nhận sự nhất quán từ bạn. Vậy làm sao để tạo ra thực hành đó? Khi soi gương lúc sáng thức dậy, khi làm bữa sáng cho con, khi làm việc với sếp, ta tự hỏi mình: Nếu lúc này mình đang nhập vai phiên bản tốt nhất của chính mình, phiên bản đó sẽ hành xử ra sao? Lúc đầu việc nhập vai chính mình có thể hơi lạ lẫm, nhưng rất nhanh thôi, bạn sẽ thực sự sống trọn vẹn trong con người đó.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi đang ngẫm ngay điều này: nếu mình nhập vai phiên bản tốt nhất của chính mình - bất kể hôm nay tâm trạng ra sao, viện cớ gì - nếu mình nhất quán sống trong vai đó, mọi chuyện sẽ ra sao? Chà, tôi biết câu trả lời rồi, tôi nghĩ ai trong chúng ta cũng biết.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi chỉ muốn nhấn mạnh một chiến lược là: hãy tạo ra hệ thống để trở thành phiên bản bạn muốn trở thành ngay hôm nay, vì bạn không thể sống lại ngày hôm nay thêm lần nào nữa. Bạn chỉ có một lần duy nhất thôi. Bạn muốn nó diễn ra thế nào?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nếu chỉ chọn một hành động duy nhất từ tất cả những gì chúng ta đã trò chuyện hôm nay, ông nghĩ điều quan trọng nhất cần làm là gì?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi nghĩ điều quan trọng nhất là hãy nói về nó. Và để nói về nó, bạn cần một ai đó để trò chuyện cùng. Đó là lý do ngoài việc được dành thời gian với bạn, chương trình podcast này rất quan trọng với tôi - vì bạn đang tạo ra một hệ thống nơi mọi người rủ nhau cùng bước vào hành trình này. Nếu bạn tìm được một người, ba người hay năm người để lập thành một nhóm đồng hành - nơi mọi người nói sự thật với nhau, thách thức nhau trở thành phiên bản tốt nhất của chính mình - điều đó sẽ phát huy tác dụng mọi lúc.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Seth Godin, lời nhắn nhủ cuối cùng của ông là gì?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Hãy tạo nên một làn sóng khuấy động (Go make a ruckus).<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tuyệt vời.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tạo nên làn sóng khuấy động không có nghĩa là đi gây chú ý cho bản thân hay phá bỏ mọi quy tắc. Ý nghĩa của nó đơn giản lắm: làm công việc có ý nghĩa cho những người thực sự quan tâm. Đừng làm vì những người chẳng muốn nghe từ bạn. Đừng làm những việc vô nghĩa. Đừng làm những việc chỉ nuôi sống một hệ thống mà bạn chẳng hề tin tưởng. Hãy làm công việc có giá trị cho những người quan tâm. Có thể chỉ là một việc nhỏ cho một người thôi - thế là đủ. Rồi lại làm tiếp. Đó là cơ hội của chúng ta. Hãy tạo nên làn sóng mới.<\/p>"}, {"t": "Phần kết", "k": "Phần kết", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Seth Godin, cảm ơn ông vì đã tạo nên những làn sóng khuấy động. Cảm ơn ông vì đã dạy tôi cách làm điều đó. Cảm ơn ông vì đã thắp lên ngọn lửa trong tôi từ hàng thập kỷ trước - thứ mà có lẽ mãi tới bây giờ mới thực sự bắt đầu được thế giới nhìn thấy.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cảm ơn Mel. Tôi cũng không thể trọn vẹn là chính mình nếu không có bạn. Thực sự rất vui vì bạn có mặt ở đây.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Và cảm ơn các bạn. Cảm ơn vì đã tìm thời gian và dành thời gian lắng nghe những điều sẽ giúp bạn nâng cao tiêu chuẩn, đưa ra quyết định sáng suốt hơn, và như Seth vẫn thích nói: tạo nên một làn sóng mới. Phòng khi chưa có ai nói với bạn điều này, với tư cách một người bạn, tôi muốn nói rằng tôi yêu quý bạn và tin tưởng ở bạn. Tôi tin vào khả năng kiến tạo một cuộc sống tốt đẹp hơn của bạn, và tất cả những gì Seth chia sẻ hôm nay, những điều ông ấy tha thiết mong bạn cân nhắc, tôi biết chắc chúng sẽ dẫn bạn đến một cuộc sống tốt đẹp hơn. Được rồi. Hẹn gặp lại bạn trong tập tiếp theo nhé. Tôi sẽ chào đón bạn ngay khoảnh khắc bạn bấm nút phát. Cảm ơn bạn đã xem đến tận giây phút cuối cùng. Cảm ơn vì đã chia sẻ tập này với những người bạn quan tâm, vì khi bạn chia sẻ một điều đã tạo ra khác biệt cho mình, chính bạn cũng đang tạo ra khác biệt cho một ai đó khác. Và khi làm điều tốt, cảm giác thật tuyệt vời. Cảm ơn bạn vì điều đó. Và tôi biết bạn đang nghĩ: Hay quá Mel ơi, tập tiếp theo nên xem gì đây? Ồ, bạn sẽ thích tập này lắm đấy. Tập này cực kỳ hay luôn.<\/p>"}];
var QUIZ=[{"q": "Theo Seth Godin, sự khác biệt cốt lõi giữa một <strong>Vấn đề (Problem)<\/strong> và một <strong>Hoàn cảnh (Situation)<\/strong> là gì?", "o": ["Vấn đề luôn nhỏ hơn và dễ xử lý hơn hoàn cảnh.", "Hoàn cảnh có thể thay đổi bằng tiền bạc, còn vấn đề thì không.", "Vấn đề luôn có giải pháp (dù ta có thể không thích giải pháp đó); còn hoàn cảnh là thứ không có lời giải và ta buộc phải chấp nhận.", "Hoàn cảnh là do người khác gây ra, còn vấn đề là do tự mình gây ra."], "a": 2, "why": "Phân biệt rõ giúp ta ngừng tốn sức chống lại hoàn cảnh bất khả kháng và dũng cảm thực hiện giải pháp cho các vấn đề thực sự."}, {"q": "Khi cảm thấy <strong>sự kháng cự (resistance)<\/strong> hoặc hội chứng bí ý tưởng trước một công việc nào đó, Seth khuyên ta nên nhìn nhận nó như thế nào?", "o": ["Như một dấu hiệu cho thấy công việc đó không phù hợp với mình và nên bỏ qua.", "Như một chiếc la bàn chỉ đường, báo hiệu rằng ta đang đứng trước một việc thực sự quan trọng cần ưu tiên làm.", "Như một căn bệnh tâm lý cần nghỉ ngơi vài tháng chờ cảm hứng quay lại.", "Như lỗi của môi trường làm việc không đủ truyền cảm hứng."], "a": 1, "why": "Sự kháng cự tỷ lệ thuận với mức độ quan trọng của việc bạn sắp làm; càng sợ và trì hoãn, đó càng có thể là việc bạn cần làm nhất."}, {"q": "Nguyên tắc <strong>Đạt chuẩn là xuất bản (Merely ship it)<\/strong> khác với <strong>Xuất bản bừa (Just ship it)<\/strong> ở điểm nào?", "o": ["Đạt chuẩn là xuất bản nghĩa là sản phẩm đã đáp ứng đúng bộ tiêu chuẩn đề ra từ trước thay vì sửa mãi để tìm sự hoàn hảo không tồn tại.", "Xuất bản bừa là chỉ làm cho người thân xem, còn đạt chuẩn là bán cho người lạ.", "Đạt chuẩn là xuất bản đòi hỏi sản phẩm phải đạt mức xa xỉ như xe Rolls-Royce.", "Không có gì khác biệt, chỉ là hai cách nói khác nhau."], "a": 0, "why": "Chủ nghĩa hoàn hảo không nhằm làm sản phẩm tốt hơn mà nhằm ngăn bạn xuất bản; xác định rõ tiêu chuẩn (spec) và dừng sửa ngay khi đạt chuẩn là cách để tiến về phía trước."}, {"q": "Vì sao Seth Godin nói <strong>sự chân thật (authenticity)<\/strong> trong công việc đôi khi bị hiểu sai và thứ khách hàng thực sự cần là <strong>sự nhất quán (consistency)<\/strong>?", "o": ["Vì khách hàng không muốn biết sự thật về sản phẩm.", "Vì khi thuê một chuyên gia (như bác sĩ phẫu thuật hay người dẫn chương trình), ta kỳ vọng họ giữ lời hứa và làm tốt vai trò của mình ổn định mọi lúc, thay vì làm việc theo tâm trạng thất thường.", "Vì sự nhất quán giúp giấu đi con người thật yếu đuối của bạn.", "Vì mạng xã hội chỉ ưu tiên thuật toán cho những người nói giống hệt nhau."], "a": 1, "why": "Chuyên nghiệp là đưa ra lời hứa và giữ lời hứa ổn định mỗi ngày, không lấy tâm trạng cá nhân làm cái cớ cho sự hời hợt."}, {"q": "Ý nghĩa thực sự của câu nói <strong>Hãy tạo nên một làn sóng khuấy động (Go make a ruckus)<\/strong> là gì?", "o": ["Làm những hành động gây sốc, ồn ào trên mạng xã hội để thu hút thật nhiều lượt xem.", "Phá bỏ mọi luật lệ ở công ty và cãi lại cấp trên.", "Làm những công việc thực sự có ý nghĩa dành cho những người thực sự quan tâm, dù chỉ là một việc nhỏ cho một người.", "Nghỉ việc ngay lập tức để đi du lịch tìm lại bản thân."], "a": 2, "why": "Tạo làn sóng mới không phải làm màu cho đám đông, mà là dấn thân tạo giá trị thật cho đúng nhóm người cần nó."}];
var REF_A=[{"t": "Hai chữ Nhưng và Và", "q": "Hãy nhớ lại một mục tiêu bạn đang trì hoãn vì hoàn cảnh (bận rộn, thiếu tiền, người thân không ủng hộ). Nếu thay chữ nhưng bằng chữ và trong câu chuyện bạn tự kể với mình, hành động tiếp theo của bạn sẽ thay đổi ra sao?"}, {"t": "Vấn đề hay Hoàn cảnh", "q": "Trong cuộc sống hiện tại, đâu là thứ bạn đang xem là hoàn cảnh bất khả kháng để thoái thác, nhưng thực chất lại là một vấn đề có giải pháp (chỉ là giải pháp đó đòi hỏi một cuộc trò chuyện khó xử hoặc bước ra khỏi vùng an toàn)?"}, {"t": "La bàn của sự kháng cự", "q": "Việc nào bạn đang né tránh hoặc trì hoãn lâu nhất trong tháng này? Nếu coi sự kháng cự đó là tín hiệu báo rằng đây chính là việc quan trọng nhất, bạn có thể thu nhỏ nó thành tác phẩm khả thi nhỏ nhất nào để làm ngay trong tuần này?"}, {"t": "Sống nhất quán thay vì tìm cớ sống thật", "q": "Khi thức dậy mỗi sáng, nếu bạn chọn nhập vai phiên bản tốt nhất của chính mình một cách nhất quán (như cách Seth khoác chiếc áo làm việc), thái độ của bạn với đồng nghiệp và đặc biệt là với gia đình sẽ khác đi thế nào?"}, {"t": "Nhiên liệu địa vị", "q": "Có khoản chi tiêu, mục tiêu hay sự so sánh nào gần đây của bạn đang chạy bằng nhiên liệu sợ hãi và muốn chứng tỏ địa vị với người khác không?"}];
var REF_B=[{"t": "Ranh giới giữa Kiên trì và Bám chấp", "q": "Seth khuyên nên hành động không bám chấp kết quả (buông bỏ sợi dây trói mình với phản ứng của người khác). Tuy nhiên, trong kinh doanh hoặc sáng tạo nội dung, nếu hoàn toàn không quan tâm đến phản hồi hay thị hiếu người xem, làm sao ta biết mình cần điều chỉnh để sản phẩm tốt hơn?"}, {"t": "Tự chọn lấy mình trong môi trường truyền thống", "q": "Khuyên mọi người tự chọn lấy mình (Pick yourself) rất truyền cảm hứng cho người làm sáng tạo độc lập. Nhưng với những ngành nghề đòi hỏi chứng chỉ, phê duyệt nghiêm ngặt (như y tế, hàng không, pháp lý), nguyên tắc này nên được hiểu và áp dụng như thế nào cho an toàn và thực tế?"}, {"t": "Nhất quán vs. Chân thật với người thân", "q": "Seth cho rằng sự chân thật cảm xúc chỉ dành cho bạn thân hoặc gia đình, còn công việc cần sự nhất quán chuyên nghiệp. Nhưng Mel lại thừa nhận việc trút phần tệ nhất lên người thân yêu nhất là điều đáng tiếc. Vậy ranh giới nào giúp ta vừa chân thật, dễ tổn thương với gia đình mà vẫn không biến họ thành nơi hứng chịu sự thiếu kiểm soát của mình?"}, {"t": "Đạt chuẩn là xuất bản (Merely ship it)", "q": "Với một cuốn sách có tới hơn 100 lỗi nhỏ khi xuất bản nhưng ý tưởng cốt lõi vẫn tạo sức ảnh hưởng lớn, liệu việc dễ dãi với lỗi kỹ thuật có làm giảm uy tín lâu dài ở những lĩnh vực đòi hỏi độ chính xác cao không? Đâu là cách thiết lập bộ tiêu chuẩn (spec) vừa đủ chặt chẽ mà không rơi vào bẫy cầu toàn?"}];

RUN.quiz=function(){
  var box=$("quiz"),idx=0,score=0,res=[],locked=false,cur=null;
  var best=ld(K_QUIZ,{}).best;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function dots(){return QUIZ.map(function(_,i){var c=i<res.length?(res[i].ok?"ok":"no"):(i===idx?"on":"");return '<span class="'+c+'"></span>'}).join("")}
  function start(){idx=0;score=0;res=[];show()}
  function show(){
    var q=QUIZ[idx];locked=false;
    cur={q:q,o:shuffle(q.o.map(function(t,i){return{t:t,i:i}}))};
    box.innerHTML='<div class="qz qz-card"><div class="qz-top"><span>Câu '+(idx+1)+' / '+QUIZ.length+'</span><div class="qz-dots" aria-hidden="true">'+dots()+'</div></div>'+
      '<p class="qz-q" id="qzq">'+q.q+'</p>'+
      '<div class="qz-opts" role="group" aria-labelledby="qzq">'+cur.o.map(function(o,n){return '<button type="button" class="qz-o" data-n="'+n+'"><span class="l">'+"ABCD".charAt(n)+'</span><span>'+o.t+'</span></button>'}).join("")+'</div>'+
      '<div id="qzfb" aria-live="polite"></div></div>';
    window.__qzKey=function(e){
      if(locked){if(e.key==="Enter"&&document.activeElement.id!=="qzNext"&&$("qzNext")){$("qzNext").click();return true}return false}
      var n=parseInt(e.key,10)-1;if(n<0||n>3||isNaN(n)){n="abcd".indexOf(e.key.toLowerCase());if(n<0)return false}
      pick(n);return true};
  }
  function pick(n){
    if(locked||!cur||!cur.o[n])return;locked=true;
    var q=cur.q,okI=-1;cur.o.forEach(function(o,i){if(o.i===q.a)okI=i});
    var good=cur.o[n].i===q.a;if(good)score++;
    res.push({ok:good,pick:cur.o[n].t,right:q.o[q.a]});
    [].forEach.call(box.querySelectorAll(".qz-o"),function(b,i){
      b.disabled=true;
      if(i===okI){b.classList.add("ok");b.querySelector(".l").innerHTML=SVG_OK}
      else if(i===n){b.classList.add("no");b.querySelector(".l").innerHTML=SVG_NO}
      else b.classList.add("dim");
    });
    box.querySelector(".qz-dots").innerHTML=dots();
    var last=idx===QUIZ.length-1;
    $("qzfb").innerHTML='<div class="qz-fb'+(good?"":" no")+'"><b>'+(good?"Chính xác":"Chưa đúng")+'</b>'+esc(q.why)+'</div>'+
      '<div class="acts"><button class="btn" type="button" id="qzNext">'+(last?"Xem kết quả":"Câu tiếp theo")+'</button></div>';
    $("qzNext").focus({preventScroll:true});
    $("qzNext").onclick=function(){if(last)finish();else{idx++;show();box.scrollIntoView({block:"nearest"})}};
  }
  function finish(){
    window.__qzKey=null;
    var prev=ld(K_QUIZ,{}).best;var isBest=prev==null||score>prev;
    if(isBest)sv2(K_QUIZ,{best:score});
    var msg=score===QUIZ.length?"Trọn điểm. Bạn nắm khá chắc cuộc trò chuyện này.":
            score===QUIZ.length-1?"Rất tốt. Lệch đúng một câu, xem phần giải thích bên dưới là xong.":
            score>=3?"Khá ổn. Vài ý còn lẫn, đọc lại chương liên quan rồi làm lại thử.":
            "Chưa sao cả. Đọc lại các chương rồi thử lần nữa, lần hai thường khá hơn nhiều.";
    var shown=Math.max(prev==null?0:prev,score);
    box.innerHTML='<div class="qz qz-card"><div class="qz-score"><div class="n">'+score+'<small> / '+QUIZ.length+'</small></div><p>'+msg+'</p>'+
      '<span class="qz-best">'+(isBest&&prev!=null&&score>prev?"Điểm cao nhất mới của bạn.":"Điểm cao nhất của bạn: "+shown+" / "+QUIZ.length)+'</span></div>'+
      '<ul class="qz-rv">'+QUIZ.map(function(q,i){var r=res[i];
        return '<li class="'+(r.ok?"ok":"no")+'"><b><span class="mk">'+(r.ok?SVG_OK:SVG_NO)+'</span><span>'+q.q+'</span></b>'+
          (r.ok?'<span class="ans">Bạn chọn đúng: </span>'+r.right:'<span class="your">Bạn chọn: </span>'+r.pick+'<br><span class="ans">Đáp án đúng: </span>'+q.o[q.a])+
          '<br>'+esc(q.why)+'</li>'}).join("")+'</ul>'+
      '<div class="acts"><button class="btn" type="button" id="qzAgain">Làm lại</button><a class="btn sec" href="#ch'+(CH.length)+'" data-go="'+(CH.length-1)+'">Sang checklist hành động</a></div></div>';
    $("qzAgain").onclick=function(){start();box.scrollIntoView({block:"start"})};
  }
  box.addEventListener("click",function(e){var b=e.target.closest(".qz-o");if(b)pick(+b.getAttribute("data-n"))});
  start();
};

/* ---------- CÂU HỎI SUY NGẪM ---------- */
RUN.refl=function(){
  var notes=ld(K_NOTE,{});
  function card(prefix,list,label){return list.map(function(r,i){var id=prefix+i;
    return '<div class="rf"><div class="n">'+label+' '+(i+1)+'</div><h3>'+esc(r.t)+'</h3><p>'+esc(r.q)+'</p>'+
      '<textarea id="t_'+id+'" data-id="'+id+'" rows="4" aria-label="Câu trả lời của bạn cho: '+esc(r.t)+'" placeholder="Viết suy nghĩ của bạn ở đây...">'+esc(notes[id]||"")+'</textarea><div class="st" id="s_'+id+'"></div></div>'}).join("")}
  $("reflA").innerHTML=card("a",REF_A,"Suy ngẫm");
  $("reflB").innerHTML=card("b",REF_B,"Phản biện");
  var ids=[];REF_A.forEach(function(_,i){ids.push("a"+i)});REF_B.forEach(function(_,i){ids.push("b"+i)});
  function count(){var n=0;ids.forEach(function(i){if((notes[i]||"").trim())n++});prog($("reflProg"),n,ids.length,"Đã trả lời {n} / {t} câu")}
  count();
  var timers={};
  function grow(t){t.style.height="auto";t.style.height=Math.max(104,t.scrollHeight+2)+"px"}
  [].forEach.call(document.querySelectorAll(".rf textarea"),function(t){grow(t);
    t.addEventListener("input",function(){var id=t.getAttribute("data-id");grow(t);notes[id]=t.value;$("s_"+id).textContent="Đang lưu...";
      clearTimeout(timers[id]);timers[id]=setTimeout(function(){sv2(K_NOTE,notes);$("s_"+id).textContent="Đã lưu";count()},400)})});
  $("reflCopy").onclick=function(){
    var out=[];function add(p,list){list.forEach(function(r,i){var a=(notes[p+i]||"").trim();if(a)out.push(r.t+"\n"+r.q+"\n→ "+a)})}
    add("a",REF_A);add("b",REF_B);
    var b=$("reflCopy"),txt=out.length?out.join("\n\n"):"";
    if(!txt){b.textContent="Bạn chưa viết câu trả lời nào";setTimeout(function(){b.textContent="Sao chép câu trả lời của mình"},1800);return}
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){b.textContent="Đã sao chép"},function(){b.textContent="Không sao chép được, hãy bôi đen và copy tay"});
    setTimeout(function(){b.textContent="Sao chép câu trả lời của mình"},2200)};
};

/* ---------- CHECKLIST ---------- */
RUN.check=function(){
  var st=ld(K_CK,{});
  $("ck").innerHTML=CHECK.map(function(c,i){return '<button type="button" class="ck" role="checkbox" aria-checked="'+(!!st[i])+'" data-i="'+i+'"><span class="bx">'+SVG_OK+'</span><span class="ct"><b>'+esc(c.t)+'</b><span>'+esc(c.d)+'</span></span></button>'}).join("");
  function upd(){var n=0;CHECK.forEach(function(_,i){if(st[i])n++});prog($("ckProg"),n,CHECK.length,"Đã làm {n} / {t} việc");
    $("ckDone").innerHTML=n===CHECK.length?'<div class="ck-done">Xong cả '+CHECK.length+' việc rồi. Một tuần nữa quay lại đây, nhìn xem việc nào thực sự đổi được điều gì cho bạn.</div>':""}
  upd();
  $("ck").addEventListener("click",function(e){var b=e.target.closest(".ck");if(!b)return;var i=b.getAttribute("data-i");st[i]=!st[i];b.setAttribute("aria-checked",!!st[i]);sv2(K_CK,st);upd()});
};

function render(y){
  var c=CH[S.ch];window.__qzKey=null;
  $("page").innerHTML='<p class="kicker">'+(c.k?c.k+' · ':'')+(S.ch+1)+' / '+CH.length+'</p><h1>'+c.t+'</h1>'+c.body;
  $("barTitle").textContent=BOOK.title;
  document.title=c.t+" · "+BOOK.title;
  $("pager").innerHTML=
    (S.ch>0?'<a class="prev" href="#ch'+S.ch+'" data-go="'+(S.ch-1)+'"><small>← Chương trước</small><strong>'+CH[S.ch-1].t+'</strong></a>':'')+
    (S.ch<CH.length-1?'<a class="next" href="#ch'+(S.ch+2)+'" data-go="'+(S.ch+1)+'"><small>Chương sau →</small><strong>'+CH[S.ch+1].t+'</strong></a>':'');
  $("end").textContent=S.ch===CH.length-1?"Hết sách. Cảm ơn bạn đã đọc.":"";
  [].forEach.call($("tocList").querySelectorAll("a"),function(a,i){if(i===S.ch)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current")});
  if(c.run&&RUN[c.run])RUN[c.run]();
  window.scrollTo(0,y||0);progress();
}
function go(i){if(i<0||i>=CH.length)return;S.ch=i;history.replaceState(null,"","#ch"+(i+1));render(0);closeAll();$("page").focus({preventScroll:true})}

function progress(){
  var h=document.documentElement.scrollHeight-innerHeight;
  var p=h>0?Math.min(100,Math.max(0,scrollY/h*100)):100;
  var total=(S.ch+p/100)/CH.length*100;
  $("prog").style.width=p+"%";$("prog").setAttribute("aria-valuenow",Math.round(p));
  $("pct").textContent=Math.round(total)+"%";
}
var lastY=0,tick;
addEventListener("scroll",function(){
  progress();
  clearTimeout(tick);tick=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify({ch:S.ch,y:Math.round(scrollY)}))}catch(e){}},300);
},{passive:true});

/* mục lục */
$("tocList").innerHTML=CH.map(function(c,i){return (c.grp?'<li class="grp">'+c.grp+'</li>':'')+'<li><a href="#ch'+(i+1)+'" data-go="'+i+'"><span>'+(i+1)+'</span>'+c.t+'</a></li>'}).join("");
document.addEventListener("click",function(e){var a=e.target.closest("[data-go]");if(a){e.preventDefault();go(+a.getAttribute("data-go"))}});

function closeAll(){["toc","set"].forEach(function(i){$(i).classList.remove("on");$(i).setAttribute("aria-hidden","true")});$("scrim").classList.remove("on");$("openToc").setAttribute("aria-expanded","false");$("openSet").setAttribute("aria-expanded","false")}
function open(id,btn,scrim){var on=$(id).classList.contains("on");closeAll();if(!on){$(id).classList.add("on");$(id).setAttribute("aria-hidden","false");$(btn).setAttribute("aria-expanded","true");if(scrim)$("scrim").classList.add("on")}}
$("openToc").onclick=function(){open("toc","openToc",true)};
$("openSet").onclick=function(){open("set","openSet",false)};
$("scrim").onclick=closeAll;

/* tùy chỉnh */
$("fsUp").onclick=function(){S.fs=Math.min(30,S.fs+1);save();applyPrefs()};
$("fsDown").onclick=function(){S.fs=Math.max(15,S.fs-1);save();applyPrefs()};
function seg(id,key,num){$(id).addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var v=b.getAttribute("data-v");S[key]=num?parseFloat(v):v;save();applyPrefs()})}
seg("wSeg","w",true);seg("lhSeg","lh",true);seg("thSeg","theme");
var ICON_MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',ICON_SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function isDarkNow(){return (S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark"}
function syncQuick(){var b=$("themeQuick");if(!b)return;var dk=isDarkNow();b.setAttribute("aria-label",dk?"Chuyển sang nền sáng":"Chuyển sang nền tối");b.innerHTML=dk?ICON_SUN:ICON_MOON}
$("themeQuick").onclick=function(){S.theme=isDarkNow()?"light":"dark";try{localStorage.setItem("theme",S.theme)}catch(e){}save();applyPrefs()};
syncQuick();

/* phím tắt: ←/→ chương, T mục lục, Esc đóng; trong quiz: 1-4 hoặc A-D chọn đáp án */
addEventListener("keydown",function(e){
  if(e.target.closest("input,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(window.__qzKey&&e.key!=="Escape"&&window.__qzKey(e)){e.preventDefault();return}
  if(e.key==="Escape")closeAll();
  else if(e.key==="ArrowRight"&&S.ch<CH.length-1)go(S.ch+1);
  else if(e.key==="ArrowLeft"&&S.ch>0)go(S.ch-1);
  else if(e.key==="t"||e.key==="T")$("openToc").click();
});

applyPrefs();render(savedY);
</script>
</body>
</html>
