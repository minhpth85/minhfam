<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tự chọn lấy chính mình và Tạo làn sóng mới · Đọc sách · Minh Fam</title>
<meta name="description" content="Trang đọc ebook: bản dịch phần 2 cuộc trò chuyện Mel Robbins và Seth Godin về tự chọn lấy chính mình và tạo làn sóng mới, kèm quiz tương tác, câu hỏi suy ngẫm và checklist hành động.">
<link rel="icon" type="image/png" href="anh/logo.png">
<link rel="apple-touch-icon" href="anh/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try{var s=JSON.parse(localStorage.getItem('reader')||'{}');var d=document.documentElement;
var t=localStorage.getItem('theme');if(s.theme!=='sepia'&&(t==='dark'||t==='light'))s.theme=t;if(s.theme)d.setAttribute('data-theme',s.theme);window.__theme0=s.theme||null;}catch(e){}
</script>
<style>
:root{
  /* Minh Fam design system (xem site/minhfam.css). Tên biến rút gọn cho trang đọc. */
  --bg:#fbfaf5; --panel:#ffffff; --text:#1f2a22; --strong:#171c18; --muted:#505e4f;
  --line:#e1eae5; --brand:#32854d; --brand-strong:#317345; --on-brand:#ffffff; --chip:#ebf6ee; --note:#ebf6ee; --note-fg:#317345;
  --rule:#4a9b60; --hl:#f6e3a4; --bar:rgba(251,250,245,.92); --bad:#c2412f;
  --fh:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --fb:"Spectral",Georgia,"Times New Roman",serif;
  --fs:19px; --lh:1.63; --measure:680px; --ff:var(--fb);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --bg:#0f1a12; --panel:#18291c; --text:#cbd5cc; --strong:#eef3ee; --muted:#9aa89b;
  --line:#2a3d2e; --brand:#4fb06c; --brand-strong:#6cc487; --on-brand:#0f1a12; --chip:#1f3a26; --note:#1f3a26; --note-fg:#6cc487; --rule:#6cc487; --hl:#5b4a1a; --bar:rgba(15,26,18,.92); --bad:#f07a68; color-scheme:dark}}
:root[data-theme="sepia"]{
  --bg:#f4ecd8; --on-brand:#fbf5e4; --rule:#7a5c2e;  --panel:#fbf5e4; --text:#3b3226; --strong:#2a2218; --muted:#6b5d49;
  --line:#e0d4b8; --brand:#7a5c2e; --brand-strong:#6a4e24; --chip:#ece0c2; --note:#efe2bf; --note-fg:#7a5c2e; --hl:#e8d08a; --bar:rgba(244,236,216,.92); --bad:#b23a29}
:root[data-theme="dark"]{
  --bg:#0f1a12; --panel:#18291c; --text:#cbd5cc; --strong:#eef3ee; --muted:#9aa89b;
  --line:#2a3d2e; --brand:#4fb06c; --brand-strong:#6cc487; --on-brand:#0f1a12; --chip:#1f3a26; --note:#1f3a26; --note-fg:#6cc487; --rule:#6cc487; --hl:#5b4a1a; --bar:rgba(15,26,18,.92); --bad:#f07a68; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

/* thanh tiến độ */
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--brand);z-index:50}

/* thanh công cụ: cố định ở trên cùng khi cuộn */
.bar{position:fixed;top:0;left:0;right:0;z-index:40;height:56px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;transition:transform .25s}
.bar.hide{transform:translateY(-100%)}
.bar .l,.bar .r{display:flex;align-items:center;gap:6px}
.bar .t{font:600 14px/20px var(--fh);color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--fh);color:var(--muted);text-decoration:none}
.ib:hover{border-color:var(--line);color:var(--strong)}

/* bài đọc */
main{padding:96px 20px 40px}
article{max-width:var(--measure);margin:0 auto;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);hyphens:manual}
.kicker{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong);margin:0 0 14px}
article h1{font:600 clamp(30px,5.6vw,42px)/1.14 var(--fb);letter-spacing:-.015em;color:var(--strong);margin:0 0 28px}
article h2{font:600 1.35em/1.25 var(--fb);letter-spacing:-.01em;color:var(--strong);margin:2.2em 0 .6em}
article p{margin:0 0 1.2em}
article p.first::first-letter{font:600 3.4em/.9 var(--fb);float:left;margin:.08em .12em 0 0;color:var(--brand-strong)}
article blockquote{margin:1.8em 0;padding:0 0 0 24px;border-left:3px solid var(--rule);font:italic 400 1.3em/1.4 var(--fb);color:var(--strong)}
article .note{margin:0 0 1.8em;padding:1.1em 1.3em;background:var(--note);border-radius:20px;font-size:.88em;line-height:1.6}
article .note b{display:block;font:600 .78em/1 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--note-fg);margin-bottom:.5em}
article ul{padding-left:1.2em;margin:0 0 1.2em}
article li{margin-bottom:.5em}
article hr{border:0;text-align:center;margin:2.2em 0;color:var(--muted)}
article hr::before{content:"· · ·";letter-spacing:.6em}

/* lời thoại */
article .dl{margin:0 0 1.1em}
article .sp{font-weight:600}
article .sp.s{color:var(--brand-strong)}
article .sp.m{color:var(--strong)}

/* khối tự học: dùng chung */
.tl-lead{margin:0 0 1.4em}
.tl-prog{display:flex;align-items:center;gap:12px;margin:0 0 1.2em;font:600 13px/18px var(--fh);color:var(--muted)}
.tl-prog .tb{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tl-prog .tb i{display:block;height:100%;width:0;background:var(--brand);border-radius:3px;transition:width .35s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid transparent;background:var(--brand);color:var(--on-brand);font:600 14px/20px var(--fh);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brand-strong)}
.btn.sec{background:transparent;color:var(--strong);border-color:var(--line)}
.btn.sec:hover{border-color:var(--brand);background:transparent}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

/* quiz */
.qz{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px 26px 26px;font-size:1rem;line-height:1.5;box-shadow:0 1px 2px rgba(23,48,29,.05)}
.qz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qz-dots{display:flex;gap:6px;flex:1;max-width:200px}
.qz-dots span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.qz-dots .on{background:var(--rule);opacity:.55}
.qz-dots .ok{background:var(--brand)}
.qz-dots .no{background:var(--bad)}
.qz-q{font:600 1.18em/1.4 var(--fb);color:var(--strong);margin:0 0 1em;letter-spacing:-.005em}
.qz-opts{display:grid;gap:10px}
.qz-o{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);cursor:pointer;font:400 .92em/1.5 var(--fb);color:var(--text);transition:border-color .15s,background .15s,transform .15s}
.qz-o:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.qz-o .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px/1 var(--fh);color:var(--muted);transition:background .15s,border-color .15s,color .15s}
.qz-o:disabled{cursor:default}
.qz-o.dim{opacity:.55}
.qz-o.ok{border-color:var(--brand);background:var(--chip);opacity:1}
.qz-o.ok .l{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.qz-o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel));opacity:1}
.qz-o.no .l{background:var(--bad);border-color:var(--bad);color:var(--on-brand)}
.qz-fb{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--note);font-size:.92em;line-height:1.6;animation:rise .3s ease both}
.qz-fb b{display:block;font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--note-fg)}
.qz-fb.no b{color:var(--bad)}
.qz-card{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qz-score{text-align:center;padding:8px 0 4px}
.qz-score .n{font:600 clamp(56px,14vw,84px)/1 var(--fb);color:var(--brand-strong);letter-spacing:-.02em}
.qz-score .n small{font-size:.4em;color:var(--muted);font-weight:500}
.qz-score p{margin:10px auto 0;max-width:30em;font-size:1em;line-height:1.55}
.qz-best{display:block;margin-top:8px;font:500 13px/18px var(--fh);color:var(--muted)}
.qz-rv{margin:24px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.qz-rv li{padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--bg);font-size:.88em;line-height:1.55}
.qz-rv li b{display:flex;gap:10px;align-items:flex-start;font:600 1em/1.45 var(--fb);color:var(--strong);margin-bottom:6px}
.qz-rv .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);margin-top:1px}
.qz-rv .no .mk{background:var(--bad)}
.qz-rv .ans{color:var(--brand-strong);font-weight:500}
.qz-rv .your{color:var(--bad);font-weight:500}

/* câu hỏi suy ngẫm */
.rf{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:20px 20px 16px;margin-bottom:14px;font-size:1rem;line-height:1.55}
.rf .n{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong);margin-bottom:6px}
.rf h3{font:600 1.08em/1.35 var(--fb);color:var(--strong);margin:0 0 .35em}
.rf p{margin:0 0 .9em;font-size:.94em}
.rf textarea{display:block;width:100%;min-height:104px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:400 .94em/1.6 var(--fb)}
.rf textarea:focus{outline:0;border-color:var(--brand)}
.rf .st{min-height:18px;margin-top:6px;font:500 12px/18px var(--fh);color:var(--muted)}
.priv{font:500 13px/20px var(--fh);color:var(--muted);margin:0 0 1.2em}

/* checklist */
.ck{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px;margin:0 0 10px;border:1.5px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer;font-size:1rem;line-height:1.5;transition:border-color .15s,background .15s}
.ck:hover{border-color:var(--brand)}
.ck .bx{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--muted);display:grid;place-items:center;color:transparent;margin-top:1px;transition:background .15s,border-color .15s,color .15s}
.ck .ct b{display:block;font:600 1em/1.4 var(--fb);color:var(--strong);margin-bottom:3px}
.ck .ct span{display:block;font-size:.9em;line-height:1.55;color:var(--text)}
.ck[aria-checked="true"]{background:var(--chip);border-color:var(--brand)}
.ck[aria-checked="true"] .bx{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.ck[aria-checked="true"] .ct b{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.ck-done{margin:14px 0 0;padding:16px 18px;border-radius:16px;background:var(--note);font-size:.92em;line-height:1.6;animation:rise .3s ease both}

/* cuối chương */
.pager{max-width:var(--measure);margin:56px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-decoration:none;color:var(--text);font-family:var(--fh)}
.pager a:hover{border-color:var(--brand)}
.pager small{display:block;font:600 11px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager strong{display:block;font:600 17px/24px var(--fb);color:var(--strong)}
.pager .next{text-align:right;grid-column:2}
.pager .prev{grid-column:1}
.end{max-width:var(--measure);margin:24px auto 0;text-align:center;font:500 14px/20px var(--fh);color:var(--muted)}

/* ngăn mục lục / cài đặt */
.scrim{position:fixed;inset:0;background:rgba(15,26,18,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px rgba(23,48,29,.18);transition:transform .25s;font-family:var(--fh)}
#toc{top:0;bottom:0;left:0;width:min(380px,90vw);transform:translateX(-102%);overflow:auto;padding:20px;border-radius:0 20px 20px 0}
#toc.on{transform:none}
#set{top:64px;right:12px;width:min(340px,calc(100vw - 24px));padding:20px;border-radius:20px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#set.on{transform:none;opacity:1;pointer-events:auto}
.sheet h3{margin:0 0 14px;font:600 23px/30px var(--fb);color:var(--strong)}
.toc-book{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#toc ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
#toc a{display:flex;gap:12px;align-items:baseline;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--text);font:500 15px/22px var(--fh)}
#toc a span{flex:none;width:22px;color:var(--muted);font-weight:600}
#toc a:hover{background:var(--chip)}
#toc a[aria-current="true"]{background:var(--chip);color:var(--brand-strong);font-weight:600}
#toc li.grp{margin:12px 12px 2px;font:600 11px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.row>label,.row>span{font:600 13px/18px var(--fh);color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font:600 13px var(--fh);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--brand-strong)}
.themes{display:flex;gap:8px}
.themes button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.themes button[aria-pressed="true"]{border-color:var(--brand)}

@media (max-width:640px){
  :root{--fs:19px}
  main{padding:88px 18px 32px}
  .pager{grid-template-columns:1fr}.pager .next,.pager .prev{grid-column:1}.pager .next{text-align:left}
  .bar .t{display:none}
  .qz{padding:22px 18px 20px;border-radius:20px}
  .qz-o{padding:12px 13px;gap:12px}
}
@media print{.bar,#prog,.pager,.scrim,.sheet,.acts{display:none}main{padding:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="prog" role="progressbar" aria-label="Tiến độ đọc" aria-valuemin="0" aria-valuemax="100"></div>

<div class="bar" id="bar">
  <div class="l">
    <a class="ib" href="thu-vien.html" aria-label="Về Thư viện">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <button class="ib" id="openToc" type="button" aria-label="Mở mục lục" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Mục lục</span>
    </button>
  </div>
  <div class="t" id="barTitle"></div>
  <div class="r">
    <span class="ib" id="pct" style="cursor:default;border-color:transparent">0%</span>
    <button class="ib" id="themeQuick" type="button" aria-label="Chuyển nền sáng/tối"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ib" id="openSet" type="button" aria-label="Tùy chỉnh chữ và nền" aria-expanded="false">
      <span style="font-family:var(--fb);font-weight:600;font-size:17px">Aa</span>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<nav class="sheet" id="toc" aria-label="Mục lục" aria-hidden="true">
  <div class="toc-book">Tự chọn lấy chính mình và Tạo làn sóng mới</div>
  <h3>Mục lục</h3>
  <ol id="tocList"></ol>
</nav>

<div class="sheet" id="set" role="dialog" aria-label="Tùy chỉnh đọc" aria-hidden="true">
  <h3>Tùy chỉnh đọc</h3>
  <div class="row"><span>Cỡ chữ</span>
    <div class="seg"><button type="button" id="fsDown" aria-label="Giảm cỡ chữ">A−</button><button type="button" id="fsUp" aria-label="Tăng cỡ chữ">A+</button></div></div>
  <div class="row"><span>Độ rộng dòng</span>
    <div class="seg" id="wSeg"><button type="button" data-v="600">Hẹp</button><button type="button" data-v="680">Vừa</button><button type="button" data-v="760">Rộng</button></div></div>
  <div class="row"><span>Giãn dòng</span>
    <div class="seg" id="lhSeg"><button type="button" data-v="1.5">Chặt</button><button type="button" data-v="1.63">Vừa</button><button type="button" data-v="1.85">Thoáng</button></div></div>
  <div class="row" style="margin-bottom:0"><span>Nền</span>
    <div class="themes" id="thSeg">
      <button type="button" data-v="light" aria-label="Nền sáng" style="background:#fbfaf5"></button>
      <button type="button" data-v="sepia" aria-label="Nền giấy ngả vàng" style="background:#f4ecd8"></button>
      <button type="button" data-v="dark" aria-label="Nền tối" style="background:#0f1a12"></button>
    </div></div>
</div>

<main>
  <article id="page" tabindex="-1"></article>
  <div class="pager" id="pager"></div>
  <p class="end" id="end"></p>
</main>

<script>
/* ===== NỘI DUNG SÁCH =====
   CH: các chương của bản dịch (sinh từ Google Docs). Quiz, câu hỏi suy ngẫm và checklist ở các mảng bên dưới;
   ba chương cuối (tự học) được ghép từ các mảng đó. */
var BOOK={title:"Tự chọn lấy chính mình và Tạo làn sóng mới",author:"Bản dịch podcast Mel Robbins × Seth Godin, phần 2"};
var CH=[{"t": "Phần mở đầu", "k": "Mở đầu", "body": "<div class=\"note\"><b>Về bản đọc này<\/b>Đây là bản dịch tiếng Việt phần 2 cuộc trò chuyện giữa Mel Robbins và Seth Godin trên The Mel Robbins Podcast, được chia thành chương để dễ đọc. Nội dung gốc thuộc về những người thực hiện chương trình. Cuối sách có quiz, câu hỏi suy ngẫm và checklist để bạn làm ngay.<\/div><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Có một dự án, một mục tiêu, hay một điều gì đó rất quan trọng đối với bạn nhưng bạn cứ mãi không tìm ra thời gian để bắt tay vào làm. Lúc nào cũng có một cái cớ giải thích tại sao bạn chưa thể hoàn thành nó. Chà, điều đó sẽ thay đổi ngay bây giờ. Bạn sắp được gặp một trong những người thầy dẫn dắt của tôi - nhân vật có một không hai: Seth Godin. Ông đã viết hơn 20 cuốn sách bán chạy nhất. Ông được mệnh danh là cha đẻ của ngành marketing hiện đại. Nhưng đối với tôi, những tác phẩm của ông đóng vai trò then chốt trong việc dạy tôi cách ngừng trốn tránh và bắt đầu dẫn dắt, sáng tạo, cũng như sống một cuộc đời lớn lao và táo bạo hơn.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nơi duy nhất để bắt đầu là ngay tại nơi bạn đang đứng. Nếu bạn cứ chờ đợi để đến được một nơi khác rồi mới bắt đầu, bạn sẽ không bao giờ đến được đó đâu. Nếu chúng ta sắp làm một điều gì đó quan trọng, chắc chắn sẽ có sự kháng cự. Nếu bạn không cảm thấy sự kháng cự, có lẽ việc đó chưa đủ quan trọng. Được rồi, hai từ thôi. Bạn sẵn sàng chưa?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Sẵn sàng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tự chọn lấy mình (Pick yourself). Hệ thống chi phối ngoài kia muốn bạn chờ đợi được mời tham gia một chương trình truyền hình thực tế, chờ được mời đi nộp đơn xin việc. Họ muốn bạn đến văn phòng giới thiệu việc làm và ngồi chờ công ty đến phỏng vấn bạn. Cái ý tưởng rằng sẽ có ai đó chọn bạn và trao quyền cho bạn - họ sẽ gọi điện và bảo: Mel à, chúng tôi biết bạn có một cuốn tiểu thuyết ấp ủ trong mình. Làm ơn viết cuốn tiểu thuyết đó đi và chúng tôi sẽ xuất bản nó. Hết phim. Thật sự rất ngại ngùng khi phải nói ra: Ừ, tôi tự chọn lấy mình đấy. Tôi đã viết cái này. Này, tôi đã làm ra thứ này đây. Chẳng ai ép bạn không được chờ đợi cả. Chính bạn đang lựa chọn chờ đợi. Thật là một chỗ trú ẩn an toàn và êm ái làm sao. Chúc mừng nhé. Bạn đã tự xây cho mình một nơi hoàn hảo để trốn tránh. Hãy tạo nên một làn sóng khuấy động (go make a ruckus) - đơn giản lắm. Đó là làm công việc có ý nghĩa cho những người thực sự quan tâm.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chào các bạn, mình là Mel và mình vô cùng hào hứng khi được học hỏi và truyền cảm hứng từ Seth Godin. Bạn chắc chắn sẽ không còn là con người cũ sau khi xem tập này hôm nay. Nhưng có một chuyện thế này. Đội ngũ của mình vừa báo rằng 57% số người xem podcast The Mel Robbins trên YouTube vẫn chưa bấm đăng ký kênh (Subscribe). Làm sao để biết bạn chưa đăng ký? Nút đăng ký đang sáng lên ngay lúc này đấy. Bấm đăng ký hoàn toàn miễn phí. Mình biết bạn là người luôn thích ủng hộ những người đang hỗ trợ bạn. Vì vậy, mình xin cảm ơn bạn trước. Cảm ơn bạn đã bấm đăng ký. Đó là cách tuyệt vời nhất để cho đội ngũ của mình thấy bạn yêu thích những gì tụi mình đang làm. Điều đó cũng giúp tụi mình tiếp tục mời được những chuyên gia đẳng cấp thế giới như Seth Godin - tác giả của 20 cuốn sách bán chạy liên tiếp. Ông ấy sắp chia sẻ với bạn những giá trị sâu sắc chưa từng có. Mình không muốn bạn bỏ lỡ bất kỳ điều gì. Đó là lý do nút đăng ký rất quan trọng. Cảm ơn bạn đã làm điều đó. Nào, hãy cùng bắt đầu chương trình. Seth Godin, chào mừng ông đến với The Mel Robbins Podcast.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Giấc mơ thành hiện thực rồi. Cảm ơn Mel vì đã mời tôi.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng là giấc mơ thành hiện thực thật, bởi hơn bất kỳ ai khác - tôi sắp khóc ngay khi chúng ta đang nói chuyện đây - hơn bất kỳ ai khác, ông thực sự đã dạy tôi cách vượt qua nỗi sợ hãi, sự kháng cự và đưa tác phẩm của mình ra thế giới. Ông đã dạy tôi mọi thứ tôi biết về cách tạo tác động tới mọi người, cách giao tiếp, làm marketing và có lòng dũng cảm. Tôi rất tự hào khi ông có mặt ở đây vì công ty 143 Studios của chúng tôi và chương trình podcast này được vận hành bởi những người đều là học trò của ông. Tôi nóng lòng muốn thấy sức ảnh hưởng của cuộc trò chuyện này lên bất kỳ ai lắng nghe và theo dõi nó. Sứ mệnh của tôi là chúng ta sẽ cùng nhau thắp lên một ngọn lửa bùng cháy trong tâm hồn ai đó, để họ không chỉ nghe mà còn thực sự hành động.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cảm ơn bạn. Một trong những thước đo công việc của tôi không phải là điều gì xảy ra khi tôi dạy một ai đó, mà là những gì họ dạy lại cho người khác. Và bạn đã truyền cảm hứng, giảng dạy cho hàng triệu người - thật sự rất phấn khích khi được ngồi chung một căn phòng với bạn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Được rồi, triển khai thôi nào\\! (cười)<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Bắt đầu thôi.<\/p>"}, {"t": "Bắt đầu từ nơi bạn đứng &amp; Phân biệt Vấn đề với Hoàn cảnh", "k": "Chương 1", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Như ông vẫn nói, hãy tạo nên một làn sóng khuấy động. Cuộc sống của tôi - và của người đang nghe, đang xem lúc này - có thể khác đi như thế nào nếu chúng tôi thực sự ghi tâm tất cả những gì ông sắp dạy và chia sẻ hôm nay? Điều gì có thể thay đổi?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Bạn biết đấy, nếu bạn nghĩ về bất kỳ tình huống nào mình đang gặp phải, dù ở chỗ làm hay ở nhà, liệu có điều gì bạn có thể làm để khiến nó tệ hơn không? Có câu chuyện nào bạn có thể tự kể với bản thân, hay hành động nào bạn có thể làm để mọi thứ trở nên tồi tệ hơn không? Tôi nghĩ tất cả chúng ta đều đồng ý câu trả lời là chắc chắn có. Chà, theo thước đo đó, ắt hẳn cũng có những điều bạn có thể làm để khiến mọi thứ tốt đẹp hơn. Và bạn có thể làm nó tốt hơn bằng cách chủ động lựa chọn một chiến lược. Có lẽ ta có thể viết lại câu chuyện mình đang tự kể với bản thân - không làm nạn nhân hay một bánh răng vô hồn trong hệ thống có sẵn nữa, mà xây dựng một thứ gì đó mang tính kiến tạo và giúp mọi thứ tốt đẹp hơn cho những người quan tâm. Nghe có vẻ là một đòi hỏi lớn lao, nhưng nếu ta có thể khiến mọi thứ tệ đi một cách dễ dàng chẳng cần nỗ lực, thì chắc chắn ta cũng có thể khiến chúng tốt lên được.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi chưa bao giờ nghĩ theo hướng đó cả. Quả thật là vậy. Nếu bạn thực sự ngẫm câu hỏi: làm thế nào để mình khiến cuộc đời mình tệ hơn? Tôi có thể nghĩ ra cả trăm thứ khiến nó tệ đi ngay hôm nay.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng thế.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ấy vậy mà chúng ta lại chẳng dừng lại để nghĩ về vô số cách mình có thể làm cho cuộc sống, công việc, các mối quan hệ của mình trở nên tốt đẹp hơn. Với tất cả những người ông từng giảng dạy và truyền cảm hứng, để mở rộng góc nhìn về những điều khả thi cho khán giả, đâu là những điều đa dạng mà mọi người đã cải thiện được khi áp dụng các khái niệm chúng ta sắp đào sâu hôm nay?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Người ta rất dễ chỉ nhìn vào các con số - kiểu bạn đã tăng trưởng bao nhiêu, tổ chức của bạn lớn cỡ nào. Nhưng tôi nghĩ mọi thứ đều bắt đầu từ chính ngôi nhà của bạn. Nó bắt đầu từ tiếng ồn đầu tiên ta nghe thấy trong đầu khi thức dậy và câu nói cuối cùng ta dành cho người mình thương yêu trước khi đi ngủ. Tất cả những điều đó được tiếp nhiên liệu bởi câu chuyện ta tự kể với chính mình: câu chuyện của một nạn nhân hay câu chuyện của một kiến trúc sư. Câu chuyện khi ta nhìn người ngồi đối diện bên kia bàn và nhủ rằng: trong hoàn cảnh hiện tại, họ đang làm hết sức mình rồi. Tôi không thể thay đổi họ, nhưng tôi có thể thay đổi hoàn cảnh. Vì vậy, ta bắt đầu bằng việc nhận ra rằng những người từng trải qua những chuyện tồi tệ hơn tôi hay bạn rất nhiều bằng cách nào đó vẫn tìm ra cách để vươn lên mạnh mẽ ngay tại nơi họ đang đứng. Bởi vì nơi duy nhất để bắt đầu là ngay tại nơi bạn đang đứng. Nếu bạn cứ chờ đến một nơi khác rồi mới bắt đầu, bạn sẽ không bao giờ tới được đó. Ta phải bắt đầu từ hiện tại, thừa nhận những gì đang diễn ra xung quanh, và sau đó đưa ra lựa chọn: ta muốn thay đổi mọi thứ hay muốn giữ nguyên như cũ. Nhưng bạn chỉ là nạn nhân nếu bạn muốn làm nạn nhân mà thôi.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi không nghĩ ai thích nghe câu bạn chỉ là nạn nhân nếu bạn muốn làm nạn nhân đâu.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Vậy để tôi nói thật rõ ràng. Tôi đã trúng số độc đắc ngay từ ngày sinh ra. Tôi trúng số vì có bố mẹ tuyệt vời. Tôi sinh ra với rất nhiều lợi thế so với những người xung quanh hay qua nhiều thế hệ. Ngay lúc này có những người đang ở trong các mối quan hệ bạo hành. Họ nợ nần ngập đầu. Họ đang phải đối mặt với khuyết tật thể chất hoặc tinh thần. Tất cả những điều đó đều có thật. Nhưng rồi bạn sẽ làm gì tiếp theo? Đúng không? Sau đó bạn sẽ làm gì? Vậy nên tôi dùng từ nạn nhân ở đây rất cẩn trọng. Tôi không nói những chuyện tồi tệ không xảy ra. Chúng có xảy ra, và thường giáng xuống những người không đáng phải chịu. Điều tôi muốn nói là: ta nên xử lý những gì vừa xảy ra như thế nào? Ta nên thêm chữ nhưng (but) hay chữ và (and)? Đúng không? Tôi đang đi nghỉ nhưng trời lại mưa - điều đó có nghĩa kỳ nghỉ của tôi tan tành rồi. Còn nếu là: tôi đang đi nghỉ và trời đang mưa - điều đó mở ra cánh cửa cho câu hỏi: vậy giờ tôi sẽ làm gì với tình huống này?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ông có thể cho tôi thêm vài ví dụ về sức mạnh của từ nhưng so với từ và không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Hai từ đó gánh vác rất nhiều sức nặng trong nhiều câu nói, nhiều câu chuyện ta tự kể với mình. Ví dụ: tôi muốn người kia có đúng đám cưới họ mơ ước, nhưng tôi cũng muốn nó vừa vặn ngân sách của mình và theo ý của tôi. Từ nhưng đó đang gồng gánh quá nhiều mâu thuẫn. Và đây là một trong những chìa khóa được mở ra qua lý thuyết Hãy để họ làm (Let Them Theory) của bạn: bạn có thể để người khác làm điều họ muốn, nhưng bạn không thể giữ chữ nhưng và chữ và cùng một lúc theo kiểu mâu thuẫn được. Trước mắt chúng ta có những thứ gọi là vấn đề (problems), và có những thứ gọi là hoàn cảnh (situations). Vấn đề thì có giải pháp. Hoàn cảnh thì không. Nếu đó là hoàn cảnh, ta không có lựa chọn nào khác ngoài chấp nhận vì nó không có lời giải. Nhưng nếu đó là vấn đề, nó có thể giải quyết được. Có thể bạn không thích giải pháp đó, nhưng nó vẫn giải quyết được. Vậy nên bài học tôi rút ra từ cuốn sách tuyệt vời của bạn là: nếu người đó cứ làm điều họ muốn làm, tôi có thể coi đó là một hoàn cảnh, hoặc tôi có thể cãi vã to tiếng về nó. Hoặc tôi nhận ra họ sẽ làm điều họ muốn, và giải pháp của tôi cho vấn đề này là cứ để họ làm.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Sự khác biệt giữa một vấn đề có giải pháp và một hoàn cảnh là gì ạ? Vì nãy giờ tôi ngồi nghe và tự hỏi: ủa, hoàn cảnh là thứ bạn không thể thay đổi hay kiểm soát được, đúng không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chính xác. Nhiều năm trước ở đại học tôi được đào tạo làm kỹ sư cơ khí. Bạn không thể viết lại các định luật vật lý. Bạn không thể có mặt ở hai thành phố cùng một lúc. Bạn không thể ép một công ty mua hàng của bạn nếu họ không muốn mua. Đó là những hoàn cảnh. Còn vấn đề thì có giải pháp. Chỉ là trong ngắn hạn bạn có thể không thích giải pháp đó. Nhưng luôn có một lối đi phía trước nếu bạn sẵn lòng chấp nhận một kết quả khác với thứ bạn từng mơ mộng. Vì vậy, điều tôi muốn làm là giải thoát bạn khỏi gánh nặng nếu đó là hoàn cảnh: được rồi, tôi không thể thay đổi điều này, nghĩa là tôi phải chấp nhận nó. Hoặc đặt trách nhiệm vào tay bạn nếu đó là vấn đề: ừ, nếu đây là một vấn đề, có thể tôi không thích giải pháp lắm - có lẽ tôi đã nghĩ ra một cách giải quyết mà tôi không muốn làm, nhưng tôi biết mình có thể làm, chỉ là tôi không thích thôi. Nhưng đó vẫn là một giải pháp. Chia tay một mối quan hệ, chăm sóc bản thân tốt hơn, tuân thủ ngân sách, bước ra ngoài và chấp nhận rủi ro bị người khác phán xét - tất cả đều là vấn đề, và chúng đều có giải pháp. Chỉ là ta không muốn làm thôi.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng vậy. Một ví dụ kỹ thuật đơn giản nhé: nếu bạn sẵn sàng có một cuộc trò chuyện hơi khó xử với sếp trong 15 phút mỗi năm, bạn sẽ kiếm được nhiều tiền hơn, vì trong 15 phút đó bạn có thể chia sẻ sự thật chân thành về vị trí hiện tại và hướng đi bạn muốn tới. Nhưng nếu bạn thấy việc đó quá phiền phức và đáng sợ, thì bạn nên an phận với những gì mình đang có. Vậy giải pháp cho bài toán đàm phán lương là khả năng cao phải trải qua một cuộc trò chuyện hơi ngượng ngùng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tương tự, nếu bạn đời của bạn xếp bát đĩa vào máy rửa bát theo cách khiến bạn cực kỳ khó chịu, nhưng bạn lại muốn họ tự hiểu ra điều đó mà không muốn mất 10 phút phiền toái để ngồi nói chuyện thẳng thắn. Chà, ta đều biết giải pháp là gì rồi: nói ra sự thật, trò chuyện tôn trọng, dành cho người kia sự thấu cảm nhưng vẫn để họ nghe điều bạn cần nói. Vậy là bạn đã giải quyết xong vấn đề. Chỉ là quá trình giải quyết vấn đề đó không vui vẻ gì lắm.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Thì hầu hết các vấn đề đâu có vui vẻ gì cho tới khi bạn giải quyết xong chúng đâu.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Mấy vấn đề dễ thì đã được giải quyết hết rồi mà.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chuẩn luôn.<\/p>"}, {"t": "Sự kháng cự (Resistance) - La bàn chỉ lối đến công việc quan trọng", "k": "Chương 2", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ông có nhắc đến tiếng ồn, và một trong những điều công việc của ông dạy tôi là nhận ra mình đã tự tạo ra và đặt bao nhiêu sự kháng cự (resistance) ngay trên con đường của chính mình. Khi mới tiếp xúc với triết lý của ông, Seth ạ, cảm giác rất dễ bị đụng chạm, kiểu đọc sách của Seth xong thấy bực bội: ông ta tưởng mình là ai chứ, giải pháp với chả vấn đề, tiếng ồn, ông ta chẳng hiểu gì cả. Nhưng rồi bạn bắt đầu thực sự cân nhắc tất cả sự kháng cự mà bạn đang có đối với danh sách những việc bạn hoàn toàn có thể làm để cải thiện tình hình. Tôi rất muốn mổ xẻ điều này, bởi nó tạo ra tác động lớn nhất đối với tôi: thực sự trung thực với bản thân về việc mình đang tự cản đường mình nhiều đến mức nào, và mình đổ lỗi cho người khác, cho hoàn cảnh nhiều ra sao trong khi thực chất chẳng phải tại những thứ đó.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Từ kháng cự (resistance) chỉ bất kỳ điều gì ta làm để tự ngáng chân mình, nhằm ngăn bản thân làm một việc khiến ta sợ hãi. Hãy nói về hội chứng bí ý tưởng của nhà văn (writer's block). Khái niệm này mới chỉ được phát minh ra cách đây 100 năm thôi. Chúng ta biết ai đặt tên cho nó: người chồng thi sĩ lông bông của tác giả viết cuốn Frankenstein. Hội chứng bí ý tưởng dựa trên quan niệm rằng hôm nay nàng thơ không ghé thăm để mách bảo bạn viết gì. Toàn chuyện vớ vẩn. Chẳng có thứ gì gọi là bí ý tưởng cả. Thực chất là khi một việc gì đó mang lại cảm giác quan trọng - viết một bản ghi nhớ quan trọng, vẽ một bức tranh quan trọng, đi hẹn hò vào tối mai với người bạn thầm thích bấy lâu - bên trong ta tự động dựng lên lớp vỏ bọc để tự bảo vệ, để trốn tránh trách nhiệm, vì ta đã bị trường học nhồi nhét thói quen đó từ nhỏ. Công nhân nhà máy không cần phải chịu trách nhiệm lớn; họ chỉ cần làm theo lời dặn. Nhưng tôi nghĩ đó cũng là một phần bản chất con người. Và vì thế, sự kháng cự là thứ ta không thể làm biến mất được. Nếu ta sắp làm một việc quan trọng, chắc chắn sẽ có sự kháng cự. Nếu bạn không cảm thấy kháng cự, có lẽ việc đó chưa đủ quan trọng. Vậy câu hỏi đặt ra là: bạn làm gì khi nó xuất hiện? Câu trả lời là hãy nói: Cảm ơn nhé. Cảm ơn vì đã báo cho tôi biết tôi đang đứng trước ngưỡng cửa làm một việc quan trọng. Cảm ơn vì đã nhắc tôi phải đưa việc này lên đầu danh sách ưu tiên. Những việc tôi đang trì hoãn là do sự kháng cự. Và thế là tôi có một chiếc la bàn. Chiếc la bàn đó chỉ thẳng cho tôi thấy đâu là công việc khó nhằn cần phải làm. Và khái niệm công việc khó nhằn (hard work) cũng rất đáng bàn một chút. Ngày xưa, làm việc vất vả nghĩa là bạn vác được bao nhiêu cân sỏi trên lưng vì chưa có máy móc. Còn ngày nay, làm việc vất vả nghĩa là: tôi có tìm ra giải pháp nào chưa nằm trong danh sách có sẵn không? Tôi có nói lên sự thật theo cách mà người kia có thể lắng nghe không? Tôi có đưa ra một quyết định sáng suốt không? Tôi có viết ra thứ chưa từng được viết, hát lên giai điệu chưa từng được hát, vẽ nên bức tranh chưa từng được vẽ không? Đó mới là công việc của chúng ta. Thế nên khi nghĩ về cách gắn kết với gia đình: nếu ta chỉ hâm đồ ăn bằng lò vi sóng, làm cho xong mọi đầu việc, rồi ngồi xem phim trực tuyến ba tiếng mỗi tối, bạn đang hòa nhập rất tốt, đang làm các công ty giải trí hài lòng đấy, nhưng bạn không đối diện với sự kháng cự - đó là câu hỏi: công việc thực sự cần làm mà tôi đang sợ hãi là gì?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tại sao làm công việc mà bạn sợ hãi lại là bí quyết dẫn đến một cuộc đời viên mãn hơn? Bởi người ta rất dễ nhầm từ công việc với nghề nghiệp hay những gạch đầu dòng trong danh sách việc cần làm. Nhưng tôi biết ông đang nói đến một tầng sâu hơn thế rất nhiều - về trải nghiệm được sống thực sự, và trải nghiệm về chính bản thân mình khi bước qua cuộc đời này. Ông có thể đi sâu hơn xem công việc đó thực chất nghĩa là gì không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tôi chẳng biết ai muốn dành phần đời còn lại chỉ để nằm dài trên bãi biển gọi phục vụ mang cocktail Mai Tai ra mỗi ngày và không được phép làm bất cứ việc gì khác. Tôi nghĩ điều đó sẽ khiến hầu hết mọi người phát điên. Khi có cơ hội tạo ra giá trị hữu ích dưới bất kỳ hình thức nào - dù có được trả tiền hay không - chúng ta có cơ hội được sống trọn vẹn. Đó có thể là đồ gốm bạn tự nặn lúc rảnh rỗi hay cách bạn nuôi dạy con cái. Có thể là việc bạn đi làm tình nguyện ở trạm cứu hộ động vật địa phương. Tất cả đều là công việc. Bạn làm vì việc đó cần được làm, và làm tốt việc đó mang lại niềm vui sâu sắc. Và có một tác dụng phụ kỳ diệu: cuộc sống đầy ý nghĩa đó kéo theo hàng loạt kết quả tốt đẹp như sự tôn trọng nhiều hơn, sự độc lập hơn, và cả nguồn lực tài chính vững vàng hơn, bởi vũ trụ luôn nóng lòng chờ đợi những người làm việc tử tế xuất hiện. Mọi người sẽ xếp hàng trước cửa nhà bạn để trao cho bạn tình bạn, sự kính trọng, hoặc thậm chí là tiền bạc, nếu bạn là người dám làm những việc mà người khác sợ hãi.<\/p>"}, {"t": "Tự chọn lấy chính mình (Pick Yourself) &amp; Thoát khỏi nơi ẩn náu", "k": "Chương 3", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Một điều rất thú vị là khi bạn nghĩ về một việc bạn biết rất quan trọng với mình - dù là dọn dẹp lại căn gác xép giờ con cái đã lớn đi xa, chẳng ai bận tâm nhưng nó cứ day dứt trong lòng bạn, hay viết lại toàn bộ công thức nấu ăn của bà ngoại để tự xuất bản một cuốn sách nấu ăn, hay mở cửa hàng trên Etsy, hay tình nguyện ở khu vườn cộng đồng - luôn có một tiếng gọi âm ỉ bên trong mỗi chúng ta mà ta cứ cố gạt đi và dập tắt. Điều ông đang nói là sự kháng cự bạn cảm thấy xuất phát từ việc những điều quan trọng ấy không tự biến mất. Không một sự bận rộn nào có thể xoa dịu được nỗi khắc khoải đó. Ông đang cho phép chúng ta nhìn nhận nó theo một cách khác: đó không phải là một việc vặt trong danh sách phải làm, mà là những điều quan trọng nhất bạn nên ép mình dành thời gian cho nó. Vậy bản chất cá nhân của cuốn sách còn dang dở, kênh YouTube muốn mở, hay dự án tay trái bạn hằng mơ ước đó thực sự là gì vậy, Seth?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Được rồi, hai từ thôi. Bạn sẵn sàng chưa?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Sẵn sàng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Tự chọn lấy mình (Pick yourself). Hệ thống chi phối ngoài kia không muốn bạn tự chọn lấy mình. Hệ thống đó muốn bạn ngồi chờ được mời tham gia truyền hình thực tế, chờ được mời nộp đơn xin việc. Họ muốn bạn đến văn phòng giới thiệu việc làm và chờ công ty tới phỏng vấn. Cái ý tưởng rằng sẽ có người khác chọn bạn và cấp phép cho bạn - họ gọi điện bảo: Mel ơi, chúng tôi biết bạn có một cuốn tiểu thuyết trong đầu, làm ơn viết đi rồi chúng tôi xuất bản cho. Tôi nói từ kinh nghiệm thực tế đây: tôi từng trò chuyện với hàng ngàn người ở đúng hoàn cảnh đó, những người ấp ủ một cuốn sách trong lòng. Và lời khuyên của tôi đơn giản lắm: hãy xuất bản nó thành file PDF, gửi email cho 20 người, nhờ họ chia sẻ miễn phí cho những người khác. Nếu nó lan tỏa, điện thoại của bạn sẽ reo và bạn sẽ được mời viết cuốn tiếp theo. Nếu nó không lan tỏa, hãy viết một thứ hay hơn. Hết chuyện. Thế nhưng hầu như chẳng ai làm điều đó, vì thật ngại ngùng khi phải nói: Ừ, tôi tự chọn lấy mình đấy. Tôi viết cái này. Này, tôi làm ra thứ này đây. Bốn từ: này, tôi làm cái này (here, I made this) đầy thách thức, đúng không? Mua một cuốn sách dạy nấu ăn rồi làm theo công thức bao giờ cũng dễ hơn việc tự sáng tạo ra một món ăn để phục vụ những người bạn thương yêu. Vì vậy, nếu ta có thể sống một cuộc đời biết nhận diện những gì thực sự quan trọng với mình, rồi tự chọn lấy mình - không phải để giành giải thưởng hay huy chương, mà vì ta có quyền tự chủ, vì ta có thể làm được - từ để chỉ điều đó là tự do. Đó là trách nhiệm của việc bước ra làm một thứ gì đó và trao tặng cho thế giới. Có thể chỉ gia đình bạn nhận ra căn gác xép đã sạch bóng, nhưng bạn hiểu rằng chính bạn đã thuê bản thân mình dọn căn gác đó. Đừng đợi đến lúc bán nhà và người môi giới bắt bạn dọn thì mới làm. Bạn tự thuê chính mình dọn gác xép. Thứ tự do và trách nhiệm đó - đó chính là nơi phẩm giá ngự trị. Và bất kỳ ai tôi từng gặp đều khao khát có thêm phẩm giá trong cuộc sống của mình.<\/p><p><em>(Đoạn giới thiệu nhà tài trợ Ashley)<\/em><\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Bạn có nghĩ ngôi nhà của mình nên là tấm gương phản chiếu con người bạn không? Dĩ nhiên là có rồi. Đó là lý do bạn cần biết về nhà tài trợ của chúng tôi, Ashley. Ashley có những phong cách cân bằng giữa nét đẹp vượt thời gian và xu hướng hiện đại giúp bạn mang dấu ấn cá nhân vào ngôi nhà. Thực tế tôi có xem qua trang web của Ashley vì biết thế nào bạn cũng hỏi: Mel ơi, chị thích mẫu nào? Đó là bộ sưu tập Crystaland. Phong cách đồng quê hiện đại mang lại cảm giác ấm áp, gần gũi nhưng lại rất gọn gàng và tinh tế. Tôi mê sự gọn gàng tinh tế với tông gỗ nâu sáng, điểm nhấn kim loại đen, và chiếc bàn ăn cực kỳ ấn tượng - có thể mở rộng từ 80 lên 98 inch nhờ phần lá bàn tháo rời, đủ chỗ cho tới 10 người. Nhìn chiếc bàn đó là bạn hình dung ra ngay những bữa tối ngày lễ, sum họp gia đình, bạn bè quây quần tạo nên đủ mọi kỷ niệm. Mỗi sản phẩm của Ashley đều được thiết kế tỉ mỉ, bền bỉ theo thời gian để ngôi nhà của bạn không chỉ đẹp mà còn tiện dụng đúng nghĩa. Thêm vào đó, Ashley cung cấp dịch vụ giao hàng cao cấp nhanh chóng, đáng tin cậy tới tận căn phòng bạn chọn, giúp toàn bộ trải nghiệm từ đầu đến cuối thật nhẹ nhàng. Hãy ghé cửa hàng Ashley gần nhất hoặc truy cập ashley.com để tìm phong cách của riêng bạn nhé.<\/p><p><em>(Quay lại cuộc trò chuyện)<\/em><\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tại sao lại có quá nhiều sự kháng cự đối với việc tự chọn lấy mình vậy ạ? Tại sao chúng ta cứ chờ đợi ai đó xuất hiện và bảo: Này, bạn nên viết cuốn sách đó đi. Này, bạn nên nghỉ việc đi. Này, bạn nên khởi nghiệp đi. Này, bạn từng nghĩ đến chuyện rời bỏ mối quan hệ đó chưa? Hay bạn nên nhờ gia đình san sẻ việc nhà nhiều hơn đi?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cuộc đời giống như trường trung học vậy, đúng không?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng vậy.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Trường trung học dạy cho chúng ta rất nhiều thứ vào một giai đoạn cực kỳ quan trọng của cuộc đời. Và những người sống sót qua giai đoạn đó với vẻ ngoài an toàn nhất không phải những người tự chọn lấy mình. Họ là những người biết ẩn mình. Ẩn mình trong bộ đồng phục, ẩn mình sau một thái độ, ẩn mình trong một nhóm bạn, ẩn mình trong một hội nhóm hay đám đông. Và hệ thống muốn chúng ta tiếp tục ẩn mình như thế. Rất dễ để bán cho bạn những hộp đồ ăn trưa đóng sẵn hay chương trình tivi tiếp theo nếu bạn hòa tan vào đám đông. Vì thế, chúng ta phải nỗ lực để tự giải phóng mình khỏi điều đó. Đó cũng là một trong những phép màu khi bạn chia sẻ tập podcast này: khi bạn nói với một người bạn rằng mình sẽ bắt đầu hành động theo cách mới này, hãy nghe tập này và nhắc nhở mình nhé - tức là bạn đã tự chọn lấy mình, và bạn cũng chọn thêm một người bạn đồng hành để giữ kỷ luật cho bản thân. Vòng tròn tích cực cứ thế tiếp diễn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Một điều ta dễ nhận thấy là khi bạn thuộc về một môi trường nào đó - dù là nhóm nhạc sĩ nhạc jazz ở Chicago năm 1964 hay giới khởi nghiệp Thung lũng Silicon 10 năm trước - bạn luôn muốn hòa nhập với nhóm người, với cộng đồng mình đang thuộc về.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Vì vậy, nếu cộng đồng bạn đang tham gia không đưa bạn đến nơi bạn muốn tới, hãy xây dựng một cộng đồng khác. Hãy tạo ra một vòng tròn mới gồm những người dám hỏi nhau những câu hỏi thẳng thắn về các mối quan hệ của họ, về những cuốn sách họ đang đọc, những cuốn sách họ đang viết, về bất cứ điều gì bạn muốn tạo ra - bởi chúng ta sẽ trở thành bản sao của những người mình hay giao du và những kỳ vọng họ đặt lên ta.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi tin chắc chắn rằng trong cấu trúc tự nhiên của con người có một nhu cầu cốt lõi gắn liền với sự phát triển, học hỏi, kết nối và thể hiện bản thân. Dù bạn có bận rộn đến đâu, uống nhiều rượu đến mức nào, kiếm nhiều tiền ra sao hay túng thiếu thế nào, bạn vẫn không bao giờ chạy trốn được những việc vốn được sinh ra dành riêng cho bạn làm trong kiếp sống này. Chúng có một cách kỳ diệu để cứ mãi ám ảnh, thôi thúc bạn.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Và điều đó đặt ra cho bạn một lựa chọn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Lựa chọn xem tôi có tiếp tục ngồi yên trong khi tận đáy lòng biết rõ có một sự thay đổi mình muốn thực hiện - có một cách nào đó để bản thân, thế giới hay gia đình mình tốt đẹp hơn, có một việc mình muốn làm, có những con người mình muốn tìm - nhưng thay vì làm điều đó, tôi lại ngồi ôm lấy sự kháng cự đang từ từ bóp nghẹt mình mỗi khi nghĩ tới, rồi chủ động phủ nhận hoặc tự thuyết phục mình bỏ cuộc.<\/p>"}, {"t": "Nỗi sợ từ người xung quanh, Sức mạnh của từ Và &amp; Chấp nhận sự mệt mỏi", "k": "Chương 4", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Một điều tôi gặp rất nhiều qua thư khán giả gửi về là có người viết thế này: Tôi đã thay đổi cuộc sống của mình. Tôi giảm được cân, tập thể dục đều đặn, thấy người khỏe khoắn tuyệt vời, bắt đầu viết nhật ký mỗi ngày. Tôi cũng đang kinh doanh thêm dòng mỹ phẩm mới hoặc vừa lấy bằng môi giới bất động sản. Nhưng bạn đời của tôi lại ghét những gì tôi đang làm. Họ không hề ủng hộ chút nào. Ông có thể nói một chút về tiếng ồn và sự kháng cự đến từ những người xung quanh, và ta nên làm gì với nó khi áp lực bên ngoài trở thành lý do cản trở ta thay đổi không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Khi phân vân, hãy đi tìm nỗi sợ. Có ba thứ thúc đẩy hành động của con người: nỗi sợ hãi (fear), sự gắn kết nhóm (affiliation) và địa vị (status). Hãy đi theo thứ tự ngược lại nhé. Địa vị là việc ai được ăn trưa trước, ai ở trên ai ở dưới, bạn lái xe gì, bàn làm việc của bạn có ngồi gần sếp hơn không, bạn có phải đứa con cưng của mẹ không? Đó là địa vị. Sự gắn kết nhóm là việc ai ngồi bên trái bên phải tôi, tôi mặc đồ có đúng gu không, kiểu tóc có hợp thời không, cặp kính có ổn không, tôi có hòa nhập được không? Và nằm giữa hai thứ đó, làm nền tảng cho cả hai, chính là nỗi sợ hãi. Dĩ nhiên nó bắt nguồn từ nỗi sợ cái chết vì ai rồi cũng phải chết. Nhưng nó mở rộng ra hàng triệu thứ khác. Chúng ta đã biết cách gắn kết hầu hết mọi chuyện với nỗi sợ. Vì vậy, những người xung quanh yêu thương bạn cũng đang sợ hãi. Và chính bạn cũng đang sợ hãi. Nỗi sợ đó có thể là việc không nhận ra con người mới mà bạn sắp trở thành. Nỗi sợ đó có thể là việc suy diễn thảm họa về những gì sẽ xảy ra nếu thế giới thay đổi. Nhưng sự thật là thế này, Mel: thế giới hiện tại đang rất hỗn loạn, và trạng thái này chính là bình thường mới mãi mãi về sau rồi. Nếu bạn cứ chờ mọi thứ quay lại bình thường như xưa, bạn sẽ phải chờ rất lâu đấy. Vậy nên, khi sự thay đổi vẫn đang diễn ra bất chấp bạn có thích hay không, câu hỏi là: chúng ta nên nắm quyền chủ động để kiểm soát và tác động lên nó, hay ngồi yên chờ đợi? Những người bạn đang lắng nghe, những người bạn đang nương theo - xét trong hoàn cảnh của họ, họ đều có ý tốt cả. Họ yêu thương và lo lắng cho bạn. Nhưng hoàn cảnh quyết định mọi thứ. Hoàn cảnh bao gồm tất cả những gì ta được dạy, những gì ta được kỳ vọng, và những hệ thống ta đang thuộc về. Nếu mọi thứ đang ổn với bạn, đừng thay đổi gì cả. Nhưng nếu nó không ổn với bạn, ta lại quay về câu chuyện từ và với từ nhưng. Nếu nó không ổn, bạn phải quyết định xem nó đã đủ tệ để bạn sẵn sàng đối mặt với sự kháng cự và thử thách ngắn hạn nhằm thay đổi nó chưa. Bạn không được đảm bảo mọi thứ sẽ thành công như ý muốn, nhưng bạn chắc chắn có thể tác động vào nó.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Vậy trong trường hợp người vừa thay đổi lối sống - họ khỏe mạnh hơn, có thể bớt uống rượu, dậy sớm hơn, trong khi bạn đời vẫn ngủ nướng và cảm giác hai người hơi xa cách nhau. Nếu dùng từ nhưng, bạn có thể nói: Tôi đang khỏe lên, tôi thấy rất tuyệt, tôi đang thay đổi tích cực nhưng bạn đời của tôi không thích điều đó. Còn nếu đổi thành: Tôi đang khỏe lên, tôi đang thay đổi tích cực, tôi thấy tốt hơn nhiều và bạn đời của tôi không thích điều đó.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Và nếu là câu thứ hai...<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> ...thì lúc này bạn nợ mối quan hệ của mình một nỗ lực. Bởi người bạn đời của bạn không thể tự mình giải quyết vấn đề này được - nếu làm được thì họ đã làm từ lâu rồi. Bạn có thể chọn tuyên bố đó là một hoàn cảnh bất khả kháng rồi sống chung với lũ. Hoặc bạn có thể tự hỏi: thế nào là thực sự thấu hiểu bạn đời của mình, nhìn thấy nỗi sợ của họ, hiểu được cảm giác có thể họ đang thấy bị từ chối hay bị xem nhẹ khi tôi làm được điều mà thầm kín họ cũng muốn làm nhưng chưa làm được? Làm sao để tôi dồn tâm sức giúp họ cảm nhận được nền tảng vững chắc của mối quan hệ này khi ở trạng thái tốt đẹp nhất? Có rất nhiều cách để làm điều đó, dù chẳng có cách nào đảm bảo 100%. Nhưng nếu bạn không nỗ lực vun đắp, mọi chuyện có lẽ sẽ không đi đến đâu cả.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi rất thích sự giản dị của cặp từ nhưng và từ và. Bởi khi bạn nói từ nhưng, đột nhiên điều đó có nghĩa người bạn đời là lý do buộc bạn phải dừng lại, hoặc họ là nguyên nhân lớn nhất khiến mọi thứ trở nên khó khăn. Còn khi bạn nói từ và, về cơ bản bạn tách bạch bản thân với họ, và chừa không gian để cả hai sự thật cùng tồn tại.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Và nhờ vậy, họ không trở thành cái cớ của bạn nữa. Họ chỉ trở thành một phần của vấn đề hoặc một dữ kiện thực tế trong hoàn cảnh bạn đang xử lý. Và giờ bạn có thể quyết định mình sẽ làm gì để mọi thứ tốt đẹp hơn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chính xác. Đúng là như vậy.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Quá dễ hiểu luôn.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nếu nghĩ về cuộc chạy marathon - chúng ta đang ở Boston mà - có những người chạy giải Boston Marathon tới dặm thứ 24 rồi dừng lại, và có những người chạy hết chặng đường. Điểm khác biệt duy nhất giữa người về đích và người suýt về đích là người về đích biết cách sắp xếp chỗ cho sự mệt mỏi của mình. Cả hai đều mệt như nhau, đúng không? Nhưng nếu bạn bỏ cuộc ở dặm 24, bạn không chịu nổi tất cả sự mệt mỏi đó, bạn đành dừng lại. Còn những người chạy tới dặm 26, họ cũng mệt rã rời, chỉ là họ tìm ra cách mang vác sự mệt mỏi đó đi tiếp. Nếu bạn tìm đến huấn luyện viên chạy bộ và bảo tôi muốn chạy marathon, bạn không được phép nói thêm: và tôi muốn về đích mà không bị mệt. Không có chuyện đó đâu. Bạn phải nói: Tôi sẽ chạy marathon và tôi sẽ rất mệt, và tôi cần phải làm được cả hai điều đó. Vì vậy, việc tiến về phía trước, thay đổi diện mạo hay cuộc sống của bạn luôn đi kèm một dạng mệt mỏi riêng. Bạn sẽ đặt sự mệt mỏi đó ở đâu? Bạn sẽ rèn luyện thế nào để trở nên thuần thục trong việc xử lý những hệ quả đi kèm?<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ông vừa nói một câu giải phóng tâm trí thật sự. Dù tôi đã đọc sạch sẽ mọi cuốn sách của ông, tôi không chắc có câu nào từng chạm mạnh tới tôi như câu vừa rồi: Tôi cần phải làm được cả hai điều đó. Thường có một ngộ nhận gần như ảo tưởng rằng hễ việc gì quan trọng với mình thì làm nó sẽ dễ dàng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Trong khi nếu ta bắt đầu với tâm thế rằng: việc này rất quan trọng, và tôi sẽ thấy mệt mỏi, và nó sẽ rất khó khăn, và sẽ có rất nhiều sự kháng cự, nên tôi cần phải làm được cả hai - vừa làm việc quan trọng, vừa biết rằng sự mệt mỏi là một phần trọn gói đi kèm. Với một người đang ôm ấp một ý tưởng hay cảm thấy thôi thúc thay đổi tích cực, nhưng cứ ngồi đó chờ đúng thời điểm, chờ tới khi cảm thấy sẵn sàng, cứ chờ mãi, chờ mãi... ông sẽ nói gì với họ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chà, chúc mừng nhé. Bạn đã có đúng thứ bạn muốn rồi đấy.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ý ông là sao?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chẳng ai ép bạn không được chờ cả. Chính bạn đang chọn cách chờ đợi. Thật là một chỗ trú ẩn an toàn và êm ái. Để có thể nói rằng: Tôi đã gửi bản thảo tiểu thuyết cho 20 nhà xuất bản lớn và họ đều từ chối. Ồ, thế là bạn hết trách nhiệm rồi. Còn gì an toàn hơn thế? Tôi có một bài diễn thuyết tuyệt vời muốn chia sẻ, nhưng ban tổ chức TED không cho tôi lên sân khấu chính. Họ cứ không chịu. Hễ họ gọi là tôi sẵn sàng lên nói ngay. Chúc mừng nhé. Bạn đã xây cho mình một nơi hoàn hảo để trốn tránh. Và tất cả chúng ta đều làm vậy. Dù ở đâu, làm nghề gì, ta đều tìm một nơi hoàn hảo để ẩn náu. Nếu cách đó giúp bạn thấy ổn, cứ tiếp tục. Còn nếu nó không ổn với bạn, ta lại quay về chữ và: Tôi có một bài diễn thuyết muốn chia sẻ, và tôi đã tự quay nó hôm qua, ngày mai nó sẽ lên sóng YouTube.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ôi, nghe câu đó xong lại kiểu: Ơ nhưng tôi không muốn làm cách đó đâu.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Thế thì làm dưới một cái tên khác đi\\! Nhiều năm nay tôi vẫn khuyên mọi người: bạn nên mở một trang blog, nếu muốn dùng bút danh ẩn danh cũng chẳng sao. Nhưng sau 100 ngày, bạn sẽ tự muốn gắn tên thật của mình lên đó.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tại sao sau 100 ngày tôi lại muốn gắn tên mình vào ạ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Vì bạn sẽ cảm thấy vô cùng hạnh phúc với những gì mình đang làm. Bạn sẽ rất tự hào vì tác phẩm đó tồn tại, vì chính bạn đã làm ra nó, đến mức bạn muốn nhận công trạng về mình. Đó đơn giản là hành động nói lên: Này, tôi đã làm ra thứ này đây. Tôi đưa nó ra thế giới cho những ai có thể nhận được lợi ích từ nó. Và cảm giác hào phóng đó - bởi hãy nhớ việc chia sẻ ý tưởng không làm ta tốn kém gì cả, mà nó lại có đòn bẩy cực lớn, có thể nhân rộng tới rất nhiều người. Điều này hoàn toàn khác với việc lên Instagram và chèo kéo mọi người quen bấm thích cho bạn. Các nền tảng đó thiết kế thuật toán để khiến bạn cảm thấy tồi tệ cho đến khi bạn làm nhiều hơn những gì họ muốn. Đó là cách họ kiếm tiền. Khi ta liên tục tạo nội dung miễn phí cho họ và bảo bạn bè vào xem, ta đang làm thuê không công cho họ. Đó là một cái bẫy, vì bạn có thể tự nhủ: Mình đã làm đủ mọi thứ rồi, đội mũ rộng vành rồi, chỉnh ánh sáng đẹp rồi, làm y như những người nổi tiếng khác rồi, mình sắp thành người có sức ảnh hưởng rồi, chỉ là chưa có đủ 300.000 người theo dõi thôi. Và thế là bạn lại tìm thấy một chỗ an toàn mới để mắc kẹt. Kết cục là bạn tự đốt cháy các mối quan hệ của mình vì ích kỷ nhờ vả người quen tương tác hộ trên mạng, và bạn cố chiều lòng một đám đông xa lạ mà bạn chẳng quen biết cũng chẳng thực sự quan tâm. Một lần nữa, bạn lại bị mắc kẹt.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ý ông là nếu bạn cứ ngồi nghĩ ngợi chờ đúng thời điểm hay ám ảnh về cách làm cho thật chuẩn, rất có thể là vì bạn đang cố kiểm soát việc muốn mọi người phải thích nó.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Ừm.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Thay vì tự chọn lấy mình và nói: Khoan đã, tôi muốn đưa thứ này ra ngoài kia - dù là công việc môi giới nhà đất, tác phẩm nghệ thuật hay đơn giản là bắt đầu viết lách. Tôi muốn làm vì ngồi yên nhìn người khác hành động và biết mình đang âm thầm bỏ cuộc với chính bản thân khiến tôi đau khổ lắm rồi.<\/p>"}, {"t": "Thiết kế có chủ đích, Khán giả nhỏ nhất &amp; Sự bám chấp", "k": "Chương 5", "body": "<p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Có một khái niệm tôi gọi là thiết kế có chủ đích (intentional design), gồm hai câu hỏi đơn giản: Nó dành cho ai? và Nó dùng để làm gì? Vậy thứ bạn đang đăng lên mạng xã hội kia chính xác là dành cho ai? Nếu có thể, hãy gọi tên cụ thể họ ra cho tôi. Nếu ai đó không nằm trong nhóm người đó, bạn chẳng cần họ xem. Bạn cũng chẳng bận tâm nếu họ không thích. Nó dùng để làm gì? Tại sao bạn bỏ công sức làm việc này? Bạn nhận được gì từ nó? Họ nhận được gì từ nó? Nếu bạn không trả lời được hai câu hỏi đó - dành cho ai và để làm gì - thì bạn đang loay hoay lạc lối. Bạn đang trốn tránh.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Với một người chưa bao giờ thực sự bắt đầu, làm sao để tự chọn lấy mình đây ạ? Bạn đang ngồi ở nhà, nghe tập podcast này, thấy bứt rứt vì đã nghĩ mãi về việc quay lại trường học ngành điều dưỡng từ lâu lắm rồi, và bạn nghĩ ra cả tỷ lý do tại sao không thể: tiền bạc, gia đình, thời điểm, tuổi tác... Trong hoàn cảnh đó, làm sao để tự chọn lấy mình? Ông từng ở trong hoàn cảnh như vậy rồi đúng không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chắc chắn rồi, đó là một thói quen ăn sâu lắm. Có hai ý tưởng liên quan đến nhau: nhóm khán giả khả thi nhỏ nhất (smallest viable audience) và tác phẩm nghệ thuật khả thi nhỏ nhất (smallest viable piece of art). Nhóm khán giả khả thi nhỏ nhất là nhóm người nhỏ nhất mà nếu bạn tạo được tác động lên họ thì thế là đủ. Nếu trong một gia đình, chỉ cần một đứa trẻ thôi là đủ. Tôi không quan tâm hàng xóm nghĩ gì, việc này là dành cho đứa trẻ đó. Còn tác phẩm khả thi nhỏ nhất là sự thay đổi nhỏ nhất bạn có thể tạo ra mà vẫn thấy xứng đáng. Vậy nếu bạn bị tê liệt suốt 20 năm vì chuyện quay lại trường y tá, tại sao bạn không đến viện dưỡng lão hay bệnh viện địa phương xin làm tình nguyện một buổi chiều mỗi tuần? Họ sẽ không từ chối bạn đâu. Chuyện gì sẽ xảy ra nếu chỉ 2 tiếng mỗi tuần bạn có thể thay đổi cuộc sống của một ai đó? Bạn có muốn làm điều đó nhiều hơn không? Có vô vàn cách để làm nhiều hơn, nhưng ít nhất bạn không ngồi ở nhà ước ao nữa. Bạn đang thực sự dành 2 tiếng mỗi tuần để thay đổi cuộc đời một con người. Đơn vị nhỏ nhất của nghệ thuật là rất nhỏ. Tôi thường nói với những người hay kêu: Sếp tôi không cho phép tôi làm - một câu cửa miệng rất phổ biến, kiểu tôi muốn tạo ra khác biệt ở công ty nhưng sếp không cho. Thực chất điều họ đang muốn nói là: Tôi muốn cải tổ toàn bộ công ty từ trên xuống dưới, và sếp không giao quyền đó cho tôi. Thì tất nhiên sếp không cho rồi\\! Nhưng bạn biết bạn làm được gì không? Bạn có thể lập một nhóm đọc sách vào giờ ăn trưa thứ Sáu, mời đúng 5 người và bảo: tuần tới tụi mình cùng đọc cuốn sách của Mel rồi thứ Sáu ăn trưa thảo luận nhé. Nếu hiệu quả, bạn làm tiếp. Không hiệu quả thì dừng lại.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Đó là những ví dụ tuyệt vời về việc tự chọn mình với nhóm khán giả nhỏ nhất. Liệu nhóm khán giả đó có thể chỉ là chính mình thôi không? Ý tôi là, có cần thiết phải phá vỡ lối mòn bằng cách nghĩ xem làm sao thu nhỏ việc lớn thành một việc bé xíu nhưng vẫn tác động lên một người khác không? Chẳng hạn tôi sợ viết bài chia sẻ suy nghĩ lên Substack, nhưng tôi có thể viết một email gửi cho chị gái mình. Ông đang nghĩ theo hướng đó phải không?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đúng, hãy bắt đầu từ sở thích (hobbies). Tôi rất thích sở thích cá nhân, tôi có cả đống sở thích. Sở thích là dành cho bạn. Đừng từ bỏ sở thích chỉ vì ông hàng xóm chê chiếc mái chèo bạn vừa đẽo. Nó không dành cho ông ta. Nó dành cho bạn. Vì vậy, nếu bạn làm gì đó chỉ cho riêng mình, cứ làm đi, gọi nó là sở thích, đừng thêm bất kỳ chữ nhưng hay chữ và nào vào cả. Nó là của bạn. Còn đơn vị nhỏ nhất tiếp theo sau bạn chính là chị gái bạn - một con người cụ thể. Và ta cần nói một chút về sự bám chấp (attachment). Bám chấp là một thuật ngữ nhà Phật nhưng rất dễ hiểu. Bám chấp nghĩa là bạn cố kiểm soát kết quả. Bạn bám chấp vào việc thời tiết hôm đám cưới con gái sẽ ra sao. Bạn bám chấp vào việc mọi người có thích tập podcast bạn làm hay không. Bạn cố kiểm soát thứ nằm ngoài tầm tay mình. Vấn đề của sự bám chấp là thế này: giả sử tôi và bạn muốn bơi qua một hồ nước nhỏ và ta muốn an toàn. Cách an toàn là hai người bơi cách nhau khoảng 2,5 mét; nếu một người gặp sự cố, người kia có thể cứu. Cách ngu ngốc nhất là tôi lấy dây thừng buộc chặt tay phải mình vào tay phải bạn, buộc cả tay lẫn chân vào nhau - lúc đó cả hai chắc chắn sẽ chết đuối vì không thể bơi nổi. Vì vậy, khi ta làm công việc này và mang ra thế giới: Này, tôi làm cái này đây - đừng gắn thêm vế sau là: và tôi bắt bạn phải thích nó. Nó chỉ đơn giản là: Này, đây là món quà. Đó mới là bản chất của món quà - không phải kiểu tặng xong rồi bạn nợ tôi một lời cảm ơn, nợ tôi một nụ cười thật tươi, phải ăn sạch đĩa và phải biết ơn tôi. Làm thế là bạn đang bám chấp và cố kiểm soát rồi. Đó không còn là món quà nữa, mà là đang lôi kéo người khác vào kịch bản của bạn. Và đó là công thức dẫn đến thất vọng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Điều chúng ta cứ liên tục quay trở lại là chính bạn - tự chọn lấy bạn, tự thuê lấy bạn. Và tôi biết ẩn sâu bên dưới là việc suy cho cùng bạn đi học ngành điều dưỡng không phải vì ai khác, bạn đi học vì chính bạn.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Và một phần rất lớn lý do bạn thích làm điều đó là bởi cách bạn giúp cuộc sống người khác tốt đẹp hơn. Đây không phải kiểu chủ nghĩa ích kỷ luôn chỉ làm cho riêng mình. Với hầu hết người bình thường, niềm vui cho bản thân chính là phản ứng của người hiểu được câu chuyện của bạn. Một diễn viên kịch Broadway phải diễn rất lâu mới thấy chán tiếng vỗ tay cuối buổi diễn. Tiếng vỗ tay không phải để báo cho bạn biết bạn diễn tốt - chính bạn biết mình diễn tốt rồi - tiếng vỗ tay là dấu hiệu có ai đó đã tương tác, đã kết nối, có điều gì đó thực sự chạm tới bên trong họ.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ôi, tôi vừa ngộ ra một điều. Một trong những lý do khiến bạn cảm thấy dằn vặt khi ngồi ôm ấp điều mình muốn làm, sự thay đổi mình muốn tạo ra, là bởi sâu thẳm trong tâm trí, cơ thể và linh hồn, bạn biết rằng ở phía bên kia của việc vượt qua sự kháng cự và thể hiện trọn vẹn sức sống của mình - dù là qua khu vườn cộng đồng bạn mở, việc quay lại trường học, thay đổi cách chăm sóc bản thân, hay bước lại vào thế giới hẹn hò sau ly hôn - ta đều biết rằng có một sự kết nối sâu sắc đang thiếu vắng trong cuộc đời hiện tại, thứ chỉ có thể cảm nhận được khi bạn bắt tay làm điều quan trọng ấy.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Và điều đó cũng đi đôi với một từ khác đang giữ chân chúng ta lại: sự từ chối (rejection). Rằng nếu tôi bước ra ngoài kia, có thể tôi sẽ bị từ chối. Có thể người ta sẽ phát hiện ra tôi là kẻ mạo danh. Có thể chuyện gì đó tồi tệ sẽ xảy ra. Vậy nên ngồi đây than vãn có vẻ dễ hơn là thực hiện hành động hào phóng đó. Tôi muốn kể về mẹ tôi. Ngày nào tôi cũng nhớ bà. Bà mất quá sớm. Mẹ tôi từng làm tình nguyện viên rồi thành nhân viên tại bảo tàng nghệ thuật quan trọng nhất ở Buffalo tên là Albright-Knox - một trong những bảo tàng nghệ thuật lớn của Mỹ. Khi bà mới vào làm, khái niệm cửa hàng lưu niệm trong bảo tàng hầu như chưa tồn tại. Hầu hết bảo tàng không có cửa hàng, cùng lắm chỉ bán vài tấm bưu thiếp. Bà tiếp quản nó và cùng người cộng sự Lita phát triển quy mô lớn gấp 10 lần. Bà đồng sáng lập hiệp hội cửa hàng bảo tàng và các bảo tàng khắp cả nước đều học hỏi mô hình đó. Có một việc bà làm là bà rất bận tâm vì ở Buffalo nhiều người chưa bao giờ đặt chân vào bảo tàng, bởi họ nghĩ đó là nơi dành cho tầng lớp thượng lưu, không hợp với xuất thân của họ. Thế là mẹ tôi nảy ra một ý tưởng - từ trước khi chương trình Antiques Roadshow lên sóng tivi rất lâu. Bà mời hai chuyên gia thẩm định từ nhà đấu giá Sotheby's tới bảo tàng vào khoảng năm 1973. Nếu nhà bạn có đồ cổ trên gác xép, bạn có thể mang tới để các chuyên gia từ Sotheby's xem giúp xem chúng có đáng giá không. Thứ Sáu hôm đó bà đi làm về, ngày mai là diễn ra sự kiện rồi. Bà chỉ làm truyền thông chút ít thôi. Hôm đó trông bà lộ rõ vẻ bất an - điều rất hiếm thấy ở mẹ tôi. Bà bảo: Seth à, mẹ hơi lo lắng vì ngày mai làm sự kiện này rồi mà nhỡ chẳng có ai tới thì sao? Rồi bà quay sang tôi và nói: Chà, nếu không có ai tới, thì cũng chẳng ai biết là không có ai tới cả. (cười) Ngày hôm sau, có tới 5.000 người xếp hàng chờ bên ngoài.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tuyệt vời quá.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Bài học rút ra với tôi là nếu bà chỉ làm đúng những gì ghi trên giấy mô tả công việc, cửa hàng đó mãi mãi chỉ là một bốt điện thoại nhỏ bán bưu thiếp. Tất cả những vòng tròn giá trị hào phóng từ công việc của bà nảy nở được là nhờ bà dám tổ chức một sự kiện mà có thể chẳng ai tới - bởi bà nhận ra: nếu không ai tới thì cũng chẳng ai biết.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Cứ như thể những thôi thúc nhỏ bé, những ý tưởng trong bạn mà bạn cứ chần chừ trước sự kháng cự và các lý do an toàn - tôi rất yêu hoa vì luôn kinh ngạc khi thấy từ một hạt giống bé xíu lại có thể nở ra một bông hoa rực rỡ, tinh xảo đến thế theo thời gian. Đó là cách tôi hình dung về những hạt mầm ý tưởng bên trong chúng ta: bạn không thể biết khi nào nó nở hay nó sẽ nở thành cái gì. Nhưng ta lại không cho phép nó được gieo trồng. Ta giấu kín nó sâu trong bóng tối. Chẳng có hạt giống nào nở hoa nổi khi nằm trong túi kín ở một nhà kho lạnh lẽo cả. Chúng cần được gieo xuống đất và đón ánh nắng ngoài kia. Một điều ông hay kêu gọi mọi người là hãy trở nên đáng chú ý (remarkable). Điều đó có nghĩa là gì ạ?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Nếu bạn muốn tạo ra tác động, muốn phát triển, muốn mọi người tìm đến mình, đừng hò hét kêu gọi họ. Hãy tạo ra thứ gì đó đáng để người ta bàn tán (worth making a remark about). Trở nên đáng chú ý nghĩa là người khác sẽ nhận được lợi ích khi kể về bạn. Họ không kể về bạn vì bạn, họ kể vì chính bản thân họ. Vậy nên đáng chú ý không phải là làm trò lố, cày cuốc ầm ĩ hay đội một chiếc mũ kỳ lân màu tím. Nó nghĩa là làm ra điều gì đó khiến người khác thấy có ích khi nhắc tên bạn.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Và với tôi, điều đó nằm rất nhiều ở cách bạn thực hiện nó - nét riêng cá nhân bạn thổi vào, sự tận tâm trong cách bạn hành xử giữa thế giới này. Mọi người cứ đi tìm thứ gì đó thật phô trương để trở nên đáng chú ý, trong khi phần lớn lại nằm ở phong thái làm việc của bạn. Tôi từng có trải nghiệm này với cố CEO Arne Sorenson - người đầu tiên ngoài gia tộc nắm quyền điều hành tập đoàn Marriott. Tôi phỏng vấn ông ấy tại một sự kiện khổng lồ trước khoảng 5.000 khán giả, đúng thời điểm Starwood sáp nhập với Marriott nên ai nấy đều phát cuồng về chuyện điểm thưởng. Chúng tôi có một cuộc phỏng vấn tuyệt vời; ông ấy nói về thương hiệu, rằng cốt lõi của thương hiệu là cảm giác được chào đón như trở về nhà khi bước qua cánh cửa, và đó là trách nhiệm của tất cả mọi người. Khi cuộc trò chuyện kết thúc trong tràng pháo tay, chúng tôi đứng dậy rời sân khấu. Không hề phô trương, chẳng màu mè, ông ấy lặng lẽ quay lại, tự tay nhặt cả hai chiếc cốc cà phê và hai tờ giấy ăn của chúng tôi, rồi vị CEO của Marriott tự tay mang chúng rời khỏi sân khấu. Với tôi, đó chính là ví dụ sống động cho điều ông nói, bởi tôi đã kể mãi về ấn tượng sâu sắc ấy - về sự chính trực và con người thật của một nhà lãnh đạo - điều mà chẳng lời hoa mỹ nào tả xiết.<\/p>"}, {"t": "Bạn không hề tụt lại phía sau &amp; Thoát khỏi vòng lặp địa vị", "k": "Chương 6", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi từng đọc ông hay viết câu: Bạn không hề tụt lại phía sau, bạn đang trong quá trình trở thành (You are not behind, you are becoming). Tại sao đây lại là một tư duy quan trọng?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Cách hiệu quả nhất để bắt trẻ con nghe lời là thưởng điểm và dọa trừ điểm. Ở Mỹ hiện nay có cả một ngành kinh doanh lớn xoay quanh việc tặng điểm cho trẻ ngoan trong lớp để chúng đổi lấy kẹo bánh ngọt. Điểm số là công cụ thao túng tuyệt vời. Khi nhìn vào thể thao học đường, người ta hành xử cứ như thể thế giới đang khan hiếm cúp vô địch vậy. Chẳng thiếu cúp đâu. Mục đích của bóng đá cấp ba không phải là thắng trận đấu, vì chẳng ai quan tâm đội nào thắng trận đó. Mục đích phải là làm sao để rèn luyện các em trở thành con người mà các em muốn trở thành. Nhưng giữ bảng điểm trận đấu làm thước đo cho bước tiếp theo bao giờ cũng dễ hơn. Thế nên ta bị bủa vây bởi trò chơi địa vị (status game), và nó gây ra biết bao mâu thuẫn vợ chồng chỉ vì nhà mình không kiếm nhiều tiền bằng nhà hàng xóm, vì họ được đi du lịch sang chảnh hơn mình. Chuyện đó chỉ lọt vào tầm ngắm của bạn vì ta đang sống ở thời đại có thể bay tới Paris. 300 năm trước chẳng ai đi nghỉ mát ở Paris cả. Vậy là ta cứ tự nâng mức trò chơi lên mãi - một cái vòng xoáy không hồi kết với củ cà rốt treo trước cây gậy thúc ta chạy nhanh hơn. Đó là một cái bẫy. Lối đi khác là hãy tự hỏi: Tôi muốn trở thành người như thế nào? Không phải so sánh với ai. Quay lại với: Dành cho ai? Để làm gì? Công việc tôi đang làm này có phải để kiếm nhiều tiền hơn hàng xóm không? Để làm gì? Tôi được gì khi giàu hơn hàng xóm? Tôi không nghĩ đó là nguồn nhiên liệu hữu ích. Khi chọn nguồn nhiên liệu cho mình, ta chọn chính cuộc đời mình đang sống. Chọn nguồn nhiên liệu mang tên tôi giỏi hơn bạn, lao vào vòng lặp địa vị - trò chơi đó chẳng bao giờ có điểm dừng.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Và nếu bạn đang nghe và nhận ra: Trời ơi, chính là mình rồi - kiểu mình bị ám ảnh bởi căn bếp nhà hàng xóm, tự nhiên thấy ghét căn bếp nhà mình dù tuần trước vẫn thấy ổn, chỉ vì sang nhà họ chơi thấy căn bếp mơ ước của họ rồi cuốn vào vòng xoáy đó. Một khi đã nhận ra:Ừ, Seth nói trúng tim đen rồi, mình đang mắc kẹt trong vòng lặp địa vị, mình đang dùng sai nhiên liệu - vậy tôi nên nạp cho mình thứ gì đây?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đầu tiên hãy gọi tên nó ra. Tôi đi vào tiệm trang sức, tiệm túi xách, tiệm đồ thể thao là vì tôi đang cần mua thêm địa vị. Tôi cần mua thêm áo giáp. Tôi trả 400 đô la cho đôi giày thể thao trong khi có thể mua đôi 50 đô la vì cái mác địa vị đó giúp tôi thấy yên tâm. Cứ gọi tên nó ra liên tục: Tôi làm thế này vì tôi đang sợ. Tôi làm thế này vì hồi cấp ba tôi từng thấy bị cho ra rìa, nên giờ có cơ hội tiêu tiền để không còn cảm giác bị bỏ rơi nữa. Khi nói to những điều đó thành lời, bạn sẽ nhận ra chúng nghe nực cười đến mức nào. Vậy bước một là gọi tên nó. Bước hai là: tôi sẽ đặt ánh mắt mình vào đâu? Tôi sẽ tập trung vào điều gì? Khi cả gia đình ngồi ăn tối và kể về một ngày của mình, chúng ta hay khoe điều gì, phàn nàn điều gì, và biết ơn điều gì? Giả sử con bạn mới 6 tuổi mang về bảng điểm đầu tiên với hai điểm A và một điểm C. Chúng ta phản ứng sao? Tại sao ta phải bận tâm chuyện đứa trẻ 6 tuổi bị một điểm C? Ta bận tâm vì biết 11 năm nữa con sẽ nộp đơn vào các trường đại học danh tiếng - đừng dùng từ trường đại học tốt, chúng chỉ là những trường nổi tiếng thôi. Và ta cần tạo ra quy chuẩn trong nhà rằng điểm cao là quan trọng vì sau này tôi sẽ dán nhãn logo trường đại học của con lên đuôi xe ô tô để chứng tỏ mình là ông bố bà mẹ tuyệt vời. Bạn không nói toẹt ra điều đó, nhưng chính xác là điều đó đang diễn ra.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Chắc chắn rồi, ông nói tới đâu tôi gật đầu lia lịa tới đó. Suốt một thời gian rất dài, tôi chạy bằng nhiên liệu địa vị. Tôi khốn khổ vì chạy theo mọi thứ tôi nghĩ dân sành điệu đều có mà thực tế tôi chẳng đủ tiền mua. Vòng lặp bất tận của việc cố chứng minh mình đủ giỏi, mình hòa nhập được, mình theo kịp bạn bè thật sự kiệt sức. Tôi nhớ khoảnh khắc mình bắt đầu làm điều ông vừa nói - gọi tên nó ra - nghe có vẻ ngớ ngẩn nhưng tôi thực sự quay sang con mình và bảo: Nhà mình không làm việc đó vì nhà mình không đủ tiền. Nhà mình không đi kỳ nghỉ đó vì không có ngần ấy tiền. Chỉ cần gọi thẳng tên sự thật ra như thế đã giải tỏa biết bao áp lực, bởi tôi không còn tự đấu tranh nội tâm nữa mà chấp nhận thực tế. Lúc đó tôi mới có quyền chọn xem đây có phải vấn đề mình muốn giải quyết vì một lý do khác hay không - không phải vì áp lực phải bằng bạn bằng bè, mà vì: Ồ, sẽ thật tuyệt nếu ba năm tới mình chăm chỉ làm thêm việc tay trái để tiết kiệm đủ tiền cho cả nhà đi chơi một tuần. Làm vậy thấy vui hơn hẳn, vì mình làm cho một mục đích thực sự của mình chứ không phải chạy theo thước đo bị người khác thổi phồng.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Phải, gọi tên nó ra là chìa khóa. Và ta lại quay về với chữ nhưng và chữ và: ta có thể làm việc đó, hoặc ta có thể tận hưởng tất cả những điều bình dị này trong cuộc sống. Cái nào khiến ta hạnh phúc hơn? Có những cuộc trò chuyện thành thật với gia đình về việc nhà mình chi trả được gì và không chi trả được gì là một sự hào phóng. Nó không còn là điều ích kỷ hay đáng xấu hổ nữa, mà là điều đáng tự hào vì bạn đang xuất hiện đúng lúc gia đình cần sự chân thành.<\/p>"}, {"t": "Vừa đủ chuẩn là xuất bản (Merely Ship It), Sự nhất quán &amp; Tạo nên làn sóng mới", "k": "Chương 7", "body": "<p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Tôi rất muốn bàn về sự hoàn hảo, bởi đây là một bước ngoặt lớn với tôi từ triết lý của ông: cứ xuất bản đi (just ship it), ngừng cố làm cho nó hoàn hảo rồi mới tung ra. Tôi nghĩ ông sẽ tự hào khi biết rằng với tư cách học trò của ông, cuốn sách The Let Them Theory của tôi khi đem in có tới khoảng 117 lỗi nhỏ. Độc giả đã soi ra và chỉ từng lỗi một. Và tôi tự hào vì có nhiều thứ trong đó không hoàn hảo.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Có rất nhiều điều cần bóc tách ở đây vì câu chữ rất quan trọng. Đúng là sách có lỗi đánh máy. Nhưng ý tưởng cốt lõi và giá trị mang lại của cuốn sách không hề là một sai lầm. Hãy bắt đầu từ đó. Giờ hãy nói về chất lượng (quality), vì chất lượng là một từ mang nhiều nghĩa lắm. Chất lượng có ba tầng nghĩa khác nhau, và chỉ một trong số đó liên quan đến sự hoàn hảo. Thứ nhất là chất lượng đạt chuẩn kỹ thuật (meeting spec). Nghĩa là một chiếc xe Toyota Camry đời 1984 hoạt động đúng như thiết kế mọi lúc, mọi bộ phận khớp nhau chính xác. Chất lượng chỉ đơn giản là xây dựng một hệ thống đáp ứng đúng tiêu chuẩn đề ra. Năm 1969 ở Detroit, khi lắp ráp ô tô đến công đoạn cuối, công nhân phải cầm búa cao su vì cách duy nhất để các mảnh ghép khớp vào nhau là gõ mạnh. Còn ở Nhật Bản, mọi thứ khớp nhau chính xác như một chiếc đồng hồ. Nếu bạn xác định đúng tiêu chuẩn, mọi thứ vận hành trơn tru hơn. Nhưng điều đó không có nghĩa bạn phải làm vượt quá mức tiêu chuẩn cần thiết - làm thế là lãng phí. Chỉ cần đạt chuẩn. Tầng nghĩa thứ hai là sự xa xỉ (luxury). Ta hay dùng nhầm từ chất lượng khi thực chất ta muốn nói tới sự sang trọng, xa xỉ - kiểu xe Rolls-Royce chất lượng hơn xe Camry. Không, nó chỉ xa xỉ hơn thôi. Và tầng nghĩa thứ ba là thứ ta dùng làm cái cớ cho chủ nghĩa hoàn hảo: tìm mãi không thấy một tì vết nào dù soi kỹ đến đâu. Theo thước đo đó, chẳng có gì trên đời là hoàn hảo cả. Mục đích của chủ nghĩa hoàn hảo không phải để làm sản phẩm tốt hơn, mà là để ngăn bạn tung nó ra thị trường. Bạn cứ săm soi từng lỗi nhỏ chỉ để tự bảo vệ mình, chứ không phải vì câu hỏi nó dành cho ai và để làm gì. Vì thế, tôi chưa bao giờ nói hãy cứ xuất bản bừa đi (just ship it). Tôi nói đạt chuẩn là xuất bản ngay (merely ship it). Hai câu này khác nhau. Xuất bản bừa nghĩa là đồ dởm, đồ rác rưởi sao cũng được, tôi mặc kệ. Còn đạt chuẩn là xuất bản nghĩa là: sản phẩm này đã đáp ứng đúng tiêu chuẩn rồi. Này, tôi làm ra thứ này đây - không bám chấp, không tranh cãi. Trong giới xuất bản sách ở New York, tiêu chuẩn là không có lỗi chính tả lộ liễu, vì đó là tiêu chuẩn đạt được trong tầm tay. Nhưng chưa từng có cuốn sách hoàn hảo nào từng được xuất bản cả, vì cuốn nào cũng có thể sửa cho hay hơn nữa. Ngay cả kiệt tác Đại gia Gatsby cũng có những từ mà nếu sửa đi một chút có lẽ sẽ hay hơn. Bạn có thể sửa mãi không bao giờ dứt. Đó chính là cái bẫy của chủ nghĩa hoàn hảo: sửa tới vô tận. Nên lời khuyên của tôi đơn giản lắm: Tiêu chuẩn của bạn là gì? Ngay giây phút tiêu chuẩn đó được đáp ứng, hãy cho nó lên đường. Xuất bản ngay. Rồi ta chuyển sang việc tiếp theo. Nếu bạn chưa ưng tiêu chuẩn cũ, hãy đặt ra một tiêu chuẩn tốt hơn cho lần sau.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Thú vị thật, vì khi bạn ám ảnh làm cho mọi thứ hoàn hảo, bạn tưởng mình đang đi mãi, nhưng thực tế bạn chẳng đi tới đâu cả. Và điều nghịch lý khi thực sự đón nhận tất cả những gì ông chia sẻ hôm nay là câu trả lời duy nhất chính là hành động, là bắt đầu, là ngừng suy nghĩ quá mức.<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Đó là cách chúng ta trở thành. Chúng ta trở thành những gì mình làm, chứ không phải làm những gì mình đã trở thành. Vậy nên nếu bạn muốn...<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Ông nói lại câu đó đi ạ\\!<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Chúng ta trở thành những gì mình làm. Nếu bạn muốn trở thành một người trung thực, hãy bắt đầu nói sự thật, và bạn sẽ trở thành người trung thực.<\/p><p class=\"dl\"><strong class=\"sp m\">Mel Robbins:<\/strong> Nghe đơn giản thế, nhưng sao làm lại khó quá vậy, Seth?<\/p><p class=\"dl\"><strong class=\"sp s\">Seth Godin:<\/strong> Khó là vì trong đầu ta chuỗi suy nghĩ diễn ra thế này: Tôi sẽ mắc sai lầm. Điều đó khiến tôi xấu hổ. Tôi sẽ bị cộng đồng ruồng bỏ. Tôi sẽ cô độc. Và rồi tôi sẽ chết. Toàn bộ chuỗi suy diễn đó diễn ra trong chưa đầy hai giây. Đó là lý do có những câu cửa miệng kiểu: Trời ơi tôi chết mất, son dính lên răng tôi rồi\\! Ta đã nhảy cóc từ chuyện dín
