<style>
:root{
  /* Minh Fam design system (xem site/minhfam.css). Tên biến rút gọn cho trang đọc. */
  --bg:#fbfaf5; --panel:#ffffff; --text:#1f2a22; --strong:#171c18; --muted:#505e4f;
  --line:#e1eae5; --brand:#32854d; --brand-strong:#317345; --on-brand:#ffffff; --chip:#ebf6ee; --note:#ebf6ee; --note-fg:#317345;
  --rule:#4a9b60; --hl:#f6e3a4; --bar:rgba(251,250,245,.92);
  --fh:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --fb:"Spectral",Georgia,"Times New Roman",serif;
  --fs:19px; --lh:1.63; --measure:680px; --ff:var(--fb);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --bg:#0f1a12; --panel:#18291c; --text:#cbd5cc; --strong:#eef3ee; --muted:#9aa89b;
  --line:#2a3d2e; --brand:#4fb06c; --brand-strong:#6cc487; --on-brand:#0f1a12; --chip:#1f3a26; --note:#1f3a26; --note-fg:#6cc487; --rule:#6cc487; --hl:#5b4a1a; --bar:rgba(15,26,18,.92); color-scheme:dark}}
:root[data-theme="sepia"]{
  --bg:#f4ecd8; --on-brand:#fbf5e4; --rule:#7a5c2e;  --panel:#fbf5e4; --text:#3b3226; --strong:#2a2218; --muted:#6b5d49;
  --line:#e0d4b8; --brand:#7a5c2e; --brand-strong:#6a4e24; --chip:#ece0c2; --note:#efe2bf; --note-fg:#7a5c2e; --hl:#e8d08a; --bar:rgba(244,236,216,.92)}
:root[data-theme="dark"]{
  --bg:#0f1a12; --panel:#18291c; --text:#cbd5cc; --strong:#eef3ee; --muted:#9aa89b;
  --line:#2a3d2e; --brand:#4fb06c; --brand-strong:#6cc487; --on-brand:#0f1a12; --chip:#1f3a26; --note:#1f3a26; --note-fg:#6cc487; --rule:#6cc487; --hl:#5b4a1a; --bar:rgba(15,26,18,.92); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

/* thanh tiến độ */
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--brand);z-index:50}

/* thanh công cụ: cố định ở trên cùng khi cuộn */
.bar{position:fixed;top:0;left:0;right:0;z-index:40;height:56px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;transition:transform .25s}
.bar.hide{transform:translateY(-100%)}
.bar .l,.bar .r{display:flex;align-items:center;gap:6px}
.bar .t{font:600 14px/20px var(--fh);color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--fh);color:var(--muted);text-decoration:none}
.ib:hover{border-color:var(--line);color:var(--strong)}

/* bài đọc */
main{padding:96px 20px 40px}
article{max-width:var(--measure);margin:0 auto;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);hyphens:manual}
.kicker{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong);margin:0 0 14px}
article h1{font:600 clamp(32px,6vw,44px)/1.14 var(--fb);letter-spacing:-.015em;color:var(--strong);margin:0 0 28px}
article h2{font:600 1.35em/1.25 var(--fb);letter-spacing:-.01em;color:var(--strong);margin:2.2em 0 .6em}
article p{margin:0 0 1.2em}
article p.first::first-letter{font:600 3.4em/.9 var(--fb);float:left;margin:.08em .12em 0 0;color:var(--brand-strong)}
article blockquote{margin:1.8em 0;padding:0 0 0 24px;border-left:3px solid var(--rule);font:italic 400 1.3em/1.4 var(--fb);color:var(--strong)}
article .note{margin:1.8em 0;padding:1.1em 1.3em;background:var(--note);border-radius:20px;font-size:.88em;line-height:1.6}
article .note b{display:block;font:600 .78em/1 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--note-fg);margin-bottom:.5em}
article ul{padding-left:1.2em;margin:0 0 1.2em}
article li{margin-bottom:.5em}
article figure{margin:2em 0;text-align:center}
article figure img{width:100%;height:auto;border-radius:20px;box-shadow:0 1px 2px rgba(23,48,29,.06)}
article figure.wide{margin-left:calc(50% - min(50vw - 20px, 24rem));margin-right:calc(50% - min(50vw - 20px, 24rem))}
article figcaption{margin-top:.7em;font:500 .7em/1.5 var(--fh);color:var(--muted)}
article hr{border:0;text-align:center;margin:2.2em 0;color:var(--muted)}
article hr::before{content:"· · ·";letter-spacing:.6em}

/* cuối chương */
.pager{max-width:var(--measure);margin:56px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-decoration:none;color:var(--text);font-family:var(--fh)}
.pager a:hover{border-color:var(--brand)}
.pager small{display:block;font:600 11px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager strong{display:block;font:600 17px/24px var(--fb);color:var(--strong)}
.pager .next{text-align:right;grid-column:2}
.pager .prev{grid-column:1}
.end{max-width:var(--measure);margin:24px auto 0;text-align:center;font:500 14px/20px var(--fh);color:var(--muted)}

.src{display:block;margin-top:20px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:600 14px/20px var(--fh);color:var(--brand-strong);text-decoration:none}
.src:hover{border-color:var(--brand)}
article a{color:var(--brand-strong);text-underline-offset:3px}
/* ngăn mục lục / cài đặt */
.scrim{position:fixed;inset:0;background:rgba(15,26,18,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px rgba(23,48,29,.18);transition:transform .25s;font-family:var(--fh)}
#toc{top:0;bottom:0;left:0;width:min(360px,88vw);transform:translateX(-102%);overflow:auto;padding:20px;border-radius:0 20px 20px 0}
#toc.on{transform:none}
#set{top:64px;right:12px;width:min(340px,calc(100vw - 24px));padding:20px;border-radius:20px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#set.on{transform:none;opacity:1;pointer-events:auto}
.sheet h3{margin:0 0 14px;font:600 23px/30px var(--fb);color:var(--strong)}
.toc-book{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#toc ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
#toc a{display:flex;gap:12px;align-items:baseline;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--text);font:500 15px/22px var(--fh)}
#toc a span{flex:none;width:22px;color:var(--muted);font-weight:600}
#toc a:hover{background:var(--chip)}
#toc a[aria-current="true"]{background:var(--chip);color:var(--brand-strong);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.row>label,.row>span{font:600 13px/18px var(--fh);color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font:600 13px var(--fh);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--brand-strong)}
.themes{display:flex;gap:8px}
.themes button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.themes button[aria-pressed="true"]{border-color:var(--brand)}

@media (max-width:640px){
  :root{--fs:19px}
  main{padding:88px 18px 32px}
  .pager{grid-template-columns:1fr}.pager .next,.pager .prev{grid-column:1}.pager .next{text-align:left}
  .bar .t{display:none}
}
@media print{.bar,#prog,.pager,.scrim,.sheet{display:none}main{padding:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

<script>
/* ===== NỘI DUNG SÁCH — sửa mảng này để đổi chương =====
   body là HTML đơn giản: <p>, <h2>, <blockquote>, <ul>, <hr>, <div class="note"><b>Nhãn</b>…</div>
   Đây là bản ghi chú đọc viết bằng lời mới, không phải nguyên văn sách. */
var BOOK={title:"Tự chọn lấy mình",author:"Ghi chú đọc từ cuộc trò chuyện Mel Robbins × Seth Godin",source:"https://www.youtube.com/watch?v=cWZI2RyI9wM&t=51s"};
var SRC='<a href="https://www.youtube.com/watch?v=cWZI2RyI9wM&amp;t=51s" target="_blank" rel="noopener">xem tập podcast gốc trên YouTube</a>';
var CH=[
{t:"Lời dẫn: Một cuộc trò chuyện đáng để đọc chậm",body:
'<p class="first">Có những cuộc trò chuyện mà nghe xong mình chỉ gật gù, rồi sáng hôm sau mọi thứ trở lại như cũ. Và có những cuộc khác, nghe xong mình bỗng ngồi im, nhìn vào một việc mình đã né suốt mấy năm. Tập podcast giữa Mel Robbins và Seth Godin thuộc nhóm thứ hai, ít nhất là với mình.</p>'+
'<p>Mel Robbins dẫn một chương trình podcast rất nổi tiếng về thay đổi thói quen và cách sống. Seth Godin là tác giả của hơn hai mươi cuốn sách về marketing và làm nghề sáng tạo, và Mel gọi ông là một trong những người thầy của cô. Hai người ngồi lại, và cả buổi xoay quanh một câu hỏi tưởng giản dị: <i>vì sao ta cứ chờ?</i></p>'+
'<p>Chờ đến lúc rảnh. Chờ đến lúc đủ giỏi. Chờ ai đó gật đầu. Chờ mọi thứ bình thường trở lại. Seth gọi đó là một chỗ trốn rất êm. Và cả cuộc trò chuyện là những cách để bước ra khỏi chỗ trốn ấy.</p>'+
'<h2>Cuốn sách nhỏ này là gì</h2>'+
'<p>Mình ghi lại các ý chính của tập podcast, và <b>giải thích kỹ hơn</b> ở những chỗ mình thấy cần: thêm ví dụ, thêm câu hỏi để bạn tự soi. Những ví dụ do mình thêm vào đều là giả định, mình sẽ ghi rõ để không lẫn với lời của hai diễn giả. Đây không phải bản ghi nguyên văn, nên nếu muốn nghe đúng giọng và cách nhấn nhá của họ, bạn có thể '+SRC+'.</p>'+
'<h2>Cách đọc cho có ích</h2>'+
'<ul><li>Đọc mỗi lần một chương. Mỗi chương xoay quanh một ý, đủ để nghĩ cả ngày.</li><li>Cuối nhiều chương có khung <b>Tự hỏi mình</b>. Đừng bỏ qua, và đừng trả lời trong đầu. Viết ra giấy, dù chỉ ba dòng.</li><li>Đọc xong chương nào, chọn <b>một</b> việc nhỏ làm trong tuần. Một thôi. Cuốn sách này nói đi nói lại rằng nhỏ vẫn đủ.</li></ul>'+
'<div class="note"><b>Một lời nhắc trước khi vào chuyện</b>Đây là chuyện về việc bắt đầu, không phải chuyện về lỗi của bạn. Nếu có lúc bạn thấy mình bị chê trách, hãy dừng lại và đọc tiếp. Mục đích của những trang này là mở ra một lối đi, không phải chỉ ra một sai lầm.</div>'},

{t:"Làm tệ đi thì dễ, làm tốt lên cũng không khó đến thế",body:
'<p class="first">Seth mở đầu bằng một bài tập nghe hơi lạ. Hãy nghĩ về hoàn cảnh bạn đang ở, ở công ty hay ở nhà, rồi tự hỏi: <i>mình có làm nó tệ đi được không?</i></p>'+
'<p>Câu trả lời gần như chắc chắn là có. Ta biết ngay cách: kể cho mình nghe thêm một câu chuyện u ám, nói một câu làm người kia chạnh lòng, bỏ bê một việc nhỏ cho tới khi nó thành việc lớn. Ta thạo điều này đến mức không cần cố gắng. Mel cũng thừa nhận cô có thể kể ra cả trăm cách để biến một ngày bình thường thành một ngày tồi tệ.</p>'+
'<p>Chuyện hay nằm ở bước tiếp theo. Nếu làm mọi thứ tệ đi dễ như vậy, thì theo cùng thước đo đó, chắc chắn cũng có những việc nhỏ làm mọi thứ khá lên. Vấn đề không phải ta không có khả năng, mà là ta hiếm khi dừng lại để nghĩ theo hướng này. Mình gọi nó là bài tập hai chiều: cùng một hoàn cảnh, nhìn từ hai phía.</p>'+
'<h2>Nạn nhân hay kiến trúc sư</h2>'+
'<p>Seth nói mọi thứ bắt đầu từ chính nhà mình: từ ý nghĩ đầu tiên khi thức dậy đến câu cuối cùng nói với người thân trước khi ngủ. Tất cả được nuôi bằng câu chuyện ta tự kể. Và có hai kiểu câu chuyện. Một là câu chuyện của nạn nhân: mọi thứ xảy ra với tôi. Hai là câu chuyện của kiến trúc sư: tôi đang ở đây, vậy tôi sẽ dựng gì từ chỗ này?</p>'+
'<p>Nghe đến đây, có lẽ nhiều người khựng lại, như Mel đã khựng. Câu bạn chỉ là nạn nhân nếu bạn muốn thế rất dễ nghe như một lời trách. Seth hiểu điều đó, nên ông nói rất cẩn thận. Ông thừa nhận mình trúng số ở ngày sinh và ở cha mẹ. Ông thừa nhận có người đang kẹt trong quan hệ bạo hành, nợ nần, bệnh tật, và những điều đó là có thật.</p>'+
'<p>Điều ông không nói là chuyện xấu không xảy ra. Điều ông hỏi là: <b>sau khi nó xảy ra, ta làm gì với nó?</b> Chuyện tồi tệ thường rơi vào những người không đáng chịu. Nhưng chính những người từng trải qua điều khủng khiếp hơn nhiều lại là người cho ta thấy rằng vẫn có người nở rộ ngay giữa hoàn cảnh ấy.</p>'+
'<blockquote>Nơi duy nhất để bắt đầu là nơi bạn đang đứng. Chờ đến lúc ở chỗ khác thì bạn sẽ không bao giờ tới được chỗ khác.</blockquote>'+
'<p>Mình nghĩ câu này chữa được một thói quen rất phổ biến: đợi tôi chuyển nhà, đợi tôi đổi việc, đợi con lớn. Tất cả đều là những chỗ khác. Mà chỗ khác đó, khi tới nơi, lại sinh ra một chỗ khác nữa.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Chọn một hoàn cảnh bạn đang bực. Viết ra ba cách làm nó tệ đi, rồi ba cách làm nó khá lên. Cách nào trong ba cách thứ hai là nhỏ nhất, làm được trong hôm nay?</div>'},

{t:"Vấn đề và tình huống: hai loại chuyện, hai cách đối xử",body:
'<p class="first">Đây là chương mình thấy hữu ích nhất cho đời sống hằng ngày, vì nó giúp ta thôi tiêu hao sức vào chỗ không đáng.</p>'+
'<p>Seth chia mọi chuyện ta gặp thành hai loại:</p>'+
'<ul><li><b>Vấn đề:</b> có lời giải. Lời giải đó có thể ta không thích, có thể làm ta ngượng, có thể đòi ta đánh đổi, nhưng nó tồn tại.</li><li><b>Tình huống:</b> không có lời giải. Ông còn là kỹ sư cơ khí nên lấy ví dụ rất thẳng: bạn không thể viết lại các định luật vật lý, không thể có mặt ở hai thành phố cùng lúc, không thể ép một công ty mua món họ không cần.</li></ul>'+
'<p>Nghe đơn giản, nhưng gần như mọi cơn bực bội đều đến từ việc ta lẫn hai loại này. Ta mang sức đi sửa một <b>tình huống</b>, thấy mệt, thấy bất công, thấy kiệt sức. Hoặc ta gọi một <b>vấn đề</b> là tình huống để khỏi phải làm gì, vì không có cách nào đâu.</p>'+
'<h2>Hai ví dụ trong cuộc trò chuyện</h2>'+
'<p>Ví dụ thứ nhất là đàm phán lương. Seth nói nếu bạn chịu một cuộc nói chuyện không dễ chịu chừng mười lăm phút mỗi năm với sếp, bạn sẽ kiếm được nhiều hơn. Lời giải của chuyện lương là một cuộc nói chuyện ngượng ngùng, nghĩa là nó <i>có</i> lời giải. Cái khó chỉ là ta không muốn trả giá bằng mười lăm phút ngượng ngùng đó.</p>'+
'<p>Ví dụ thứ hai Mel đưa ra, quen thuộc hơn: chồng hoặc vợ xếp bát vào máy rửa theo cách làm ta phát điên, mà ta chỉ muốn họ tự hiểu. Lời giải ai cũng biết: nói thật lòng, nói tử tế, đặt sự thấu cảm lên trước. Nó mất mười phút khó chịu. Ta đã giải được vấn đề, chỉ là quá trình không dễ chịu.</p>'+
'<blockquote>Hầu hết các vấn đề đều chẳng vui gì cho đến khi bạn giải xong chúng.</blockquote>'+
'<h2>Khi đó là tình huống</h2>'+
'<p>Với tình huống, bài học đảo lại. Không có lời giải, nên việc duy nhất ta làm được là chấp nhận. Mel nói ý này giải phóng cô: nếu là tình huống, ta được phép thôi tự dằn vặt. Nếu là vấn đề, ta mất cớ để lảng tránh. Cả hai đều nhẹ hơn so với việc ở lơ lửng giữa hai bên.</p>'+
'<p>Đây cũng là chìa khóa của Let Them Theory, ý tưởng trong cuốn sách của Mel mà Seth nhắc tới. Nếu người kia nhất quyết làm điều họ muốn, đó là tình huống. Ta có thể cãi nhau nảy lửa, hoặc nhận ra họ sẽ làm điều họ chọn, và giải pháp của ta là để họ làm. Cái ta kiểm soát được là cách mình phản ứng.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Liệt kê ba điều làm bạn bực nhất tuần qua. Gạch chân điều nào là vấn đề (bạn có quyền can thiệp), khoanh tròn điều nào là tình huống. Với vấn đề, lời giải ngượng ngùng nhất là gì? Với tình huống, bạn đang tiêu hao sức vào đâu?</div>'},

{t:"Một chữ và đổi cả câu chuyện",body:
'<p class="first">Có hai từ nhỏ mà Seth cho là gánh nặng cảm xúc rất lớn trong mọi câu ta kể: <b>nhưng</b> và <b>và</b>.</p>'+
'<p>Hãy so sánh hai câu.</p>'+
'<blockquote>Tôi đang đi nghỉ nhưng trời mưa.<br>Tôi đang đi nghỉ và trời đang mưa.</blockquote>'+
'<p>Hai câu nói cùng một sự thật. Nhưng câu đầu tuyên bố kỳ nghỉ đã hỏng, vì từ nhưng biến cơn mưa thành kẻ phá hoại. Câu sau chỉ đặt hai sự việc cạnh nhau, và để mở một câu hỏi: <i>vậy bây giờ mình làm gì?</i></p>'+
'<h2>Nhưng biến người khác thành cái cớ</h2>'+
'<p>Mình thấy phép thử này đúng nhất với các mối quan hệ gần. Mel và Seth lấy ví dụ một người vừa thay đổi lối sống: bớt nhậu, dậy sớm, tập thể dục, thấy khỏe hơn. Còn người bạn đời thì không ủng hộ, thậm chí khó chịu.</p>'+
'<ul><li>Với nhưng: <i>Tôi sống lành mạnh và thấy tuyệt, nhưng chồng tôi không thích.</i> Người kia thành chướng ngại, thành lý do để tôi dừng.</li><li>Với và: <i>Tôi sống lành mạnh và thấy tuyệt, và chồng tôi không thích.</i> Họ không còn là cái cớ. Họ là một sự thật tôi đang đối diện.</li></ul>'+
'<p>Mel chỉ ra chỗ hay ở câu thứ hai: khi đó tôi có một <b>trách nhiệm</b> với mối quan hệ. Người bạn đời không tự giải được chuyện này, vì nếu giải được thì họ đã giải. Tôi có thể coi nó là tình huống và sống chung. Hoặc tôi có thể hỏi: mình cần làm gì để thật sự hiểu nỗi sợ của họ? Có thể họ sợ bị bỏ lại phía sau, sợ bị so sánh, hay chính họ cũng muốn đổi mà chưa dám. Không có cách nào bảo đảm một trăm phần trăm, nhưng nếu không vun, chắc chắn nó chẳng đi tới đâu.</p>'+
'<p>Seth còn nhắc một ví dụ khác: lên kế hoạch cho đám cưới. Câu tôi muốn họ có đám cưới như họ mơ, nhưng cũng phải vừa túi tiền và đúng ý tôi ôm quá nhiều điều mâu thuẫn trong một chữ nhưng. Chữ đó đang giả vờ rằng ta có thể có tất cả cùng lúc.</p>'+
'<h2>Cách tập</h2>'+
'<p>Mình thử tập thế này, và thấy khá hiệu nghiệm. Lần tới khi nghe mình nói nhưng, mình dừng lại và thử thay nó bằng và. Nếu câu mới nghe sượng, thường là vì mình đang né một lựa chọn thật. Mình viết nó ra giấy và thêm một dòng: <i>Vậy việc nhỏ nhất mình làm là gì?</i></p>'+
'<div class="note"><b>Tự hỏi mình</b>Bạn có đang dùng nhưng để trao quyền kiểm soát cuộc đời mình cho hoàn cảnh bên ngoài không? Chọn một câu bạn hay nói, đổi nhưng thành và, rồi viết tiếp một câu bắt đầu bằng vậy mình sẽ.</div>'},

{t:"Lực cản không phải kẻ thù, nó là chiếc la bàn",body:
'<p class="first">Nếu cuốn sách nhỏ này chỉ được giữ lại một khái niệm, mình sẽ giữ khái niệm này: <b>lực cản</b>.</p>'+
'<p>Seth dùng từ này cho mọi thứ ta làm để tự cản đường mình, nhằm tránh một việc ta sợ. Nó hiện ra dưới nhiều dạng: trì hoãn, bận rộn đột xuất, đi tìm thêm một khóa học nữa, thấy không còn hứng, sửa đi sửa lại cho đến lúc quên mất mình đang làm gì. Ông còn nói thẳng là chuyện bí ý tưởng của người viết chẳng có thật. Khi một việc mang cảm giác quan trọng, bên trong ta tự động dựng rào để khỏi phải chịu trách nhiệm.</p>'+
'<h2>Vì sao nó lại có mặt</h2>'+
'<p>Seth nhắc tới trường học. Ở đó ta được dạy rằng người sống sót an toàn nhất là người biết ẩn mình và làm theo lệnh. Công nhân nhà máy không cần chịu trách nhiệm cá nhân, chỉ cần theo quy trình. Đó cũng là một phần của bản tính con người: ta thấy an toàn khi không bị nhìn thấy.</p>'+
'<p>Vì vậy, lực cản không phải dấu hiệu bạn yếu. Đó là phản xạ bình thường mỗi khi ta sắp làm điều mình thực sự quan tâm.</p>'+
'<h2>Hãy nói lời cảm ơn</h2>'+
'<p>Đây là phần mình thích nhất. Seth đề nghị ta không đánh nhau với lực cản, vì nó không biến mất. Thay vào đó, hãy nói với nó: <i>Cảm ơn nhé. Cảm ơn vì đã cho tôi biết mình sắp làm một điều quan trọng.</i></p>'+
'<p>Nghe hơi hài, nhưng logic của nó rất chắc. Nếu bạn không cảm thấy lực cản nào, có thể việc đó chưa đủ quan trọng. Những việc bạn cứ trì hoãn dai dẳng chính là chiếc la bàn đang chỉ vào phần việc khó cần làm. Thay vì tự trách mình lười quá, bạn có thể đọc nó như một tấm bản đồ: <b>chỗ nào ta né nhiều nhất, thường là chỗ đáng đến nhất.</b></p>'+
'<h2>Việc khó ngày nay là gì</h2>'+
'<p>Ngày xưa việc khó là sức vóc: vác được bao nhiêu đá. Còn bây giờ, theo Seth, việc khó là những thứ khác hẳn: nghĩ ra một giải pháp nằm ngoài danh sách có sẵn, nói sự thật theo cách người khác nghe được, đưa ra một quyết định sáng suốt, viết điều chưa ai viết, vẽ bức tranh chưa ai vẽ.</p>'+
'<p>Ông kể một hình ảnh quen thuộc: hâm thức ăn bằng lò vi sóng, làm hết các gạch đầu dòng, rồi xem phim ba tiếng mỗi tối. Ta hòa vào đám đông và không phải đối mặt với lực cản. Câu hỏi ông đặt ra: <b>việc nào ta đang sợ mà vẫn nên làm?</b></p>'+
'<h2>Công việc không chỉ là nghề nghiệp</h2>'+
'<p>Mel hỏi một câu rất hay: khi nói công việc, có phải ông không chỉ nói chuyện sự nghiệp? Seth đồng ý. Ông không tin ai muốn ngồi bãi biển chờ cocktail mỗi ngày mà không được làm gì khác. Con người thấy sống trọn vẹn khi có cơ hội tạo ra giá trị, dù có được trả tiền hay không: món đồ gốm tự nặn, cách nuôi dạy con, buổi tình nguyện ở trạm cứu hộ.</p>'+
'<p>Và có một tác dụng phụ đẹp: những ai dám xuất hiện làm việc tử tế sẽ nhận lại sự tôn trọng, sự độc lập, và một thứ kiên cường tích lũy dần bên trong. Thế giới luôn khát những người dám làm điều người khác sợ.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Việc nào bạn trì hoãn lâu nhất mà vẫn day dứt? Bạn đang sợ điều gì ở nó? Thử nói thành lời: Cảm ơn, nhờ có bạn mà tôi biết việc này quan trọng.</div>'},

{t:"Tự chọn lấy mình",body:
'<p class="first">Đến đây ta tới cụm từ làm nên tên cuốn sách. Khi Mel hỏi bản chất của một cuốn sách, một kênh YouTube hay một dự án tay trái ta ấp ủ là gì, Seth chỉ đáp hai chữ: <b>tự chọn lấy mình</b> (<i>pick yourself</i>).</p>'+
'<h2>Hệ thống muốn bạn chờ</h2>'+
'<p>Theo Seth, hệ thống quen thuộc khuyến khích ta đợi: đợi được mời vào chương trình, đợi được gọi phỏng vấn, đợi công ty tìm tới. Nó nuôi một ảo tưởng rằng sẽ có người chọn mình, cấp phép cho mình, rồi gọi điện nói: Chúng tôi biết bạn đang ấp ủ một cuốn tiểu thuyết, hãy viết đi, chúng tôi sẽ xuất bản.</p>'+
'<p>Chuyện đó hầu như không xảy ra. Và điều khó nghe hơn nữa: không ai ép ta chờ cả. Ta <i>chọn</i> chờ.</p>'+
'<h2>Chỗ trốn hoàn hảo</h2>'+
'<p>Seth gọi việc chờ đợi là một nơi trốn êm ái, và ông còn chúc mừng ta đã dựng nên nó. Mình thấy câu này vừa hài vừa đau:</p>'+
'<ul><li>Tôi đã gửi bản thảo cho hai mươi nhà xuất bản, họ đều từ chối. Bạn đã hết trách nhiệm, an toàn biết bao.</li><li>Tôi có một bài nói tuyệt vời, nhưng ban tổ chức chưa mời tôi. Khi nào họ gọi thì tôi mới diễn.</li></ul>'+
'<p>Nếu chỗ trốn này vẫn đang giúp bạn, cứ ở lại, Seth nói vậy. Còn nếu không, quay về với từ và: <i>tôi có điều muốn chia sẻ, và hôm qua tôi đã tự ghi hình, ngày mai nó lên YouTube.</i></p>'+
'<h2>Một cách làm rất thẳng</h2>'+
'<p>Seth từng nói chuyện với hàng nghìn người có một cuốn sách trong lòng, và lời khuyên của ông rất giản dị. Làm thành tệp PDF, gửi cho khoảng hai mươi người, nhờ họ chuyển tiếp miễn phí. Nếu nó lan ra, điện thoại của bạn sẽ reo. Nếu không, viết cái khác hay hơn. Hết chuyện.</p>'+
'<p>Ông bảo hầu như không ai làm. Vì nói đây, tôi đã làm ra cái này nghe ngượng. Bốn chữ đó (<i>Here, I made this</i>) là một lời thách thức. Mua cuốn sách dạy nấu ăn rồi làm theo công thức dễ hơn nhiều so với việc tự nghĩ ra một món rồi mời người mình thương.</p>'+
'<h2>Ngại tên thật? Dùng bút danh</h2>'+
'<p>Seth khuyên mọi người lập một blog. Dùng tên giả cũng được, ông nói. Nhưng sau khoảng một trăm ngày, bạn sẽ muốn điền tên thật. Vì khi thấy thứ mình tạo ra đứng đó, do chính tay mình, bạn sẽ thấy tự hào đủ để nhận nó.</p>'+
'<blockquote>Tự chọn lấy mình không phải để giành huy chương. Đó là quyền chủ động, và nó có một tên gọi: tự do. Phẩm giá nằm ở đó.</blockquote>'+
'<h2>Môi trường cũng là một lựa chọn</h2>'+
'<p>Mel nhắc rằng khi thuộc về một nhóm, ta luôn có xu hướng muốn hòa nhập. Seth đáp: nếu nhóm bạn thuộc về không đưa bạn tới nơi bạn muốn tới, hãy dựng một nhóm khác. Một nhóm những người dám hỏi nhau câu khó về mối quan hệ, cuốn sách đang đọc, thứ đang làm. Vì ta dần giống những người ta ở cạnh và những điều họ kỳ vọng ở ta.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Bạn đang chờ ai gọi điện? Nếu cuộc gọi đó không bao giờ đến, bạn sẽ làm gì vào tuần tới? Viết ra một việc, và ai sẽ là người biết bạn đang làm nó?</div>'},

{t:"Nhỏ thôi cũng đủ",body:
'<p class="first">Đọc xong chương trước, có thể bạn thấy hơi choáng: tự chọn lấy mình nghe như phải làm một việc vĩ đại. Seth biết điều đó, nên ông đưa ra những cách thu nhỏ việc đến mức không còn lý do để trốn.</p>'+
'<h2>Hai cái nhỏ nhất</h2>'+
'<ul><li><b>Tệp khán giả khả thi nhỏ nhất:</b> nhóm người nhỏ nhất mà nếu bạn tác động được lên họ thì đã đủ. Mel bổ sung: nếu đó chỉ là một gia đình, hay một đứa trẻ, vậy là đủ. Hàng xóm nghĩ gì không quan trọng.</li><li><b>Tác phẩm khả thi nhỏ nhất:</b> bước dịch chuyển nhỏ nhất vẫn có giá trị.</li></ul>'+
'<p>Ông đưa hai ví dụ. Một người bị tê liệt hai mươi năm vì muốn học điều dưỡng: sao không làm tình nguyện một buổi chiều mỗi tuần ở viện dưỡng lão? Hai giờ mỗi tuần để đổi một phần cuộc đời ai đó. Người khác than sếp không cho tôi làm, nhưng thật ra họ muốn tái cấu trúc cả công ty. Dĩ nhiên không ai trao quyền đó. Nhưng bạn có thể mở một nhóm đọc sách vào bữa trưa thứ Sáu, mời năm đồng nghiệp. Hiệu quả thì làm tiếp, không thì dừng.</p>'+
'<p>Mel hỏi: khán giả đó có thể là chính mình không? Ví dụ tôi ngại viết một bài dài lên Substack, nhưng tôi có thể gửi một email cho em gái. Seth gật đầu, và còn thêm một mức nữa trước đó: <b>sở thích</b>. Sở thích là cho riêng bạn, đừng bỏ thú đẽo mái chèo chỉ vì hàng xóm chê. Đơn vị nhỏ nhất kế tiếp sau bạn là một con người cụ thể.</p>'+
'<h2>Dính mắc: đừng buộc dây vào nhau</h2>'+
'<p>Khi đưa việc của mình ra, có một cái bẫy: sự dính mắc, hay cố kiểm soát kết quả. Seth lấy khái niệm này từ Phật giáo và giải thích bằng một hình ảnh rất dễ nhớ.</p>'+
'<p>Hai người cùng bơi qua một cái hồ nhỏ. Cách tốt nhất là bơi cách nhau chừng hai mét, ai gặp sự cố thì người kia cứu. Còn nếu buộc dây vào tay, vào chân hai người, thì cả hai chết đuối.</p>'+
'<p>Khi ta nói đây, tôi làm ra thứ này, câu đó không được kèm vế và bạn phải thích nó. Mel tóm lại: <i>đây là một món quà</i>. Món quà thật không đi kèm hóa đơn là lời cảm ơn, nụ cười rạng rỡ, hay đĩa ăn sạch.</p>'+
'<p>Một ví dụ đời thường của mình (giả định): nấu một bữa cơm cho người mình thương, rồi canh từng lời khen. Nếu họ im lặng, ta thất vọng. Đó là lúc ta đã buộc dây vào tay họ.</p>'+
'<h2>Vậy niềm vui nằm ở đâu</h2>'+
'<p>Seth không bảo ta làm vì người khác mà không cần gì cho mình. Ông nói đây không phải chủ nghĩa vị kỷ. Với hầu hết người bình thường, niềm vui đến từ phản ứng của người nhận. Như diễn viên sân khấu: phải rất lâu họ mới chán tràng pháo tay cuối màn. Tiếng vỗ tay không để báo họ diễn tốt, họ tự biết, mà để kết nối, để chạm đến một điều gì đó trong người xem.</p>'+
'<h2>Hạt giống không nên giấu trong kho lạnh</h2>'+
'<p>Mel ví những thôi thúc trong ta như hạt giống: ta không biết bao giờ chúng nở và nở thành gì, nhưng ta lại giấu chúng trong bóng tối. Seth bổ sung: chúng cần được đem ra gieo ngoài trời sáng.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Việc bạn muốn làm: tệp khán giả nhỏ nhất của nó là ai, gọi được tên không? Tác phẩm nhỏ nhất có thể làm trong tuần này là gì? Và khi làm xong, bạn có thể đưa nó đi mà không kèm điều kiện gì không?</div>'},

{t:"Dành cho ai? Để làm gì?",body:
'<p class="first">Seth có một khái niệm gọi là thiết kế có chủ đích (<i>intentional design</i>), và nó gói trong hai câu hỏi:</p>'+
'<ul><li><b>Dành cho ai?</b></li><li><b>Để làm gì?</b></li></ul>'+
'<p>Trước khi đăng một bài lên mạng, gửi một email, hay bắt đầu một dự án, hãy trả lời hai câu này. Nếu được, <i>gọi tên cụ thể</i> người nhận. Nếu họ không phải nhóm đó, bạn không cần họ xem, cũng không cần bận lòng nếu họ không thích. Và câu thứ hai: bạn bỏ công sức ra để làm gì? Bạn nhận được gì, họ nhận được gì?</p>'+
'<p>Mel bật cười ở đây: nếu không trả lời được hai câu đó, thì ta chỉ đang vùng vẫy và đang trốn tránh. Mình thấy đúng. Biết bao lần mình đăng một thứ lên mạng và chờ xem phản ứng, mà chưa từng tự hỏi nó dành cho ai.</p>'+
'<h2>Bẫy của sự chú ý</h2>'+
'<p>Seth nói về thuật toán mạng xã hội khá gắt. Chúng được thiết kế để ta thấy tự ti cho tới khi làm theo điều chúng muốn. Khi ta liên tục làm nội dung miễn phí cho họ và nài bạn bè vào xem, ta đang đi làm không công cho họ. Và luôn có một chỗ an toàn tiếp theo để mắc kẹt: mua đèn xịn, đội mũ đúng mốt, rồi tự nhủ chỉ còn thiếu ba trăm nghìn người theo dõi.</p>'+
'<p>Cái giá cuối cùng là ta bắt người thân phải tương tác vì mình, và chiều chuộng một đám đông xa lạ mình chẳng thật sự quan tâm.</p>'+
'<h2>Đáng chú ý nghĩa là gì</h2>'+
'<p>Khi Mel hỏi về chuyện trở nên đáng chú ý (<i>remarkable</i>), Seth giải thích theo nghĩa gốc: <b>đáng để người ta nói về</b>. Không phải gào lên, không phải đội mũ kỳ quái. Là làm ra thứ có giá trị đến mức người khác được lợi khi nhắc đến bạn. Họ nói vì lợi ích của họ, chứ không vì bạn.</p>'+
'<p>Seth kể câu chuyện về mẹ ông. Bà làm tình nguyện rồi làm nhân viên ở một bảo tàng nghệ thuật, nơi cửa hàng lưu niệm khi ấy chỉ bán vài tấm bưu thiếp. Bà nhận ra nhiều người dân địa phương chưa từng bước vào bảo tàng vì rào cản tâm lý về giai cấp. Năm 1973, bà mời hai chuyên gia từ một nhà đấu giá nổi tiếng đến thẩm định đồ cổ miễn phí cho người dân.</p>'+
'<p>Tối thứ Sáu trước sự kiện, bà về nhà lo lắng: lỡ chẳng ai đến thì sao. Rồi bà tự trả lời, kèm tiếng cười: nếu chẳng ai đến thì cũng đâu ai biết là không có ai đến. Hôm sau có khoảng năm nghìn người xếp hàng.</p>'+
'<blockquote>Nếu chỉ làm đúng mô tả công việc, nơi đó mãi chỉ là một quầy bán bưu thiếp.</blockquote>'+
'<p>Mình thích cách câu chuyện này gỡ nỗi sợ: sợ không ai đến, nhưng nếu không ai đến thì cũng không ai chứng kiến. Cái giá rất rẻ, mà phần thưởng có thể rất lớn.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Với việc bạn sắp làm: nhóm người nhỏ nhất bạn muốn phục vụ là ai? Gọi tên chân dung của họ. Và bạn muốn điều gì đổi khác ở họ sau khi nhận thứ này?</div>'},

{t:"Bẫy địa vị và câu hỏi mình muốn trở thành ai",body:
'<p class="first">Khi Mel hỏi về những người xung quanh, những tiếng ồn từ chính người thân khi ta đổi thay, Seth đưa ra một mô hình đơn giản mà mình thấy giải thích được rất nhiều chuyện.</p>'+
'<h2>Ba tầng động lực</h2>'+
'<p>Theo ông, con người bị thúc đẩy bởi ba thứ, xếp từ nông xuống sâu:</p>'+
'<ul><li><b>Địa vị:</b> ai ăn trưa trước, ai ở trên ai, bạn lái xe gì, bàn gần sếp hay không.</li><li><b>Sự hòa nhập:</b> ai đứng cạnh tôi, tôi mặc thế này có đúng điệu không, tôi có thuộc về nơi đây không.</li><li><b>Nỗi sợ:</b> nằm dưới cả hai, và là nền của mọi thứ. Nó bắt đầu từ nỗi sợ cái chết rồi lan thành hàng triệu nỗi sợ khác.</li></ul>'+
'<p>Vì thế, <b>khi bối rối, hãy tìm nỗi sợ</b>. Người thân yêu thương bạn có thể đang sợ: sợ bạn đổi thay, sợ bị bỏ lại, sợ điều gì sẽ xảy ra nếu thế giới thay đổi. Họ có ý tốt trong hoàn cảnh của họ, nhưng hoàn cảnh quyết định rất nhiều: điều họ được dạy, những kỳ vọng họ được cài, hệ thống họ thuộc về.</p>'+
'<p>Seth còn nhắc một điều: thế giới đang biến động, và trạng thái hiện tại gần như là mức bình thường nhất ta có được từ nay. Nếu chờ mọi thứ bình thường trở lại, ta sẽ chờ rất lâu. Thay đổi đang diễn ra dù ta thích hay không, và câu hỏi là ta chọn tác động lên nó hay ngồi yên.</p>'+
'<h2>Nhiên liệu của bạn là gì</h2>'+
'<p>Chuyện địa vị đáng nói riêng. Seth kể ông từng thấy học sinh được dạy cách vận hành qua điểm số: thưởng điểm, dọa trừ điểm. Trong thể thao học đường người ta hành xử như thể đang thiếu cúp, trong khi mục tiêu thật là ta rèn thành người như thế nào. Rồi ta mang cách nghĩ đó vào đời lớn: so với hàng xóm, đua với bạn học cũ, đẩy guồng quay nhanh hơn vì củ cà rốt và cây gậy.</p>'+
'<p>Lựa chọn thay thế, ông nói, là hỏi: <b>Tôi khao khát trở thành ai?</b> và không so với ai. Quay lại hai câu cũ: dành cho ai, để làm gì. Làm việc này để giàu hơn hàng xóm ư? Để làm gì chứ? Ông gọi việc so kè địa vị là thứ nhiên liệu độc hại không bao giờ có hồi kết.</p>'+
'<h2>Hai bước để thoát</h2>'+
'<ol style="padding-left:1.2em"><li style="margin-bottom:.5em"><b>Gọi đúng tên nó.</b> Seth lấy ví dụ: tôi trả bốn trăm đô cho đôi giày mà đáng ra chỉ cần năm mươi, vì tôi muốn mua một chút địa vị, một lớp áo giáp. Nói to ra, bạn sẽ thấy nó nghe nực cười đến đâu.</li><li style="margin-bottom:.5em"><b>Chọn lại nơi đặt ánh nhìn.</b> Bữa tối cả nhà, ta nói về điều gì? Ta thông báo gì, phàn nàn gì, biết ơn gì? Nếu đứa con sáu tuổi mang phiếu liên lạc điểm C mà ta phát hoảng, có thể ta đang lo mười một năm nữa nó không vào trường danh tiếng để ta dán decal lên xe. Không ai nói ra điều này, nhưng tâm lý đó vận hành.</li></ol>'+
'<p>Mel kể một trải nghiệm riêng rất đời. Nhiều năm cô bị thiêu đốt bởi nhiên liệu địa vị, đuổi theo những thứ hào nhoáng mình không đủ sức chi. Bước ngoặt là khi cô bắt đầu gọi đúng tên: cô nói với con rằng nhà mình không đi chuyến du lịch đó vì không có tiền. Áp lực tan đi. Cô có thể làm việc ba năm để dành cho một chuyến đi, nhưng vì niềm vui sum họp, không phải để chứng tỏ.</p>'+
'<p>Seth nói thêm: một cuộc nói chuyện trung thực với gia đình về điều kiện tiền bạc là hành động hào phóng, đáng tự hào, chứ không phải điều xấu hổ.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Quyết định tiền bạc hoặc mục tiêu gần nhất của bạn thật sự phục vụ nhu cầu sống của bạn, hay đang mua thêm một lớp áo giáp địa vị? Nếu không ai trên đời biết thành tích hay tài sản của bạn, bạn có còn muốn làm những điều đang làm?</div>'},

{t:"Làm xong, đừng chờ hoàn hảo",body:
'<p class="first">Mel kể một chuyện mình rất thích: cuốn sách của cô khi in ra có tới một trăm mười bảy lỗi chính tả, người ta soi từng lỗi một. Vậy mà cô vẫn tự hào, vì cuốn sách đã ra đời. Seth thì làm rõ một điều hay bị hiểu nhầm về ông.</p>'+
'<h2>Cứ phát hành đại đi và đơn thuần phát hành nó</h2>'+
'<p>Ông nói mình <i>chưa bao giờ</i> khuyên cứ phát hành đại đi (<i>just ship it</i>), vì câu đó nghĩa là tặc lưỡi mặc kệ đồ rác. Điều ông thật sự nói là <b>đơn thuần phát hành nó</b> (<i>merely ship it</i>): tác phẩm đã đạt chuẩn kỹ thuật, bạn đưa ra, không dính mắc, không tranh cãi.</p>'+
'<h2>Ba nghĩa của chữ chất lượng</h2>'+
'<p>Để hiểu chuẩn kỹ thuật là gì, Seth tách chữ chất lượng thành ba tầng:</p>'+
'<ol style="padding-left:1.2em"><li style="margin-bottom:.5em"><b>Đạt chuẩn.</b> Một chiếc xe cũ vẫn làm đúng việc nó được thiết kế để làm, các bộ phận khớp nhau. Đạt chuẩn là đủ, đừng cố vượt chuẩn một cách lãng phí.</li><li style="margin-bottom:.5em"><b>Sang trọng.</b> Một chiếc xe siêu sang đắt hơn, nhưng chưa chắc chất lượng hơn theo công năng. Nó chỉ xa xỉ hơn.</li><li style="margin-bottom:.5em"><b>Hoàn hảo như tấm bình phong.</b> Đây là tầng nguy hiểm: tìm sự không tì vết tuyệt đối. Mà trên đời chẳng có gì hoàn hảo, ngay cả một tiểu thuyết kinh điển nếu chỉnh một chữ vẫn có thể hay hơn. Bản chất của chủ nghĩa hoàn hảo không để làm mọi thứ tốt hơn, mà để ngăn bạn phát hành.</li></ol>'+
'<p>Hãy hỏi: chuẩn kỹ thuật của việc này là gì? Ngay khi đạt, đưa nó ra và chuyển sang việc tiếp theo.</p>'+
'<h2>Ta trở thành điều ta làm</h2>'+
'<p>Mel bảo Seth lặp lại câu này, và mình cũng muốn bạn dừng lại ở đây một chút:</p>'+
'<blockquote>Chúng ta trở thành điều chúng ta làm. Không phải chờ hoàn thiện rồi mới làm.</blockquote>'+
'<p>Nếu bạn muốn trở thành người chân thật, hãy bắt đầu nói sự thật, và bạn sẽ thành người chân thật. Nghe đơn giản, nhưng khó. Seth giải thích vì sao: chuỗi sợ trong đầu ta chạy rất nhanh. <i>Tôi sẽ mắc lỗi, tôi sẽ xấu hổ, tôi sẽ bị tẩy chay, tôi sẽ cô độc, tôi sẽ chết.</i> Não hoàn thành chuỗi đó trong chưa đầy hai giây. Đó là lý do người ta hay thốt lên chắc tôi chết mất, son dính vào răng kìa từ một chuyện nhỏ xíu.</p>'+
'<p>Lời khuyên: gọi tên chuỗi đó ra để thấy nó phi lý đến đâu, rồi chọn lấy nhiên liệu từ sự muốn đóng góp, không phải từ sự tự ti. Seth còn thêm một câu mình rất thích: nếu bạn làm được việc đó khi mặc quần soóc, cứ mặc quần soóc mà làm, vì chiếc quần chẳng liên quan gì đến chuẩn kỹ thuật.</p>'+
'<h2>Đặt sự mệt mỏi vào đâu</h2>'+
'<p>Seth dùng hình ảnh cuộc chạy marathon. Một số người dừng ở dặm 24, một số chạy hết 26 dặm. Khác biệt duy nhất, ông nói, là người về đích biết cách <b>đặt sự mệt mỏi vào đâu</b>. Cả hai bên mệt như nhau.</p>'+
'<p>Khi đến gặp huấn luyện viên, bạn không được nói: Tôi muốn chạy marathon và không thấy mệt. Bạn phải nói: Tôi sẽ chạy marathon, tôi biết mình sẽ mệt, và tôi cần chuẩn bị để gánh cả hai điều đó. Mel gọi đó là một giải thoát: ta hay ngộ nhận rằng nếu việc quan trọng thì nó sẽ nhẹ nhàng. Thực ra, đã quan trọng thì sẽ khó, sẽ mệt, sẽ có lực cản, và ta cần chấp nhận cả hai.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Có dự án nào bạn đã chuẩn bị, nghiên cứu hay sửa đi sửa lại nhiều tháng mà chưa dám đưa ra? Chuẩn kỹ thuật tối thiểu thật sự để đưa nó ra là gì? Khi thấy mệt hay sợ trên con đường mình chọn, bạn thường dừng lại tự hỏi có đúng đam mê không, hay tìm chỗ cất sự mệt đó để đi tiếp dặm sau?</div>'},

{t:"Nhất quán hơn là sống thật",body:
'<p class="first">Đây là chương khiến mình nghĩ nhiều nhất, vì nó đi ngược một điều ta nghe suốt: <i>hãy sống thật với chính mình</i>.</p>'+
'<p>Seth nói thẳng rằng tính chân thật theo cách hiểu thông thường là một ảo tưởng. Chẳng ai muốn bạn phơi bày một trăm phần trăm bản năng của mình, may ra chỉ bạn thân. Mel đáp lại: nhưng ông là người chân thật nhất tôi biết. Seth trả lời: tôi là người <b>nhất quán</b>.</p>'+
'<h2>Ngày thứ Ba bình thường</h2>'+
'<p>Seth hỏi Mel: năm nay có ngày nào cô thấy bực bội, khó ở, không có tâm trạng tốt nhất không? Mel cười: tôi gọi đó là ngày thứ Ba bình thường. Vậy khi ngồi trước micro, cô có chân thật mà xả cái cáu kỉnh đó không, hay cô xuất hiện với phiên bản nhất quán mà mình có thể làm?</p>'+
'<p>Mel thừa nhận cô luôn xuất hiện một cách nhất quán trước người nghe. Ở nhà thì cô hay nuông chiều bản thân hơn, và cô đang cố sửa, vì thật tệ khi dành phần tồi nhất của mình cho những người yêu thương mình nhất. Mình nghĩ câu thú nhận này rất thật, và chắc nhiều người trong chúng ta cũng vậy.</p>'+
'<h2>Bác sĩ phẫu thuật tim</h2>'+
'<p>Seth đưa ví dụ khá sắc: nếu phải mổ tim, bạn không muốn bác sĩ sống thật với cơn cáu kỉnh hôm nay. Bạn muốn họ làm tốt một cách nhất quán. Đó là lý do bạn thuê họ.</p>'+
'<p>Làm người chuyên nghiệp là đưa ra một lời hứa và giữ trọn lời hứa đó. Ông kể: khi dắt chó đi dạo, ông là Seth chữ thường. Khi bước vào phòng làm việc, ông là người đã viết hàng nghìn bài blog và hơn hai mươi cuốn sách. Đó là vai ông nhận, và trách nhiệm của ông là thể hiện vai đó nhất quán.</p>'+
'<blockquote>Đừng dùng tấm thẻ tôi chỉ đang sống thật để biện minh cho sự thô lỗ.</blockquote>'+
'<p>Mình muốn nói rõ chỗ này kẻo hiểu nhầm. Seth không bảo ta giả vờ hay giấu cảm xúc. Ông bảo: sự phơi bày trần trụi dành cho bạn thân và người nhà. Còn với những người dành sự chú ý cho ta, họ cần giá trị ổn định, chứ không cần xem ta xả bực.</p>'+
'<h2>Câu hỏi mỗi sáng</h2>'+
'<p>Seth gợi ý một câu để hỏi trước gương: <b>nếu hôm nay tôi đóng vai phiên bản tốt nhất của chính mình, điều đó sẽ như thế nào?</b> Rồi sống đúng vai đó. Ông tin rất nhanh thôi ta sẽ sống trọn với vai diễn ấy. Đó là chiến lược xây hệ thống để trở thành người mình mong muốn ngay hôm nay, vì ta không có cơ hội làm lại hôm nay lần thứ hai.</p>'+
'<p>Mel nghiền ngẫm câu đó và nói: tôi biết câu trả lời, và tất cả chúng ta đều biết.</p>'+
'<div class="note"><b>Tự hỏi mình</b>Bạn có từng viện cớ tính tôi thẳng để cư xử thiếu kiềm chế với đồng nghiệp hay người thân không? Ranh giới giữa sống giả tạo và giữ lời hứa chuyên nghiệp nằm ở đâu với bạn, khi bên trong vẫn đang có cảm xúc tiêu cực?</div>'},

{t:"Lời kết: Hãy tạo nên một cú hích",body:
'<p class="first">Cuối buổi, Mel hỏi một câu rất khó: nếu chỉ được chọn một hành động duy nhất từ tất cả những gì đã nói, ông chọn gì?</p>'+
'<p>Seth trả lời, và có lẽ bạn sẽ hơi bất ngờ vì nó giản dị: <b>hãy nói về nó</b>. Để nói được, bạn cần một người đồng hành. Nếu bạn tìm được một, ba hay năm người tạo thành một nhóm dám nói thật với nhau và thúc nhau trở thành phiên bản tốt nhất, điều kỳ diệu sẽ xảy ra. Ông nhắc rằng chính việc chia sẻ một tập podcast cho bạn bè và nói nghe cái này đi, và nhớ hỏi tôi đã làm chưa đã là một cách tự chọn mình, cộng thêm chọn một người cùng giữ trách nhiệm.</p>'+
'<h2>Tạo nên một cú hích nghĩa là gì</h2>'+
'<p>Lời chia tay của Seth cũng là lời của cả cuộc trò chuyện: <i>go make a ruckus</i>. Mình dịch là hãy tạo nên một cú hích. Ông nhấn mạnh đó không phải gây sự chú ý hay phá luật. Nó rất đơn giản: <b>làm công việc có ý nghĩa cho những người thật sự quan tâm</b>.</p>'+
'<ul><li>Đừng làm cho những kẻ không muốn nghe bạn.</li><li>Đừng làm những việc vô nghĩa chỉ để phục vụ một hệ thống bạn không tin.</li><li>Hãy làm việc có giá trị cho những ai biết trân trọng.</li></ul>'+
'<blockquote>Dù chỉ là một việc nhỏ cho một người duy nhất, thế cũng đủ. Rồi lặp lại.</blockquote>'+
'<h2>Việc nhỏ cho tuần này</h2>'+
'<p>Nếu đọc đến đây mà bạn thấy hơi nhiều thứ để nhớ, đây là bản rút gọn. Chọn <b>một</b> việc, làm từng bước:</p>'+
'<ol style="padding-left:1.2em"><li style="margin-bottom:.5em">Chọn một việc bạn đã trì hoãn lâu, và gọi tên nỗi sợ đằng sau nó.</li><li style="margin-bottom:.5em">Viết ra hai dòng: <i>dành cho ai</i>, <i>để làm gì</i>.</li><li style="margin-bottom:.5em">Thu nó về cỡ nhỏ nhất vẫn có giá trị, và đặt ngày làm trong tuần này.</li><li style="margin-bottom:.5em">Nhắn cho một người, nói bạn sẽ làm, và nhờ họ hỏi lại bạn.</li><li style="margin-bottom:.5em">Khi lực cản xuất hiện, nói một câu: Cảm ơn, nhờ có bạn mà tôi biết việc này quan trọng.</li></ol>'+
'<div class="note"><b>Muốn nghe trực tiếp</b>Những điều trên là phần mình đọc và diễn giải lại. Giọng nói, nhịp cười và những chỗ ngập ngừng của hai người nằm ở bản gốc. Nếu bạn muốn nghe, hãy '+SRC+'.</div>'+
'<p style="text-align:center;margin-top:2em"><i>Cảm ơn bạn đã đọc đến đây. Giờ thì, việc đầu tiên của bạn là gì?</i></p>'}
];
/* ====================================================== */

var $=function(i){return document.getElementById(i)};
var root=document.documentElement;
var S={ch:0,fs:19,lh:1.63,w:680,theme:null};
var KEY="reader:tu-chon-lay-minh";
try{var sv=JSON.parse(localStorage.getItem("reader")||"{}");for(var k in sv)if(k in S)S[k]=sv[k];
if([600,680,760].indexOf(S.w)<0)S.w=680;if([1.5,1.63,1.85].indexOf(S.lh)<0)S.lh=1.63;
var pos=JSON.parse(localStorage.getItem(KEY)||"{}");if(typeof pos.ch==="number"&&pos.ch<CH.length)S.ch=pos.ch;var savedY=pos.y||0}catch(e){var savedY=0}
if(location.hash){var h=parseInt(location.hash.slice(3),10);if(h>0&&h<=CH.length){S.ch=h-1;savedY=0}}

function save(){try{localStorage.setItem("reader",JSON.stringify({fs:S.fs,lh:S.lh,w:S.w,theme:S.theme}))}catch(e){}}
function applyPrefs(){
  root.style.setProperty("--fs",S.fs+"px");root.style.setProperty("--lh",S.lh);
  root.style.setProperty("--measure",S.w+"px");
  if(S.theme)root.setAttribute("data-theme",S.theme);
  [["wSeg",String(S.w)],["lhSeg",String(S.lh)],["thSeg",S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")]].forEach(function(p){
    [].forEach.call($(p[0]).querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-v")===p[1])});
  });
}

function render(y){
  var c=CH[S.ch];
  $("page").innerHTML='<p class="kicker">Chương '+(S.ch+1)+' / '+CH.length+'</p><h1>'+c.t+'</h1>'+c.body;
  $("barTitle").textContent=BOOK.title;
  document.title=c.t+" · "+BOOK.title;
  $("pager").innerHTML=
    (S.ch>0?'<a class="prev" href="#ch'+S.ch+'" data-go="'+(S.ch-1)+'"><small>← Chương trước</small><strong>'+CH[S.ch-1].t+'</strong></a>':'')+
    (S.ch<CH.length-1?'<a class="next" href="#ch'+(S.ch+2)+'" data-go="'+(S.ch+1)+'"><small>Chương sau →</small><strong>'+CH[S.ch+1].t+'</strong></a>':'');
  $("end").textContent=S.ch===CH.length-1?"Hết bản đọc mẫu. Cảm ơn bạn đã đọc.":"";
  [].forEach.call($("tocList").querySelectorAll("a"),function(a,i){if(i===S.ch)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current")});
  window.scrollTo(0,y||0);progress();
}
function go(i){if(i<0||i>=CH.length)return;S.ch=i;history.replaceState(null,"","#ch"+(i+1));render(0);closeAll();$("page").focus({preventScroll:true})}

function progress(){
  var h=document.documentElement.scrollHeight-innerHeight;
  var p=h>0?Math.min(100,Math.max(0,scrollY/h*100)):100;
  var total=(S.ch+p/100)/CH.length*100;
  $("prog").style.width=p+"%";$("prog").setAttribute("aria-valuenow",Math.round(p));
  $("pct").textContent=Math.round(total)+"%";
}
var lastY=0,tick;
addEventListener("scroll",function(){
  progress();
  clearTimeout(tick);tick=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify({ch:S.ch,y:Math.round(scrollY)}))}catch(e){}},300);
},{passive:true});

/* mục lục */
$("tocList").innerHTML=CH.map(function(c,i){return '<li><a href="#ch'+(i+1)+'" data-go="'+i+'"><span>'+(i+1)+'</span>'+c.t+'</a></li>'}).join("");
document.addEventListener("click",function(e){var a=e.target.closest("[data-go]");if(a){e.preventDefault();go(+a.getAttribute("data-go"))}});

function closeAll(){["toc","set"].forEach(function(i){$(i).classList.remove("on");$(i).setAttribute("aria-hidden","true")});$("scrim").classList.remove("on");$("openToc").setAttribute("aria-expanded","false");$("openSet").setAttribute("aria-expanded","false")}
function open(id,btn,scrim){var on=$(id).classList.contains("on");closeAll();if(!on){$(id).classList.add("on");$(id).setAttribute("aria-hidden","false");$(btn).setAttribute("aria-expanded","true");if(scrim)$("scrim").classList.add("on")}}
$("openToc").onclick=function(){open("toc","openToc",true)};
$("openSet").onclick=function(){open("set","openSet",false)};
$("scrim").onclick=closeAll;

/* tùy chỉnh */
$("fsUp").onclick=function(){S.fs=Math.min(30,S.fs+1);save();applyPrefs()};
$("fsDown").onclick=function(){S.fs=Math.max(15,S.fs-1);save();applyPrefs()};
function seg(id,key,num){$(id).addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var v=b.getAttribute("data-v");S[key]=num?parseFloat(v):v;save();applyPrefs()})}
seg("wSeg","w",true);seg("lhSeg","lh",true);seg("thSeg","theme");

/* phím tắt: ←/→ chương, T mục lục, Esc đóng */
addEventListener("keydown",function(e){
  if(e.target.closest("input,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Escape")closeAll();
  else if(e.key==="ArrowRight"&&S.ch<CH.length-1)go(S.ch+1);
  else if(e.key==="ArrowLeft"&&S.ch>0)go(S.ch-1);
  else if(e.key==="t"||e.key==="T")$("openToc").click();
});

if(BOOK.source)$("srcLink").href=BOOK.source;else $("srcLink").style.display="none";
applyPrefs();render(savedY);
</script>
</body>
</html>
