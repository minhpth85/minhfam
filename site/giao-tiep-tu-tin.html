<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nếu bạn hay đắn đo nên nói gì trước người khác, hãy đọc cuốn sách này · Đọc sách · Minh Fam</title>
<meta name="description" content="Cẩm nang giao tiếp tự tin &amp; ứng biến tự nhiên trước mọi người. Đúc kết từ Vinh Giang &amp; Mel Robbins.">
<link rel="icon" type="image/png" href="anh/logo.png">
<link rel="apple-touch-icon" href="anh/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try{var s=JSON.parse(localStorage.getItem('reader')||'{}');var d=document.documentElement;
var t=localStorage.getItem('theme');if(s.theme!=='sepia'&&(t==='dark'||t==='light'))s.theme=t;if(s.theme)d.setAttribute('data-theme',s.theme);window.__theme0=s.theme||null;}catch(e){}
</script>
<style>
:root{
  /* Minh Fam design system (xem site/minhfam.css). Tên biến rút gọn cho trang đọc. */
  --bg:#fbfaf5; --panel:#ffffff; --text:#1f2a22; --strong:#171c18; --muted:#505e4f;
  --line:#e1eae5; --brand:#32854d; --brand-strong:#317345; --on-brand:#ffffff; --chip:#ebf6ee; --note:#ebf6ee; --note-fg:#317345;
  --rule:#4a9b60; --hl:#f6e3a4; --accent:#c2923d; --accent-text:#8a6421; --danger:#c2412f; --bar:rgba(251,250,245,.92);
  --fh:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --fb:"Spectral",Georgia,"Times New Roman",serif;
  --fs:21px; --lh:1.63; --measure:680px; --ff:var(--fb);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --bg:#0f1a12; --panel:#18291c; --text:#cbd5cc; --strong:#eef3ee; --muted:#9aa89b;
  --line:#2a3d2e; --brand:#4fb06c; --brand-strong:#6cc487; --on-brand:#0f1a12; --chip:#1f3a26; --note:#1f3a26; --note-fg:#6cc487; --rule:#6cc487; --hl:#5b4a1a; --accent:#d9a85a; --accent-text:#e3bc77; --danger:#f07a68; --bar:rgba(15,26,18,.92); color-scheme:dark}}
:root[data-theme="sepia"]{
  --bg:#f4ecd8; --accent:#b8822f; --accent-text:#7a5c2e; --danger:#b03a2a; --on-brand:#fbf5e4; --rule:#7a5c2e;  --panel:#fbf5e4; --text:#3b3226; --strong:#2a2218; --muted:#6b5d49;
  --line:#e0d4b8; --brand:#7a5c2e; --brand-strong:#6a4e24; --chip:#ece0c2; --note:#efe2bf; --note-fg:#7a5c2e; --hl:#e8d08a; --bar:rgba(244,236,216,.92)}
:root[data-theme="dark"]{
  --bg:#0f1a12; --panel:#18291c; --text:#cbd5cc; --strong:#eef3ee; --muted:#9aa89b;
  --line:#2a3d2e; --brand:#4fb06c; --brand-strong:#6cc487; --on-brand:#0f1a12; --chip:#1f3a26; --note:#1f3a26; --note-fg:#6cc487; --rule:#6cc487; --hl:#5b4a1a; --accent:#d9a85a; --accent-text:#e3bc77; --danger:#f07a68; --bar:rgba(15,26,18,.92); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

/* thanh tiến độ */
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--brand);z-index:50}

/* thanh công cụ: cố định ở trên cùng khi cuộn */
.bar{position:fixed;top:0;left:0;right:0;z-index:40;height:56px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;transition:transform .25s}
.bar.hide{transform:translateY(-100%)}
.bar .l,.bar .r{display:flex;align-items:center;gap:6px}
.bar .t{font:600 14px/20px var(--fh);color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--fh);color:var(--muted);text-decoration:none}
.ib:hover{border-color:var(--line);color:var(--strong)}

/* bài đọc */
main{padding:96px 20px 40px}
article{max-width:var(--measure);margin:0 auto;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);hyphens:manual}
.kicker{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong);margin:0 0 14px}
article h1{font:600 clamp(32px,6vw,44px)/1.14 var(--fb);letter-spacing:-.015em;color:var(--strong);margin:0 0 28px}
article h2{font:600 1.35em/1.25 var(--fb);letter-spacing:-.01em;color:var(--strong);margin:2.2em 0 .6em}
article p{margin:0 0 1.2em}
article p.first::first-letter{font:600 3.4em/.9 var(--fb);float:left;margin:.08em .12em 0 0;color:var(--brand-strong)}
article blockquote{margin:1.8em 0;padding:0 0 0 24px;border-left:3px solid var(--rule);font:italic 400 1.3em/1.4 var(--fb);color:var(--strong)}
article .note{margin:1.8em 0;padding:1.1em 1.3em;background:var(--note);border-radius:20px;font-size:.88em;line-height:1.6}
article .note b{display:block;font:600 .78em/1 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--note-fg);margin-bottom:.5em}
article ul{padding-left:1.2em;margin:0 0 1.2em}
article li{margin-bottom:.5em}
article figure{margin:2em 0;text-align:center}
article figure img{width:100%;height:auto;border-radius:20px;box-shadow:0 1px 2px rgba(23,48,29,.06)}
article figure.wide{margin-left:calc(50% - min(50vw - 20px, 24rem));margin-right:calc(50% - min(50vw - 20px, 24rem))}
article figcaption{margin-top:.7em;font:500 .7em/1.5 var(--fh);color:var(--muted)}
article hr{border:0;text-align:center;margin:2.2em 0;color:var(--muted)}
article hr::before{content:"· · ·";letter-spacing:.6em}

/* ---- minh họa SVG ---- */
article figure.svgfig{margin:2.2em auto;text-align:center}
article figure.svgfig svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.svgfig text{font-family:var(--fh);fill:var(--strong)}
.svgfig .m{fill:var(--muted)}
.svgfig .b{font-weight:600}
.svgfig .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.svgfig .chip{fill:var(--chip)}
.svgfig .brand{fill:var(--brand)}
.svgfig .on{fill:var(--on-brand)}
.svgfig .line{stroke:var(--line);stroke-width:2;fill:none}
.svgfig .dash{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6;fill:none}
.svgfig .arrow{stroke:var(--muted);stroke-width:2;fill:none}
.svgfig text.on{fill:var(--on-brand)}
.svgfig text.m{fill:var(--muted)}
.svgfig g.on text,.svgfig g.on{fill:var(--on-brand)}
.svgfig g.m{fill:var(--muted)}

/* ---- bảng ---- */
.tbl{margin:2em 0}
.tbl.wide{margin-left:calc(50% - min(50vw - 16px, 31rem));margin-right:calc(50% - min(50vw - 16px, 31rem))}
.tbl table{width:100%;border-collapse:separate;border-spacing:0;font-size:.82em;line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tbl th{font:600 .78em/1.3 var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px 16px;background:var(--chip)}
.tbl td{padding:14px 16px;vertical-align:top;border-top:1px solid var(--line)}
.tbl td:first-child{font-weight:600;color:var(--strong)}
.tbl td small{display:block;font:500 .8em/1.4 var(--fh);color:var(--muted);margin-top:2px}
.tbl td b{color:var(--strong)}
.zone{display:flex;align-items:center;gap:8px;font:600 1em/1.2 var(--fh);color:var(--strong)}
.zone::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--zc)}
.zone.g{--zc:var(--brand)}.zone.y{--zc:var(--accent)}.zone.r{--zc:var(--danger)}
.zsub{font:500 .8em/1.4 var(--fh);color:var(--muted);margin-top:4px;font-weight:500}

/* ---- tình huống thực tế ---- */
.case{margin:1.6em 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;font-size:.9em;line-height:1.55}
.case-h{padding:16px 20px;background:var(--chip)}
.case-h span{display:block;font:600 11px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-strong)}
.case-h h3{font:600 1.15em/1.3 var(--fb);color:var(--strong);margin:2px 0 0}
.case dl{margin:0;padding:4px 20px 18px}
.case dt{font:600 11px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.case dt small{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;margin-top:1px}
.case dt.res{color:var(--brand-strong)}
.case dd{margin:3px 0 0}

/* ---- bài tập cuối chương ---- */
.exercise{margin:2.2em 0;padding:1.4em 1.5em;background:var(--note);border-radius:20px;font-size:.92em;line-height:1.6}
.exercise>b{display:block;font:600 .78em/1 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--note-fg);margin-bottom:.6em}
.exercise h3{font:600 1.25em/1.3 var(--fb);color:var(--strong);margin:0 0 .6em}
.exercise p{margin:0 0 1em}
.exercise ol{counter-reset:e;list-style:none;padding:0;margin:0}
.exercise ol>li{counter-increment:e;position:relative;padding-left:44px;margin:0 0 .9em}
.exercise ol>li:last-child{margin-bottom:0}
.exercise ol>li::before{content:counter(e);position:absolute;left:0;top:.1em;width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:600 14px/1 var(--fh)}
article ul ul{margin:.5em 0 0}
@media (max-width:700px){
  .tbl.wide{margin-left:0;margin-right:0}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl thead{display:none}
  .tbl table{border:0;background:none;border-radius:0;overflow:visible}
  .tbl tr{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
  .tbl td{border-top:0;padding:10px 16px}
  .tbl td::before{content:attr(data-label);display:block;font:600 11px/1.3 var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .tbl td:first-child{background:var(--chip);padding-top:12px;padding-bottom:12px}
  .tbl td:first-child::before{display:none}
}


/* ---- trang bìa trong chương mở đầu, phương trình, ô đánh dấu ---- */
.bookhead{margin:0 0 2.2em;padding:1.3em 1.5em;background:var(--note);border-radius:20px}
.bookhead b{display:block;font:600 1.15em/1.35 var(--fb);color:var(--strong)}
.bookhead span{display:block;font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--note-fg);margin-top:8px}
.bookhead small{display:block;font:400 .85em/1.5 var(--fb);color:var(--muted);margin-top:8px}
.eq{margin:1.6em 0}
.eq-row{display:flex;align-items:stretch;justify-content:center;gap:10px;flex-wrap:wrap}
.eq-row i{align-self:center;font:600 1.5em/1 var(--fh);color:var(--muted);font-style:normal}
.eq-box{flex:1 1 150px;max-width:190px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 10px}
.eq-box b{display:block;font:600 1.9em/1.1 var(--fb);color:var(--strong)}
.eq-box span{display:block;font:500 12px/1.4 var(--fh);color:var(--muted);margin-top:6px}
.eq-box.res{background:var(--chip);border-color:transparent}
.eq-box.res b{color:var(--danger)}
.tbl.week td:first-child{white-space:nowrap}
.chk{display:inline-block;width:20px;height:20px;border:2px solid var(--brand);border-radius:6px;vertical-align:middle}
.tbl td .chk{margin-top:2px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:2em 0 0}
.sign div{border-bottom:1.5px solid var(--line);height:44px;position:relative}
.sign span{position:absolute;left:0;bottom:-24px;font:500 12px/16px var(--fh);color:var(--muted)}
@media (max-width:700px){.sign{grid-template-columns:1fr;gap:34px}}

/* cuối chương */
.pager{max-width:var(--measure);margin:56px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-decoration:none;color:var(--text);font-family:var(--fh)}
.pager a:hover{border-color:var(--brand)}
.pager small{display:block;font:600 11px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager strong{display:block;font:600 17px/24px var(--fb);color:var(--strong)}
.pager .next{text-align:right;grid-column:2}
.pager .prev{grid-column:1}
.end{max-width:var(--measure);margin:24px auto 0;text-align:center;font:500 14px/20px var(--fh);color:var(--muted)}

/* ngăn mục lục / cài đặt */
.scrim{position:fixed;inset:0;background:rgba(15,26,18,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px rgba(23,48,29,.18);transition:transform .25s;font-family:var(--fh)}
#toc{top:0;bottom:0;left:0;width:min(360px,88vw);transform:translateX(-102%);overflow:auto;padding:20px;border-radius:0 20px 20px 0}
#toc.on{transform:none}
#set{top:64px;right:12px;width:min(340px,calc(100vw - 24px));padding:20px;border-radius:20px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#set.on{transform:none;opacity:1;pointer-events:auto}
.sheet h3{margin:0 0 14px;font:600 23px/30px var(--fb);color:var(--strong)}
.toc-book{font:600 12px/16px var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#toc ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
#toc a{display:flex;gap:12px;align-items:baseline;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--text);font:500 15px/22px var(--fh)}
#toc a span{flex:none;width:22px;color:var(--muted);font-weight:600}
#toc a:hover{background:var(--chip)}
#toc a[aria-current="true"]{background:var(--chip);color:var(--brand-strong);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.row>label,.row>span{font:600 13px/18px var(--fh);color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font:600 13px var(--fh);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--brand-strong)}
.seg .fsval{display:grid;place-items:center;min-width:44px;padding:0 8px;border-left:1px solid var(--line);border-right:1px solid var(--line);font:600 13px var(--fh);color:var(--strong)}
.themes{display:flex;gap:8px}
.themes button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.themes button[aria-pressed="true"]{border-color:var(--brand)}

@media (max-width:640px){
  :root{--fs:20px}
  main{padding:88px 18px 32px}
  .pager{grid-template-columns:1fr}.pager .next,.pager .prev{grid-column:1}.pager .next{text-align:left}
  .bar .t{display:none}
}
@media print{.bar,#prog,.pager,.scrim,.sheet{display:none}main{padding:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div id="prog" role="progressbar" aria-label="Tiến độ đọc" aria-valuemin="0" aria-valuemax="100"></div>

<div class="bar" id="bar">
  <div class="l">
    <a class="ib" href="thu-vien.html" aria-label="Về Thư viện">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <button class="ib" id="openToc" type="button" aria-label="Mở mục lục" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Mục lục</span>
    </button>
  </div>
  <div class="t" id="barTitle"></div>
  <div class="r">
    <span class="ib" id="pct" style="cursor:default;border-color:transparent">0%</span>
    <button class="ib" id="themeQuick" type="button" aria-label="Chuyển nền sáng/tối"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ib" id="openSet" type="button" aria-label="Tùy chỉnh chữ và nền" aria-expanded="false">
      <span style="font-family:var(--fb);font-weight:600;font-size:17px">Aa</span>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<nav class="sheet" id="toc" aria-label="Mục lục" aria-hidden="true">
  <div class="toc-book">Cẩm nang giao tiếp tự tin</div>
  <h3>Mục lục</h3>
  <ol id="tocList"></ol>
</nav>

<div class="sheet" id="set" role="dialog" aria-label="Tùy chỉnh đọc" aria-hidden="true">
  <h3>Tùy chỉnh đọc</h3>
  <div class="row"><span>Cỡ chữ</span>
    <div class="seg"><button type="button" id="fsDown" aria-label="Giảm cỡ chữ">A−</button><span class="fsval" id="fsVal" aria-live="polite"></span><button type="button" id="fsUp" aria-label="Tăng cỡ chữ">A+</button></div></div>
  <div class="row"><span>Độ rộng dòng</span>
    <div class="seg" id="wSeg"><button type="button" data-v="600">Hẹp</button><button type="button" data-v="680">Vừa</button><button type="button" data-v="760">Rộng</button></div></div>
  <div class="row"><span>Giãn dòng</span>
    <div class="seg" id="lhSeg"><button type="button" data-v="1.5">Chặt</button><button type="button" data-v="1.63">Vừa</button><button type="button" data-v="1.85">Thoáng</button></div></div>
  <div class="row" style="margin-bottom:0"><span>Nền</span>
    <div class="themes" id="thSeg">
      <button type="button" data-v="light" aria-label="Nền sáng" style="background:#fbfaf5"></button>
      <button type="button" data-v="sepia" aria-label="Nền giấy ngả vàng" style="background:#f4ecd8"></button>
      <button type="button" data-v="dark" aria-label="Nền tối" style="background:#0f1a12"></button>
    </div></div>
</div>

<main>
  <article id="page" tabindex="-1"></article>
  <div class="pager" id="pager"></div>
  <p class="end" id="end"></p>
</main>

<script>
/* ===== NỘI DUNG SÁCH — sửa mảng này để đổi chương =====
   body là HTML đơn giản: <p>, <h2>, <blockquote>, <ul>, <hr>, <div class="note"><b>Nhãn</b>…</div>
   Đây là bản ghi chú đọc viết bằng lời mới, không phải nguyên văn sách. */
var BOOK={title:"Cẩm nang giao tiếp tự tin",author:"Minh Fam"};
var CH=[
{
"k": "Lời mở đầu",
"n": "·",
"t": "Vì sao kỹ năng giao tiếp quyết định cách thế giới nhìn nhận bạn?",
"body": "<div class=\"bookhead\"><b>Cẩm nang giao tiếp tự tin &amp; ứng biến tự nhiên trước mọi người</b><span>Đúc kết từ Vinh Giang &amp; Mel Robbins</span><small>Đúc kết chi tiết từ hai tập đối thoại và huấn luyện trực tiếp giữa chuyên gia giao tiếp Vinh Giang và Mel Robbins</small></div><h2>Câu chuyện của Vinh Giang</h2><p class=\"first\">Vinh Giang sinh ra trong một gia đình tị nạn gốc Việt tại Úc. Tiếng Anh là ngôn ngữ thứ ba của anh, và anh chỉ bắt đầu học nó một cách nghiêm túc khi bước vào đầu tuổi thiếu niên. Lớn lên, anh theo đuổi đam mê ảo thuật và trở thành một ảo thuật gia sở hữu kỹ thuật tay nghề xuất sắc. Tuy nhiên, dù kỹ thuật có điêu luyện đến đâu, anh vẫn cảm thấy mình vô hình trong mắt khán giả và giới chuyên môn.</p><p>Lý do không nằm ở đôi tay, mà nằm ở sự thiếu hụt kỹ năng trình diễn và khả năng giao tiếp. Sự nhận thức này đã hoàn toàn thay đổi cuộc đời anh, biến một ảo thuật gia thầm lặng trở thành một trong những chuyên gia huấn luyện giao tiếp hàng đầu thế giới.</p><h3>Phương trình nhận thức về giá trị bản thân</h3><div class=\"eq\"><div class=\"eq-row\"><div class=\"eq-box\"><b>10/10</b><span>Năng lực chuyên môn</span></div><i>+</i><div class=\"eq-box\"><b>3/10</b><span>Kỹ năng giao tiếp</span></div><i>=</i><div class=\"eq-box res\"><b>3/10</b><span>Giá trị được thế giới công nhận</span></div></div></div><blockquote>Bạn không được định giá bởi những gì bạn biết hay năng lực thực sự bạn có. Bạn chỉ giỏi ngang với khả năng bạn giao tiếp về nó.</blockquote><h2>Ký ức về chiếc giàn khoan dầu: bài học sinh tồn về sự kết nối</h2><p>Trong hành trình vượt biển của gia đình Vinh Giang, có một khoảnh khắc định mệnh đã khắc sâu vào tâm trí anh bài học lớn nhất về giao tiếp. Khi chiếc thuyền nhỏ của gia đình chao đảo giữa đại dương, họ tiếp cận một giàn khoan dầu lớn. Không ai trên thuyền biết tiếng Anh hay ngôn ngữ của những người thủy thủ trên giàn khoan.</p><p>Thế nhưng, sự sống sót của cả gia đình đã được quyết định không phải bằng từ ngữ, mà bằng ngôn ngữ phi ngôn từ: ánh mắt cầu cứu chân thành, sự khẩn thiết trong âm điệu giọng nói, cử chỉ giơ cao đứa trẻ nhỏ và lòng trắc ẩn chạm đến trái tim đối phương.</p><p>Bài học rút ra rất rõ ràng: <b>giao tiếp chưa bao giờ chỉ là từ ngữ. Giao tiếp là sự kết nối, là âm điệu, là ánh mắt, là năng lượng truyền tải để xóa bỏ mọi khoảng cách.</b></p><h2>Thông điệp cốt lõi</h2><p>Giao tiếp không phải là một năng khiếu bẩm sinh hay đặc quyền dành riêng cho những người hướng ngoại. Giao tiếp là một <b>chuỗi các hành vi và kỹ năng có thể học tập, rèn luyện và làm chủ được</b>.</p><p>Đừng tự dán nhãn bản thân là vụng ăn nói hay hướng nội nên không thể nói hay. Đừng bám chấp vào con người hiện tại mà tước đi cơ hội phát triển của phiên bản tương lai.</p>"
},
{
"k": "Chương 1 / 6",
"n": 1,
"t": "Thanh lọc tạp âm và chấm dứt thói quen nói lan man",
"body": "<h2>1.1. Xử lý từ đệm và phi ngôn từ</h2><p class=\"first\">Để lời nói có trọng lượng, bước đầu tiên là phải loại bỏ những tạp âm đang làm suy yếu thông điệp của bạn.</p><h3>Phân biệt hai loại tạp âm</h3><ul><li><b>Phi ngôn từ:</b> các âm thanh vô nghĩa phát ra khi não đang suy nghĩ: <i>ừm</i>, <i>à</i>, <i>ờ</i>, tiếng chép miệng, tiếng thở dài.</li><li><b>Từ đệm:</b> các từ ngữ có nghĩa nhưng bị sử dụng lặp đi lặp lại vô chức năng: <i>kiểu như</i>, <i>thực ra là</i>, <i>bạn hiểu ý tôi chứ?</i>, <i>nói chung là</i>.</li></ul><figure class=\"svgfig\"><svg viewBox=\"0 0 480 190\" role=\"img\" aria-label=\"Hai hàng ba khối: tiếng đệm dẫn đến giảm tín nhiệm, khoảng lặng dẫn đến uy nghiêm\"><defs><marker id=\"a1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L7 4L0 8z\" style=\"fill:var(--muted)\"/></marker></defs>\n<rect x=\"6\" y=\"12\" width=\"148\" height=\"62\" rx=\"14\" class=\"panel\"/><rect x=\"166\" y=\"12\" width=\"148\" height=\"62\" rx=\"14\" class=\"panel\"/><rect x=\"326\" y=\"12\" width=\"148\" height=\"62\" rx=\"14\" class=\"panel\"/>\n<path d=\"M155 43h10\" class=\"arrow\" marker-end=\"url(#a1)\"/><path d=\"M315 43h10\" class=\"arrow\" marker-end=\"url(#a1)\"/>\n<g font-size=\"13\" text-anchor=\"middle\"><text x=\"80\" y=\"38\" class=\"b\">Ừm, à vô thức</text><text x=\"80\" y=\"58\" class=\"m\" font-size=\"12\">tiếng đệm tự phát</text>\n<text x=\"240\" y=\"38\" class=\"b\">Nhòe thông điệp</text><text x=\"240\" y=\"58\" class=\"m\" font-size=\"12\">người nghe loãng ý</text>\n<text x=\"400\" y=\"38\" class=\"b\">Giảm tín nhiệm</text><text x=\"400\" y=\"58\" class=\"m\" font-size=\"12\">thiếu trọng lượng</text></g>\n<path d=\"M80 80v28\" class=\"arrow\" marker-end=\"url(#a1)\"/><path d=\"M400 80v28\" class=\"arrow\" marker-end=\"url(#a1)\"/>\n<text x=\"240\" y=\"100\" text-anchor=\"middle\" class=\"m\" font-size=\"13\">thay bằng khoảng lặng</text>\n<rect x=\"6\" y=\"116\" width=\"148\" height=\"62\" rx=\"14\" class=\"chip\"/><rect x=\"166\" y=\"116\" width=\"148\" height=\"62\" rx=\"14\" class=\"chip\"/><rect x=\"326\" y=\"116\" width=\"148\" height=\"62\" rx=\"14\" class=\"chip\"/>\n<path d=\"M155 147h10\" class=\"arrow\" marker-end=\"url(#a1)\"/><path d=\"M315 147h10\" class=\"arrow\" marker-end=\"url(#a1)\"/>\n<g font-size=\"13\" text-anchor=\"middle\"><text x=\"80\" y=\"142\" class=\"b\" style=\"fill:var(--brand-strong)\">Khoảng lặng</text><text x=\"80\" y=\"162\" class=\"m\" font-size=\"12\">2 đến 3 giây</text>\n<text x=\"240\" y=\"142\" class=\"b\" style=\"fill:var(--brand-strong)\">Tạo uy nghiêm</text><text x=\"240\" y=\"162\" class=\"m\" font-size=\"12\">lời nói có sức nặng</text>\n<text x=\"400\" y=\"142\" class=\"b\" style=\"fill:var(--brand-strong)\">Giữ chiều sâu</text><text x=\"400\" y=\"162\" class=\"m\" font-size=\"12\">ý nghĩ trọn vẹn</text></g>\n</svg><figcaption>Một khoảng lặng ngắn thay cho một tiếng ừm: cùng thời gian, nhưng hiệu ứng hoàn toàn khác.</figcaption></figure><h3>Quy trình 3 bước loại bỏ từ đệm</h3><ol><li><b>Bước 1: Đưa từ vô thức vào vùng ý thức.</b> Cách 1: nhờ đồng nghiệp hoặc bạn bè vỗ tay nhẹ mỗi khi bạn phát ra từ đệm trong lúc nói chuyện. Cách 2: quay một video nói chuyện dài 5 phút, xuất file ghi âm thành văn bản hoặc dùng AI để kiểm kê chính xác số lượng từ đệm bạn đã dùng.</li><li><b>Bước 2: Nhận diện điểm kích hoạt.</b> Nhận biết thời điểm từ đệm thường xuất hiện: khi chuyển tiếp ở cuối câu; khi não đang tìm kiếm ý tiếp theo; khi hồi hộp trước cấp trên hoặc đám đông; khi cảm thấy sợ khoảng lặng trong giao tiếp.</li><li><b>Bước 3: Thay thế bằng khoảng lặng và giảm tốc độ nói.</b> Chấp nhận cảm giác sượng và ngượng ngùng ban đầu. Cảm giác trống trải khi giữ im lặng chính là cái giá bắt buộc phải trả để nâng cấp sự tinh tế trong lời nói.</li></ol><hr><h2>1.2. Chấm dứt tật nói lan man và tư duy bằng lời nói</h2><h3>Nguyên nhân gốc rễ</h3><p>Tật nói lan man xuất phát từ lầm tưởng rằng: <i>nói càng nhiều thông tin thì càng thể hiện mình biết nhiều và trao nhiều giá trị</i>. Thực tế hoàn toàn ngược lại. Người nghe không cần toàn bộ dữ liệu thô trong đầu bạn; họ cần sự chắt lọc tinh túy.</p><h3>Giải pháp cốt lõi: bắt đầu từ điểm kết thúc</h3><p>Trước khi mở lời, hãy xác định rõ <b>một thông điệp cốt lõi duy nhất</b> bạn muốn người nghe ghi nhớ. Khi đã có điểm đích, mọi câu từ sẽ tự động xoay quanh quỹ đạo đó.</p><div class=\"note\"><b>Lời khuyên cho người tư duy bằng lời nói</b>Nếu bạn là người phải nói ra mới suy nghĩ được, hãy tập thói quen <b>nói thành tiếng một mình</b> ở nơi riêng tư để sắp xếp và lọc ý tưởng trước khi bước vào các cuộc họp quan trọng. Không nhất thiết phải biến đối phương thành bảng nháp cho quá trình suy nghĩ của bạn.</div>"
},
{
"k": "Chương 2 / 6",
"n": 2,
"t": "Ba khung tư duy ứng biến tức thì khi bị hỏi bất ngờ",
"body": "<p class=\"first\">Khi rơi vào thế bị động hoặc nhận được câu hỏi đột ngột, bộ não thường rơi vào hai trạng thái tiêu cực: <b>đứng hình</b> hoặc <b>nói xối xả lan man</b>. Lý do là bộ não thiếu cấu trúc giới hạn.</p><h2>2.1. Công thức 3-2-1: tạo khung giới hạn cho tư duy</h2><p>Khi bị hỏi bất ngờ, hãy lập tức chọn <b>một</b> trong ba chiếc hộp dưới đây để định hình câu trả lời.</p><figure class=\"svgfig\"><svg viewBox=\"0 0 480 172\" role=\"img\" aria-label=\"Ba thẻ đánh số 3, 2, 1 tương ứng ba khung trả lời\">\n<g>\n<rect x=\"10\" y=\"10\" width=\"140\" height=\"150\" rx=\"18\" class=\"panel\"/><rect x=\"170\" y=\"10\" width=\"140\" height=\"150\" rx=\"18\" class=\"panel\"/><rect x=\"330\" y=\"10\" width=\"140\" height=\"150\" rx=\"18\" class=\"panel\"/>\n<circle cx=\"80\" cy=\"52\" r=\"22\" class=\"brand\"/><circle cx=\"240\" cy=\"52\" r=\"22\" class=\"brand\"/><circle cx=\"400\" cy=\"52\" r=\"22\" class=\"brand\"/>\n<g class=\"on\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--on-brand)\"><text x=\"80\" y=\"60\">3</text><text x=\"240\" y=\"60\">2</text><text x=\"400\" y=\"60\">1</text></g>\n<g text-anchor=\"middle\" font-size=\"15\"><text x=\"80\" y=\"104\" class=\"b\">Ba bước</text><text x=\"80\" y=\"126\" class=\"m\" font-size=\"13\">trình tự 1, 2, 3</text><text x=\"80\" y=\"144\" class=\"m\" font-size=\"13\">cho một quy trình</text>\n<text x=\"240\" y=\"104\" class=\"b\">Hai loại</text><text x=\"240\" y=\"126\" class=\"m\" font-size=\"13\">hai nhóm đối lập</text><text x=\"240\" y=\"144\" class=\"m\" font-size=\"13\">hoặc song song</text>\n<text x=\"400\" y=\"104\" class=\"b\">Một điều cốt lõi</text><text x=\"400\" y=\"126\" class=\"m\" font-size=\"13\">đúng một ý</text><text x=\"400\" y=\"144\" class=\"m\" font-size=\"13\">quan trọng nhất</text></g>\n</g>\n</svg><figcaption>Ba chiếc hộp để chọn khi bị hỏi bất ngờ: chọn một, rồi đổ câu trả lời vào đó.</figcaption></figure><ul><li><b>Khung 3 bước:</b> chia câu trả lời thành trình tự 1, 2, 3. <i>Ví dụ: Để cải thiện quy trình này, chúng ta cần 3 bước: đầu tiên là chuẩn bị dữ liệu, thứ hai là thử nghiệm quy mô nhỏ, và thứ ba là đánh giá kết quả.</i></li><li><b>Khung 2 loại:</b> phân chia vấn đề thành 2 nhóm đối lập hoặc song song. <i>Ví dụ: Về vấn đề này, tôi thấy có 2 khía cạnh cần xem xét: một là về mặt kỹ thuật, và hai là về mặt trải nghiệm người dùng.</i></li><li><b>Khung 1 điều cốt lõi:</b> tập trung vào đúng một ý quan trọng nhất. <i>Ví dụ: Nếu chỉ được chọn một điều quan trọng nhất lúc này, tôi tin đó chính là sự tập trung vào tiến độ.</i></li></ul><hr><h2>2.2. Quy trình 3 bước xử lý câu hỏi khó</h2><p>Dành cho lúc bạn chưa biết trả lời ngay.</p><figure class=\"svgfig\"><svg viewBox=\"0 0 480 116\" role=\"img\" aria-label=\"Ba khối nối nhau bằng mũi tên: nghỉ, hỏi làm rõ, trả lời chậm rãi\"><defs><marker id=\"a2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L7 4L0 8z\" style=\"fill:var(--muted)\"/></marker></defs>\n<rect x=\"10\" y=\"12\" width=\"130\" height=\"92\" rx=\"16\" class=\"panel\"/><rect x=\"175\" y=\"12\" width=\"130\" height=\"92\" rx=\"16\" class=\"panel\"/><rect x=\"340\" y=\"12\" width=\"130\" height=\"92\" rx=\"16\" class=\"chip\"/>\n<path d=\"M142 58h30\" class=\"arrow\" marker-end=\"url(#a2)\"/><path d=\"M307 58h30\" class=\"arrow\" marker-end=\"url(#a2)\"/>\n<circle cx=\"35\" cy=\"34\" r=\"13\" class=\"brand\"/><circle cx=\"200\" cy=\"34\" r=\"13\" class=\"brand\"/><circle cx=\"365\" cy=\"34\" r=\"13\" class=\"brand\"/>\n<g class=\"on\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\" style=\"fill:var(--on-brand)\"><text x=\"35\" y=\"39\">1</text><text x=\"200\" y=\"39\">2</text><text x=\"365\" y=\"39\">3</text></g>\n<g text-anchor=\"middle\" font-size=\"14\"><text x=\"75\" y=\"70\" class=\"b\">Nghỉ 3 đến 5 giây</text><text x=\"75\" y=\"90\" class=\"m\" font-size=\"13\">điềm tĩnh, tôn trọng</text>\n<text x=\"240\" y=\"70\" class=\"b\">Hỏi làm rõ</text><text x=\"240\" y=\"90\" class=\"m\" font-size=\"13\">thu hẹp phạm vi</text>\n<text x=\"405\" y=\"70\" class=\"b\">Trả lời chậm rãi</text><text x=\"405\" y=\"90\" class=\"m\" font-size=\"13\">giữ tông giọng ổn</text></g>\n</svg><figcaption>Ba bước khi chưa biết trả lời ngay: dừng, làm rõ, rồi mới nói.</figcaption></figure><ol><li><b>Bước 1: Ngừng lại 3 đến 5 giây.</b> Việc dừng lại không thể hiện sự yếu kém, mà thể hiện sự điềm tĩnh và sự tôn trọng đối với câu hỏi của người đối diện.</li><li><b>Bước 2: Đặt câu hỏi làm rõ.</b> Thu hẹp phạm vi của những câu hỏi quá chung chung để vừa mua thêm thời gian suy nghĩ, vừa đảm bảo trả lời trúng đích.</li><li><b>Bước 3: Trả lời với tốc độ chậm rãi.</b> Kiểm soát nhịp độ phát âm, giữ vững tông giọng bình ổn để duy trì phong thái tự tin.</li></ol><div class=\"note\"><b>Ví dụ cho bước 2</b>Nếu nhận được câu hỏi <i>Anh đánh giá thế nào về chiến dịch Marketing vừa qua?</i>, hãy làm rõ: <i>Ý anh là về khía cạnh hiệu quả chi phí quảng cáo, hay về mức độ tương tác nội dung trên nền tảng TikTok?</i></div>"
},
{
"k": "Chương 3 / 6",
"n": 3,
"t": "Tam giác diện mạo, cảm xúc, âm thanh",
"body": "<h2>Nguyên lý John Wooden</h2><p class=\"first\">Huấn luyện viên huyền thoại John Wooden từng nói: <i>nếu bạn quá tập trung vào những thứ không thể kiểm soát, bạn sẽ mất kiểm soát cả những thứ mình có thể kiểm soát.</i></p><p>Cảm xúc lo âu hay sự tự tin bên trong là thứ khó điều chỉnh ngay lập tức. Do đó, đừng ép bản thân phải cảm thấy tự tin. Thay vào đó, hãy tác động vào <b>diện mạo</b> và <b>âm thanh</b>, hai yếu tố hoàn toàn kiểm soát được, để kéo <b>cảm xúc</b> tự động đi lên.</p><figure class=\"svgfig\"><svg viewBox=\"0 0 480 236\" role=\"img\" aria-label=\"Hình tam giác: diện mạo và âm thanh ở hai đỉnh dưới đẩy cảm xúc ở đỉnh trên đi lên\"><defs><marker id=\"a3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L7 4L0 8z\" style=\"fill:var(--muted)\"/></marker></defs>\n<path d=\"M240 28L90 190H390Z\" class=\"chip\"/>\n<circle cx=\"240\" cy=\"40\" r=\"30\" class=\"brand\"/>\n<text x=\"240\" y=\"45\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" style=\"fill:var(--on-brand)\">Cảm xúc</text>\n<circle cx=\"90\" cy=\"190\" r=\"36\" class=\"panel\" style=\"stroke:var(--brand)\"/><circle cx=\"390\" cy=\"190\" r=\"36\" class=\"panel\" style=\"stroke:var(--brand)\"/>\n<text x=\"90\" y=\"195\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Diện mạo</text>\n<text x=\"390\" y=\"195\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Âm thanh</text>\n<path d=\"M112 164L204 66\" class=\"arrow\" marker-end=\"url(#a3)\"/><path d=\"M368 164L276 66\" class=\"arrow\" marker-end=\"url(#a3)\"/>\n<text x=\"240\" y=\"196\" text-anchor=\"middle\" class=\"m\" font-size=\"13\">hai yếu tố kiểm soát được</text>\n</svg><figcaption>Đừng ép mình phải thấy tự tin. Hãy chỉnh thứ chỉnh được, cảm xúc sẽ theo sau.</figcaption></figure><hr><h2>3.1. Giải phóng Adrenaline vật lý trước khi trình diễn</h2><h3>Tại sao giọng nói và cơ thể bạn bị run?</h3><p>Hiện tượng run giọng hay run tay chân xuất hiện khi cơ thể tiết ra quá nhiều <b>Adrenaline</b> do phản ứng chống trả hay bỏ chạy trước áp lực.</p><h3>Giải pháp giải phóng thể chất</h3><p>Trước khi lên sân khấu, thuyết trình hoặc bước vào cuộc họp quan trọng, hãy đốt cháy lượng Adrenaline dư thừa bằng các bài tập thể chất ngắn ở hậu trường hoặc bãi đỗ xe:</p><ul><li>Nhảy bật cóc 20 lần.</li><li>Chống đẩy 5 đến 10 lần.</li><li>Đi bộ nhanh hoặc dậm chân mạnh tại chỗ.</li></ul><p><i>Tác dụng:</i> hoạt động thể chất giúp đưa lượng Adrenaline dư thừa ra khỏi cơ thể, đưa nhịp tim và nhịp thở trở về trạng thái sâu và ổn định một cách tự nhiên.</p><hr><h2>3.2. Kiểm soát diện mạo</h2><h3>Loại bỏ cử chỉ phi chức năng</h3><p>Đây là những thói quen vô thức tố cáo sự thiếu tự tin của bạn:</p><ul><li>Đút tay vào túi quần và cử động các ngón tay liên tục.</li><li>Chống tay lên hông rồi đung đưa người sang hai bên.</li><li>Chắp hai tay lại như cầu nguyện và xoa tay liên tục.</li><li>Chắp tay sau lưng và đứng lắc lư.</li><li>Bắt chéo chân làm mất thăng bằng.</li><li>Đi đi lại lại vô định trên sân khấu.</li></ul><h3>Ba trụ cột của ngôn ngữ cơ thể tự tin</h3><div class=\"tbl \"><table><thead><tr><th>Yếu tố</th><th>Trạng thái cần đạt</th><th>Chi tiết thực hành</th></tr></thead><tbody><tr><td data-label=\"Yếu tố\">Tư thế <small>Posture</small></td><td data-label=\"Trạng thái cần đạt\">Vững chãi, cởi mở</td><td data-label=\"Chi tiết thực hành\">Đứng hai chân rộng bằng vai, mở rộng vai và hạ thấp ra sau, giữ đầu thẳng tự nhiên.</td></tr><tr><td data-label=\"Yếu tố\">Cử chỉ tay <small>Gestures</small></td><td data-label=\"Trạng thái cần đạt\">Định hình uy quyền và thân thiện</td><td data-label=\"Chi tiết thực hành\">Dùng hai động tác nền tảng của Virginia Satir: <b>lòng bàn tay ngửa</b> thể hiện sự cởi mở, thân thiện, mời gọi hợp tác; <b>lòng bàn tay úp</b> thể hiện sự quyết đoán, chắc chắn, tạo trọng lượng cho lời nói.</td></tr><tr><td data-label=\"Yếu tố\">Nụ cười <small>Facial</small></td><td data-label=\"Trạng thái cần đạt\">Tháo bỏ rào cản</td><td data-label=\"Chi tiết thực hành\">Chủ động mỉm cười nhẹ để hóa giải gương mặt lạnh lùng vô cảm, tạo năng lượng dễ tiếp cận.</td></tr></tbody></table></div><hr><h2>3.3. Kiểm soát âm thanh</h2><ul><li><b>Tăng âm lượng:</b> âm lượng quá nhỏ sẽ tự động thu hẹp ngôn ngữ cơ thể của bạn. Khi tăng âm lượng lên một mức vừa đủ, sự hiện diện của bạn sẽ tự động mở rộng.</li><li><b>Thêm giai điệu:</b> tránh cách nói đều đều. Lên bổng xuống trầm linh hoạt như đang viết một bản nhạc để truyền tải cảm xúc.</li><li><b>Tăng khoảng lặng:</b> khoảng lặng đúng lúc giúp tạo sự uy nghiêm, giúp người nghe kịp tiêu hóa thông tin và cho phép bạn lấy hơi sâu.</li></ul><div class=\"note\"><b>Thử nghiệm</b>Hãy thử nói câu <i>Tôi ổn</i> theo 3 thái độ khác nhau để thấy âm điệu thay đổi toàn bộ ý nghĩa câu nói.</div>"
},
{
"k": "Chương 4 / 6",
"n": 4,
"t": "Bốn hình mẫu giọng nói và nghệ thuật dẫn dắt người khác",
"body": "<p class=\"first\">Mỗi tình huống giao tiếp đòi hỏi một sắc thái giọng nói riêng biệt. Việc làm chủ 4 hình mẫu giọng nói giúp bạn linh hoạt điều chỉnh năng lượng để đạt mục tiêu giao tiếp.</p><h2>Bảng phân tích 4 hình mẫu giọng nói</h2><div class=\"tbl wide\"><table><thead><tr><th>Hình mẫu</th><th>Đặc điểm nhận diện</th><th>Mục tiêu sử dụng</th><th>Lưu ý ứng dụng</th></tr></thead><tbody><tr><td data-label=\"Hình mẫu\">1. Người bạn</td><td data-label=\"Đặc điểm nhận diện\">Tông giọng ấm áp, mềm mại, tốc độ vừa phải, ngữ điệu mang tính sẻ chia.</td><td data-label=\"Mục tiêu sử dụng\">Tạo sự kết nối, xây dựng thiện cảm và sự tin tưởng ban đầu.</td><td data-label=\"Lưu ý ứng dụng\">Nếu lạm dụng quá mức sẽ dễ bị coi thường, thiếu uy quyền và khó đưa ra chỉ đạo.</td></tr><tr><td data-label=\"Hình mẫu\">2. Người giáo dục</td><td data-label=\"Đặc điểm nhận diện\">Tông giọng rõ ràng, mạch lạc, nhấn giọng ở các từ khóa, nhịp điệu thong thả.</td><td data-label=\"Mục tiêu sử dụng\">Giải thích khái niệm, truyền đạt thông tin hoặc hướng dẫn quy trình.</td><td data-label=\"Lưu ý ứng dụng\">Tránh nói quá dài dòng khiến người nghe bị bội thực thông tin.</td></tr><tr><td data-label=\"Hình mẫu\">3. Người huấn luyện</td><td data-label=\"Đặc điểm nhận diện\">Tông giọng dứt khoát, dồn dập hơn, dùng cử chỉ bàn tay úp, âm lượng rõ.</td><td data-label=\"Mục tiêu sử dụng\">Chỉ đạo, dẫn dắt, ra quyết định và tạo cảm giác an toàn cho người khác.</td><td data-label=\"Lưu ý ứng dụng\"><b>Thang đo 0 đến 10:</b> không cần gắt gỏng ở mức 10/10. Chỉ cần duy trì năng lượng ở <b>mức 5 đến 7/10</b> kết hợp cử chỉ dứt khoát.</td></tr><tr><td data-label=\"Hình mẫu\">4. Người truyền cảm hứng</td><td data-label=\"Đặc điểm nhận diện\">Tông giọng sảng khoái, giàu năng lượng, âm lượng vang, kết hợp khoảng lặng đắt giá.</td><td data-label=\"Mục tiêu sử dụng\">Khơi dậy tầm nhìn, tạo động lực và thúc đẩy hành động quyết liệt.</td><td data-label=\"Lưu ý ứng dụng\">Cần xuất phát từ cảm xúc chân thành, tránh diễn xuất thái quá.</td></tr></tbody></table></div><figure class=\"svgfig\"><svg viewBox=\"0 0 480 134\" role=\"img\" aria-label=\"Thang từ 0 đến 10 với vùng khuyến nghị từ 5 đến 7 được khoanh lại\">\n<defs><linearGradient id=\"gs\" x1=\"0\" x2=\"1\"><stop offset=\"0\" style=\"stop-color:var(--chip)\"/><stop offset=\"1\" style=\"stop-color:var(--brand)\"/></linearGradient></defs>\n<rect x=\"20\" y=\"40\" width=\"440\" height=\"22\" rx=\"11\" fill=\"url(#gs)\"/>\n<rect x=\"240\" y=\"30\" width=\"88\" height=\"42\" rx=\"12\" style=\"fill:none;stroke:var(--strong);stroke-width:2.5\"/>\n<g font-size=\"13\" text-anchor=\"middle\" class=\"m\"><text x=\"20\" y=\"92\" text-anchor=\"start\">0</text><text x=\"240\" y=\"92\">5</text><text x=\"328\" y=\"92\">7</text><text x=\"460\" y=\"92\" text-anchor=\"end\">10</text></g>\n<text x=\"284\" y=\"20\" text-anchor=\"middle\" class=\"b\" font-size=\"14\">Vùng nên dùng: 5 đến 7</text>\n<text x=\"240\" y=\"122\" text-anchor=\"middle\" class=\"m\" font-size=\"13\">Không cần gắt gỏng ở mức 10. Năng lượng vừa đủ, cử chỉ dứt khoát.</text>\n</svg><figcaption>Thang năng lượng của Người huấn luyện: dứt khoát không có nghĩa là lớn tiếng.</figcaption></figure><hr><h2>Phương pháp rèn luyện giọng nói với âm nhạc</h2><p>Để loại bỏ giọng nói đều đều vô cảm, hãy áp dụng bài tập luyện giọng cùng âm nhạc:</p><ol><li><b>Bước 1:</b> bật một bản nhạc không lời, có giai điệu rõ ràng, lúc trầm lúc bổng.</li><li><b>Bước 2:</b> đọc một đoạn văn bản bất kỳ hoặc nói tự do theo đúng giai điệu của bản nhạc đó.</li><li><b>Bước 3:</b> luyện tập hạ thấp tông giọng ở cuối câu để tăng tính khẳng định, và nâng tông giọng khi cần tạo sự tò mò.</li></ol>"
},
{
"k": "Chương 5 / 6",
"n": 5,
"t": "Lắng nghe sâu, bỏ thói ngắt lời và hòa nhập đám đông",
"body": "<h2>5.1. Dành cho người hay cắt ngang lời người khác</h2><h3>Quy tắc vàng trong giao tiếp</h3><p class=\"first\"><b>Ngừng việc chờ đến lượt để nói. Hãy thực sự lắng nghe.</b></p><p><i>Quy tắc:</i> khi đối phương phát biểu xong, bạn <b>phải đặt ít nhất một câu hỏi đào sâu</b> về chính điều họ vừa chia sẻ. Chỉ sau khi họ trả lời xong câu hỏi đó, bạn mới được phép đưa ra ý kiến cá nhân của mình.</p><h3>Kỹ thuật tạo không gian</h3><p>Khi người đối diện vừa dứt câu, đừng vội vàng nhảy vào lấp đầy khoảng trống ngay lập tức. Hãy giữ im lặng từ <b>2 đến 3 giây</b>. Khoảng lặng này tạo ra một không gian an toàn, cho phép cuộc trò chuyện thở và kích thích đối phương bộc lộ những tâm tư ở tầng sâu hơn.</p><h3>Trò chơi rèn luyện: từ cuối, chữ cái cuối</h3><p>Để triệt phá thói quen não bộ tự chuẩn bị câu trả lời khi người khác đang nói, hãy chơi trò chơi này với bạn đồng hành:</p><ul><li>Bạn chỉ được phép bắt đầu câu nói của mình bằng <b>từ cuối cùng</b> (hoặc chữ cái cuối cùng) trong câu nói của người kia.</li><li><i>Tác dụng:</i> buộc não bộ phải tập trung 100% vào từng từ cuối cùng của đối phương thay vì lo chuẩn bị ý để nói tiếp.</li></ul><hr><h2>5.2. Dành cho người hay thu mình, sợ bị từ chối trong nhóm đông</h2><h3>Tách bạch giá trị ý tưởng và giá trị bản thân</h3><p>Hãy ghi nhớ: <b>một ý tưởng bị bác bỏ không có nghĩa là bản thân bạn bị từ chối.</b> Ý tưởng chỉ là một sản phẩm thử nghiệm, không phải là con người bạn.</p><figure class=\"svgfig\"><svg viewBox=\"0 0 480 200\" role=\"img\" aria-label=\"Hai khối đối lập ngăn cách bởi dấu khác nhau\"><defs><marker id=\"a4\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L7 4L0 8z\" style=\"fill:var(--muted)\"/></marker></defs>\n<rect x=\"10\" y=\"12\" width=\"190\" height=\"104\" rx=\"18\" class=\"panel\"/><rect x=\"280\" y=\"12\" width=\"190\" height=\"104\" rx=\"18\" class=\"panel\"/>\n<text x=\"105\" y=\"42\" text-anchor=\"middle\" class=\"b\" font-size=\"15\">Ý tưởng bị từ chối</text>\n<text x=\"375\" y=\"42\" text-anchor=\"middle\" class=\"b\" font-size=\"15\">Bản thân bị từ chối</text>\n<text x=\"240\" y=\"70\" text-anchor=\"middle\" font-size=\"40\" font-weight=\"600\" style=\"fill:var(--danger)\">≠</text>\n<g class=\"m\" font-size=\"13\" text-anchor=\"middle\"><text x=\"105\" y=\"76\">Chỉ là một sản phẩm</text><text x=\"105\" y=\"96\">thử nghiệm</text>\n<text x=\"375\" y=\"76\">Con người bạn</text><text x=\"375\" y=\"96\">không bị đụng đến</text></g>\n<path d=\"M105 118v22\" class=\"arrow\" marker-end=\"url(#a4)\"/><path d=\"M375 118v22\" class=\"arrow\" marker-end=\"url(#a4)\"/>\n<rect x=\"10\" y=\"144\" width=\"190\" height=\"44\" rx=\"14\" class=\"chip\"/><rect x=\"280\" y=\"144\" width=\"190\" height=\"44\" rx=\"14\" class=\"chip\"/>\n<g font-size=\"13\" text-anchor=\"middle\" class=\"b\"><text x=\"105\" y=\"171\" style=\"fill:var(--brand-strong)\">Dữ liệu để cải thiện</text><text x=\"375\" y=\"171\" style=\"fill:var(--danger)\">Tư duy sai cần bỏ</text></g>\n</svg><figcaption>Tách ý tưởng ra khỏi con người mình: bị bác ý tưởng không phải bị bác bỏ bản thân.</figcaption></figure><h3>Mẹo hòa nhập đám đông không áp lực</h3><ul><li><b>Không cần áp lực phải kể chuyện của mình ngay:</b> khi tham gia vào một nhóm đông, bạn không cần phải cố gắng trở thành người nổi bật nhất.</li><li><b>Bắt nhịp bằng sự tò mò:</b> hãy lắng nghe và đặt những câu hỏi thể hiện sự quan tâm chân thành đến chủ đề người khác đang nói. Việc này giúp bạn làm nóng máy và hòa nhập vào dòng chảy câu chuyện một cách tự nhiên.</li></ul><h3>Rèn luyện tư duy ứng biến với nguyên tắc Đúng vậy, và...</h3><p>Chấp nhận sự bất định trong mọi cuộc hội thoại. Khi ai đó đưa ra một ý tưởng hoặc câu chuyện, thay vì phủ nhận bằng <i>Nhưng mà...</i>, hãy đón nhận và phát triển nó bằng <i>Đúng vậy, và tôi thấy...</i>. Thói quen này giúp bạn xây dựng sự tự tin vào khả năng phản ứng tự nhiên của bản thân.</p>"
},

"t": "Kế hoạch hành động 7 ngày: cầm lại cây bút của chính bạn",
"body": "<h2>Thông điệp cốt lõi: Take Your Pen Back</h2><p class=\"first\">Mỗi chúng ta đều là tác giả của cuốn sách đời mình. Rất nhiều người trong chúng ta đã vô tình trao cây bút viết nên giá trị bản thân cho đánh giá của người khác, cho sự tự tin giả tạo hoặc cho những nỗi sợ hãi trong quá khứ.</p><p>Đã đến lúc bạn <b>cầm lại cây bút của chính mình</b>. Hãy đặt dấu chấm hết cho những chương cũ đầy tự tin ngập ngừng, và bắt đầu viết nên những chương mới với phong thái tự chủ, bản lĩnh và thuyết phục.</p><hr><h2>Bảng checklist thực hành 7 ngày nâng tầm giao tiếp</h2><div class=\"tbl wide week\"><table><thead><tr><th>Ngày</th><th>Mục tiêu rèn luyện</th><th>Hành động cụ thể</th><th>Xong</th></tr></thead><tbody><tr><td data-label=\"Ngày\">Ngày 1</td><td data-label=\"Mục tiêu rèn luyện\">Nhận diện từ đệm</td><td data-label=\"Hành động cụ thể\">Quay video 3 phút kể về ngày của bạn. Đếm chính xác số lần bạn dùng ừm, à, kiểu như.</td><td data-label=\"Xong\"><span class=\"chk\" role=\"img\" aria-label=\"Chưa hoàn thành\"></span></td></tr><tr><td data-label=\"Ngày\">Ngày 2</td><td data-label=\"Mục tiêu rèn luyện\">Thực hành khoảng lặng</td><td data-label=\"Hành động cụ thể\">Trong mọi cuộc nói chuyện hôm nay, bắt buộc dừng lại 2 giây trước khi đưa ra câu trả lời.</td><td data-label=\"Xong\"><span class=\"chk\" role=\"img\" aria-label=\"Chưa hoàn thành\"></span></td></tr><tr><td data-label=\"Ngày\">Ngày 3</td><td data-label=\"Mục tiêu rèn luyện\">Áp dụng khung 3-2-1</td><td data-label=\"Hành động cụ thể\">Dùng công thức 3-2-1 ít nhất một lần khi trả lời câu hỏi trong cuộc họp hoặc giao tiếp.</td><td data-label=\"Xong\"><span class=\"chk\" role=\"img\" aria-label=\"Chưa hoàn thành\"></span></td></tr><tr><td data-label=\"Ngày\">Ngày 4</td><td data-label=\"Mục tiêu rèn luyện\">Giải phóng thể chất</td><td data-label=\"Hành động cụ thể\">Thực hiện 20 lần nhảy bật cóc hoặc 10 lần chống đẩy trước một sự kiện quan trọng.</td><td data-label=\"Xong\"><span class=\"chk\" role=\"img\" aria-label=\"Chưa hoàn thành\"></span></td></tr><tr><td data-label=\"Ngày\">Ngày 5</td><td data-label=\"Mục tiêu rèn luyện\">Làm chủ ngôn ngữ cơ thể</td><td data-label=\"Hành động cụ thể\">Giữ hai chân rộng bằng vai, bỏ thói quen đút tay túi quần và thực hành tư thế tay ngửa, tay úp.</td><td data-label=\"Xong\"><span class=\"chk\" role=\"img\" aria-label=\"Chưa hoàn thành\"></span></td></tr><tr><td data-label=\"Ngày\">Ngày 6</td><td data-label=\"Mục tiêu rèn luyện\">Thử giọng Người huấn luyện</td><td data-label=\"Hành động cụ thể\">Dùng sắc thái Người huấn luyện ở mức năng lượng 6/10 để đưa ra một hướng dẫn rõ ràng.</td><td data-label=\"Xong\"><span class=\"chk\" role=\"img\" aria-label=\"Chưa hoàn thành\"></span></td></tr><tr><td data-label=\"Ngày\">Ngày 7</td><td data-label=\"Mục tiêu rèn luyện\">Lắng nghe sâu</td><td data-label=\"Hành động cụ thể\">Đặt ít nhất một câu hỏi đào sâu về điều người khác vừa nói trước khi chia sẻ ý kiến cá nhân.</td><td data-label=\"Xong\"><span class=\"chk\" role=\"img\" aria-label=\"Chưa hoàn thành\"></span></td></tr></tbody></table></div><div class=\"sign\"><div><span>Ngày hoàn thành kế hoạch</span></div><div><span>Xác nhận cam kết thay đổi</span></div></div>"
}
];
/* ====================================================== */

var $=function(i){return document.getElementById(i)};
var root=document.documentElement;
var FS0=innerWidth<=640?20:21;
var S={ch:0,fs:FS0,lh:1.63,w:680,theme:null,fsSet:false};
var KEY="reader:giao-tiep-tu-tin";
try{var sv=JSON.parse(localStorage.getItem("reader")||"{}");for(var k in sv)if(k in S&&k!=="fs")S[k]=sv[k];if(sv.v===2&&typeof sv.fs==="number"){S.fs=Math.min(36,Math.max(15,sv.fs));S.fsSet=true}S.theme=window.__theme0||null;
if([600,680,760].indexOf(S.w)<0)S.w=680;if([1.5,1.63,1.85].indexOf(S.lh)<0)S.lh=1.63;
var pos=JSON.parse(localStorage.getItem(KEY)||"{}");if(typeof pos.ch==="number"&&pos.ch<CH.length)S.ch=pos.ch;var savedY=pos.y||0}catch(e){var savedY=0}
if(location.hash){var h=parseInt(location.hash.slice(3),10);if(h>0&&h<=CH.length){S.ch=h-1;savedY=0}}

function save(){try{localStorage.setItem("reader",JSON.stringify({v:2,fs:S.fsSet?S.fs:undefined,lh:S.lh,w:S.w,theme:S.theme}))}catch(e){}}
function applyPrefs(){
  root.style.setProperty("--fs",S.fs+"px");root.style.setProperty("--lh",S.lh);if($("fsVal"))$("fsVal").textContent=S.fs;
  root.style.setProperty("--measure",S.w+"px");
  if(S.theme)root.setAttribute("data-theme",S.theme);syncQuick();
  [["wSeg",String(S.w)],["lhSeg",String(S.lh)],["thSeg",S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")]].forEach(function(p){
    [].forEach.call($(p[0]).querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-v")===p[1])});
  });
}

function render(y){
  var c=CH[S.ch];
  $("page").innerHTML='<p class="kicker">'+(c.k||('Chương '+(S.ch+1)+' / '+CH.length))+'</p><h1>'+c.t+'</h1>'+c.body;
  $("barTitle").textContent=BOOK.title;
  document.title=c.t+" · "+BOOK.title;
  $("pager").innerHTML=
    (S.ch>0?'<a class="prev" href="#ch'+S.ch+'" data-go="'+(S.ch-1)+'"><small>← Chương trước</small><strong>'+CH[S.ch-1].t+'</strong></a>':'')+
    (S.ch<CH.length-1?'<a class="next" href="#ch'+(S.ch+2)+'" data-go="'+(S.ch+1)+'"><small>Chương sau →</small><strong>'+CH[S.ch+1].t+'</strong></a>':'');
  $("end").textContent=S.ch===CH.length-1?"Hết sách. Cảm ơn bạn đã đọc.":"";
  [].forEach.call($("tocList").querySelectorAll("a"),function(a,i){if(i===S.ch)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current")});
  window.scrollTo(0,y||0);progress();
}
function go(i){if(i<0||i>=CH.length)return;S.ch=i;history.replaceState(null,"","#ch"+(i+1));render(0);closeAll();$("page").focus({preventScroll:true})}

function progress(){
  var h=document.documentElement.scrollHeight-innerHeight;
  var p=h>0?Math.min(100,Math.max(0,scrollY/h*100)):100;
  var total=(S.ch+p/100)/CH.length*100;
  $("prog").style.width=p+"%";$("prog").setAttribute("aria-valuenow",Math.round(p));
  $("pct").textContent=Math.round(total)+"%";
}
var lastY=0,tick;
addEventListener("scroll",function(){
  progress();
  clearTimeout(tick);tick=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify({ch:S.ch,y:Math.round(scrollY)}))}catch(e){}},300);
},{passive:true});

/* mục lục */
$("tocList").innerHTML=CH.map(function(c,i){return '<li><a href="#ch'+(i+1)+'" data-go="'+i+'"><span>'+(c.n!=null?c.n:i+1)+'</span>'+c.t+'</a></li>'}).join("");
document.addEventListener("click",function(e){var a=e.target.closest("[data-go]");if(a){e.preventDefault();go(+a.getAttribute("data-go"))}});

function closeAll(){["toc","set"].forEach(function(i){$(i).classList.remove("on");$(i).setAttribute("aria-hidden","true")});$("scrim").classList.remove("on");$("openToc").setAttribute("aria-expanded","false");$("openSet").setAttribute("aria-expanded","false")}
function open(id,btn,scrim){var on=$(id).classList.contains("on");closeAll();if(!on){$(id).classList.add("on");$(id).setAttribute("aria-hidden","false");$(btn).setAttribute("aria-expanded","true");if(scrim)$("scrim").classList.add("on")}}
$("openToc").onclick=function(){open("toc","openToc",true)};
$("openSet").onclick=function(){open("set","openSet",false)};
$("scrim").onclick=closeAll;

/* tùy chỉnh */
$("fsUp").onclick=function(){S.fs=Math.min(36,S.fs+2);S.fsSet=true;save();applyPrefs()};
$("fsDown").onclick=function(){S.fs=Math.max(15,S.fs-2);S.fsSet=true;save();applyPrefs()};
function seg(id,key,num){$(id).addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var v=b.getAttribute("data-v");S[key]=num?parseFloat(v):v;save();applyPrefs()})}
seg("wSeg","w",true);seg("lhSeg","lh",true);seg("thSeg","theme");
var ICON_MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',ICON_SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function isDarkNow(){return (S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark"}
function syncQuick(){var b=$("themeQuick");if(!b)return;var dk=isDarkNow();b.setAttribute("aria-label",dk?"Chuyển sang nền sáng":"Chuyển sang nền tối");b.innerHTML=dk?ICON_SUN:ICON_MOON}
$("themeQuick").onclick=function(){S.theme=isDarkNow()?"light":"dark";try{localStorage.setItem("theme",S.theme)}catch(e){}save();applyPrefs()};
syncQuick();

/* phím tắt: ←/→ chương, T mục lục, Esc đóng */
addEventListener("keydown",function(e){
  if(e.target.closest("input,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Escape")closeAll();
  else if(e.key==="ArrowRight"&&S.ch<CH.length-1)go(S.ch+1);
  else if(e.key==="ArrowLeft"&&S.ch>0)go(S.ch-1);
  else if(e.key==="t"||e.key==="T")$("openToc").click();
});

applyPrefs();render(savedY);
</script>
</body>
</html>
